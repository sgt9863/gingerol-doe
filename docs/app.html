  ].join("\n"),
  "scripts/04_optimize.py": [
    "\"\"\"",
    "04_optimize.py — デザインスペース判定 ＋ 最大余裕点（推奨条件）",
    "",
    "依存は numpy のみ（01_model を呼ぶ。Python in Excel にも貼れる構成）。",
    "",
    "やること（references/decisions.md 指摘2・指摘4）:",
    "  1. T-φ-F 空間を格子で評価し、各点が合格条件を満たすか判定する",
    "       合格条件（config.acceptance_criteria）:",
    "         (a) Rs_min = min{Rs1, Rs2} ≥ Rs_min_th        （分離できているか）",
    "         (b) t_R(TP) ≤ tR_TP_max                       （目的ピークが時間内に出るか）",
    "         (c) max(t_R 全3本) ≤ tR_last_max              （最遅ピークが洗浄前に出るか）",
    "       → 3つ全部 True の点の集合が「デザインスペース（合格領域）」。",
    "  2. その合格領域の中で「境界から最も遠い点」＝最大余裕点を推奨条件として返す（ICH Q8）。",
    "       境界からの距離 = 各因子を正規化した空間での、最寄りの不合格点までの距離。",
    "       これが最大の点ほど、条件がブレても合格に留まりやすい（最もロバスト）。",
    "",
    "「余裕（margin）」の測り方:",
    "  各因子を範囲幅で 0〜1 に正規化してから距離を測る（単位の違いを吸収）。",
    "  例: T は 40〜60℃ を 0〜1、φ は 0.38〜0.52 を 0〜1 に。",
    "  合格点 p の余裕 = min( 全ての不合格点との正規化距離 )。",
    "  ＝「どの方向にブレたら最初に不合格になるか、その一番近い崖までの距離」。",
    "  この余裕が最大の合格点を選ぶ。",
    "\"\"\"",
    "",
    "import numpy as np",
    "",
    "",
    "# ──────────────────────────────",
    "# 格子の生成",
    "# ──────────────────────────────",
    "def expand_factors(factors, extrapolate=0.0):",
    "    \"\"\"各因子の範囲を上下に extrapolate 割合だけ広げた factors を返す（外挿評価用）。",
    "    F は流速なので下限が正に留まるよう 0.05 でクランプする。\"\"\"",
    "    out = {}",
    "    for f, spec in factors.items():",
    "        lo, hi = spec[\"low\"], spec[\"high\"]",
    "        span = hi - lo",
    "        new_lo, new_hi = lo - extrapolate * span, hi + extrapolate * span",
    "        if f == \"F\":",
    "            new_lo = max(new_lo, 0.05)",
    "        out[f] = {**spec, \"low\": new_lo, \"high\": new_hi}",
    "    return out",
    "",
    "",
    "def make_grid(factors, n=21):",
    "    \"\"\"",
    "    factors（T/phi/F の low,high を持つ dict）から (n×n×n) の評価格子を作る。",
    "    戻り値: (TT, PP, FF) いずれも 1次元に潰した同じ長さの配列 ＋ 各軸の値。",
    "    \"\"\"",
    "    T_ax = np.linspace(factors[\"T\"][\"low\"], factors[\"T\"][\"high\"], n)",
    "    P_ax = np.linspace(factors[\"phi\"][\"low\"], factors[\"phi\"][\"high\"], n)",
    "    F_ax = np.linspace(factors[\"F\"][\"low\"], factors[\"F\"][\"high\"], n)",
    "    TT, PP, FF = np.meshgrid(T_ax, P_ax, F_ax, indexing=\"ij\")",
    "    return TT.ravel(), PP.ravel(), FF.ravel(), (T_ax, P_ax, F_ax)",
    "",
    "",
    "def _in_range_mask(T, phi, F, factors):",
    "    \"\"\"各点が元の因子範囲（検証済み領域）内かどうかの bool 配列。\"\"\"",
    "    return (",
    "        (T >= factors[\"T\"][\"low\"] - 1e-9) & (T \u003c= factors[\"T\"][\"high\"] + 1e-9)",
    "        & (phi >= factors[\"phi\"][\"low\"] - 1e-9) & (phi \u003c= factors[\"phi\"][\"high\"] + 1e-9)",
    "        & (F >= factors[\"F\"][\"low\"] - 1e-9) & (F \u003c= factors[\"F\"][\"high\"] + 1e-9)",
    "    )",
    "",
    "",
    "# ──────────────────────────────",
    "# 合格判定",
    "# ──────────────────────────────",
    "def evaluate_grid(model_mod, peaks, factors, Vm, L_mm, criteria, n=21, day=0,",
    "                  extrapolate=0.0, target=\"TP\", interfering=None):",
    "    \"\"\"",
    "    格子の全点で目的＋夾雑ピークを予測し、合格条件を判定する（夾雑ピーク数は任意）。",
    "    extrapolate>0 のとき、評価格子だけ因子範囲の外まで広げる（外挿。検証外の予測）。",
    "    戻り値 dict:",
    "      T, phi, F        : 各点の実条件（1次元配列）",
    "      Rs_min           : 各点の 全夾雑ピークに対する Rs の最小",
    "      tR_TP, tR_last   : 目的ピーク保持時間 / 最遅ピーク保持時間（全ピークの max）",
    "      pass_mask        : 合格条件を満たすか（bool 配列）＝デザインスペース",
    "      in_range         : 元の因子範囲（検証済み）内か。推奨条件はここからのみ選ぶ",
    "      axes             : (T_ax, P_ax, F_ax)",
    "    \"\"\"",
    "    if interfering is None:",
    "        interfering = [k for k in peaks.keys() if k != target]",
    "    eval_factors = expand_factors(factors, extrapolate) if extrapolate > 0 else factors",
    "    T, phi, F, axes = make_grid(eval_factors, n=n)",
    "    in_range = _in_range_mask(T, phi, F, factors)",
    "    sep = model_mod.separation(peaks, T, phi, F, Vm, L_mm, day=day,",
    "                               target=target, interfering=interfering)",
    "",
    "    tR_TP = sep[target][\"tR\"]",
    "    # クロスオーバー対応: 最遅ピークは全ピークの max（溶出順が入れ替わるため）",
    "    tR_last = np.maximum.reduce([sep[nm][\"tR\"] for nm in [target] + list(interfering)])",
    "",
    "    # 合格条件: Rs_min と t_R(TP)。",
    "    # tR_last_max は「データ取り段階の洗浄前制約」であってデザインスペースの合否ではないため、",
    "    # criteria に与えられた場合のみ任意で適用する（既定は不使用）。",
    "    pass_mask = (sep[\"Rs_min\"] >= criteria[\"Rs_min\"]) & (tR_TP \u003c= criteria[\"tR_TP_max\"])",
    "    if criteria.get(\"tR_last_max\") is not None:",
    "        pass_mask = pass_mask & (tR_last \u003c= criteria[\"tR_last_max\"])",
    "    return {",
    "        \"T\": T, \"phi\": phi, \"F\": F,",
    "        \"Rs_min\": sep[\"Rs_min\"],",
    "        \"tR_TP\": tR_TP, \"tR_last\": tR_last,",
    "        \"pass_mask\": pass_mask,",
    "        \"in_range\": in_range,",
    "        \"axes\": axes,",
    "    }",
    "",
    "",
    "# ──────────────────────────────",
    "# 最大余裕点",
    "# ──────────────────────────────",
    "def _normalize(T, phi, F, factors):",
    "    \"\"\"各因子を範囲幅で 0〜1 に正規化（距離計算で単位差を吸収）。\"\"\"",
    "    def norm(x, f):",
    "        lo, hi = factors[f][\"low\"], factors[f][\"high\"]",
    "        return (np.asarray(x, dtype=float) - lo) / (hi - lo)",
    "    return np.column_stack([norm(T, \"T\"), norm(phi, \"phi\"), norm(F, \"F\")])",
    "",
    "",
    "def _edge_distance(pass_pts):",
    "    \"\"\"各点から因子範囲の壁（正規化 0 と 1 の面）までの最短距離。",
    "    各軸で min(x, 1-x)、その軸間の最小が最寄りの壁。範囲の端ほど 0 に近い。\"\"\"",
    "    return np.minimum(pass_pts, 1.0 - pass_pts).min(axis=1)",
    "",
    "",
    "def _grid_bounds(grid_result):",
    "    \"\"\"評価格子の外周（外挿込みの実際の探索範囲）を factors 形式で返す。\"\"\"",
    "    T_ax, P_ax, F_ax = grid_result[\"axes\"]",
    "    return {\"T\": {\"low\": float(T_ax[0]), \"high\": float(T_ax[-1])},",
    "            \"phi\": {\"low\": float(P_ax[0]), \"high\": float(P_ax[-1])},",
    "            \"F\": {\"low\": float(F_ax[0]), \"high\": float(F_ax[-1])}}",
    "",
    "",
    "def max_margin_point(grid_result, factors, restrict_range=True):",
    "    \"\"\"",
    "    合格領域の中で「最寄りの崖まで最も遠い」点を返す（最大余裕点）。",
    "    崖 = 合格条件を破る不合格点 ＋ 探索範囲の壁（端。外挿を避けるため崖扱い）。",
    "    restrict_range=True … 推奨は検証済みの元範囲内（in_range）からのみ選ぶ。",
    "    restrict_range=False … 外挿格子を含む全域から選ぶ（壁は外挿込みの格子外周）。",
    "    戻り値 dict: T, phi, F（推奨条件）, margin（正規化空間での余裕）, index。",
    "    合格点が無ければ None。",
    "    \"\"\"",
    "    mask = grid_result[\"pass_mask\"]",
    "    in_range = grid_result.get(\"in_range\")",
    "    if restrict_range and in_range is not None:",
    "        cand_mask = mask & in_range",
    "        norm_factors = factors          # 元範囲で正規化（壁＝元範囲の端）",
    "    else:",
    "        cand_mask = mask",
    "        norm_factors = _grid_bounds(grid_result)  # 外挿込み格子外周を壁にする",
    "    if not cand_mask.any():",
    "        return None",
    "",
    "    coords = _normalize(grid_result[\"T\"], grid_result[\"phi\"], grid_result[\"F\"], norm_factors)",
    "    pass_pts = coords[cand_mask]        # 推奨候補は元範囲内の合格点のみ",
    "    fail_pts = coords[~mask]            # 崖は不合格点（外挿域も含む）",
    "",
    "    # (1) 因子範囲の壁までの距離（端も崖として扱う）",
    "    edge_margin = _edge_distance(pass_pts)",
    "",
    "    # (2) 最寄りの不合格点までの距離。",
    "    #     KDTree（最近傍探索）で O(N log N) に。細かい格子でも高速。",
    "    if len(fail_pts) == 0:",
    "        fail_margin = np.full(len(pass_pts), np.inf)",
    "    else:",
    "        try:",
    "            from scipy.spatial import cKDTree",
    "            fail_margin, _ = cKDTree(fail_pts).query(pass_pts, k=1)",
    "        except ImportError:",
    "            # scipy が無い環境（Excel貼付など）はチャンク全ペアで代替",
    "            fail_margin = np.empty(len(pass_pts))",
    "            chunk = 2000",
    "            for s in range(0, len(pass_pts), chunk):",
    "                blk = pass_pts[s:s + chunk]",
    "                d = np.linalg.norm(blk[:, None, :] - fail_pts[None, :, :], axis=2)",
    "                fail_margin[s:s + chunk] = d.min(axis=1)",
    "",
    "    # 余裕 = 2種類の崖までの距離の小さい方（最初にぶつかる崖まで）",
    "    margins = np.minimum(edge_margin, fail_margin)",
    "    best_local = int(np.argmax(margins))",
    "    margin = float(margins[best_local])",
    "",
    "    # 候補部分集合の index を全体 index に戻す",
    "    global_idx = np.flatnonzero(cand_mask)[best_local]",
    "    return {",
    "        \"T\": float(grid_result[\"T\"][global_idx]),",
    "        \"phi\": float(grid_result[\"phi\"][global_idx]),",
    "        \"F\": float(grid_result[\"F\"][global_idx]),",
    "        \"margin\": margin,",
    "        \"index\": int(global_idx),",
    "    }",
    "",
    "",
    "# ──────────────────────────────",
    "# 変動範囲（ロバスト箱）を満たす点の中での最適化",
    "# ──────────────────────────────",
    "def _reshape_to_grid(arr, axes):",
    "    \"\"\"1次元（meshgrid indexing=\"ij\" 由来）を (nT, nφ, nF) の3次元に戻す。\"\"\"",
    "    nt, npp, nf = len(axes[0]), len(axes[1]), len(axes[2])",
    "    return np.asarray(arr).reshape(nt, npp, nf)",
    "",
    "",
    "def robust_box_mask(grid_result, delta):",
    "    \"\"\"",
    "    各格子点を中心にした「変動範囲の箱」（各因子 ±delta[f]）の全域が合格かを返す。",
    "    ＝合格マスクを箱サイズで収縮（erosion）した bool 配列。",
    "    箱が評価格子の外にはみ出す端の点は「保証できない」ので不合格（=非ロバスト）扱い。",
    "    delta は {\"T\":℃, \"phi\":分率, \"F\":mL/min} の半幅。0 の因子はその軸方向に広げない。",
    "    \"\"\"",
    "    axes = grid_result[\"axes\"]",
    "    pass3d = _reshape_to_grid(grid_result[\"pass_mask\"], axes).astype(float)",
    "    sizes = []",
    "    for ax, f in zip(axes, [\"T\", \"phi\", \"F\"]):",
    "        step = (ax[1] - ax[0]) if len(ax) > 1 else 1.0",
    "        k = int(np.floor((delta.get(f, 0.0)) / step + 1e-9)) if step > 0 else 0",
    "        sizes.append(2 * k + 1)            # ±k 格子 → 箱の一辺",
    "    try:",
    "        from scipy.ndimage import minimum_filter",
    "        eroded = minimum_filter(pass3d, size=sizes, mode=\"constant\", cval=0.0)",
    "    except ImportError:",
    "        eroded = pass3d                    # scipy 無し（Excel貼付）は収縮なしで代替",
    "    return (eroded >= 0.5).ravel()",
    "",
    "",
    "def _candidate_mask(grid_result, robust, restrict_range=True):",
    "    \"\"\"推奨候補 = ロバスト合格（restrict_range なら さらに検証済み範囲内 in_range）。\"\"\"",
    "    in_range = grid_result.get(\"in_range\")",
    "    if restrict_range and in_range is not None:",
    "        return robust & in_range",
    "    return robust",
    "",
    "",
    "def _pack(grid_result, idx, extra):",
    "    \"\"\"格子 index から推奨条件 dict を組む。\"\"\"",
    "    out = {",
    "        \"T\": float(grid_result[\"T\"][idx]),",
    "        \"phi\": float(grid_result[\"phi\"][idx]),",
    "        \"F\": float(grid_result[\"F\"][idx]),",
    "        \"index\": int(idx),",
    "    }",
    "    out.update(extra)",
    "    return out",
    "",
    "",
    "def fastest_tR_point(grid_result, delta, restrict_range=True):",
    "    \"\"\"変動範囲の箱が全域合格な点のうち、t_R(TP) が最速の点を返す。無ければ None。\"\"\"",
    "    cand = _candidate_mask(grid_result, robust_box_mask(grid_result, delta), restrict_range)",
    "    if not cand.any():",
    "        return None",
    "    idx = np.flatnonzero(cand)",
    "    best = int(idx[np.argmin(grid_result[\"tR_TP\"][idx])])",
    "    return _pack(grid_result, best, {\"objective\": float(grid_result[\"tR_TP\"][best])})",
    "",
    "",
    "def min_acn_point(grid_result, delta, restrict_range=True):",
    "    \"\"\"変動範囲の箱が全域合格な点のうち、TP 溶出までの ACN 消費量が最小の点を返す。",
    "    ACN 消費量 = φ × F × t_R(TP)（移動相通液量 F·t_R に ACN 分率 φ を掛けた体積 [mL]）。\"\"\"",
    "    cand = _candidate_mask(grid_result, robust_box_mask(grid_result, delta), restrict_range)",
    "    if not cand.any():",
    "        return None",
    "    acn = grid_result[\"phi\"] * grid_result[\"F\"] * grid_result[\"tR_TP\"]",
    "    idx = np.flatnonzero(cand)",
    "    best = int(idx[np.argmin(acn[idx])])",
    "    return _pack(grid_result, best, {\"objective\": float(acn[best])})",
    "",
    "",
    "def recommend(grid_result, factors, mode=\"robust\", delta=None, restrict_range=True):",
    "    \"\"\"最適化基準を選んで推奨条件を返す。",
    "      mode=\"robust\"     … 最大余裕点（不合格領域から最も遠い）",
    "      mode=\"fastest_tR\" … 変動範囲全域が合格で t_R(TP) 最速（delta 必須）",
    "      mode=\"min_acn\"    … 変動範囲全域が合格で ACN 消費量最小（delta 必須）",
    "    restrict_range=True … 推奨は検証済み範囲内から。False で外挿域も推奨候補に含める。",
    "    \"\"\"",
    "    if mode == \"robust\":",
    "        return max_margin_point(grid_result, factors, restrict_range=restrict_range)",
    "    if mode == \"fastest_tR\":",
    "        return fastest_tR_point(grid_result, delta or {}, restrict_range=restrict_range)",
    "    if mode == \"min_acn\":",
    "        return min_acn_point(grid_result, delta or {}, restrict_range=restrict_range)",
    "    raise ValueError(f\"unknown mode: {mode}\")",
    "",
    "",
    "def optimize(model_mod, peaks, factors, Vm, L_mm, criteria, n=21, day=0,",
    "             extrapolate=0.0, target=\"TP\", interfering=None,",
    "             mode=\"robust\", delta=None, restrict_range=True):",
    "    \"\"\"格子評価 → 推奨条件までを一括実行。戻り値: (grid_result, recommend dict or None)。",
    "    extrapolate>0 で評価格子を因子範囲の外まで広げる。",
    "    restrict_range=True なら推奨は元範囲内から、False なら外挿域も候補に含める。",
    "    mode で最適化基準を選ぶ（robust / fastest_tR / min_acn）。",
    "    夾雑ピーク数は interfering で任意（None なら target 以外すべて）。\"\"\"",
    "    grid = evaluate_grid(model_mod, peaks, factors, Vm, L_mm, criteria, n=n, day=day,",
    "                         extrapolate=extrapolate, target=target, interfering=interfering)",
    "    rec = recommend(grid, factors, mode=mode, delta=delta, restrict_range=restrict_range)",
    "    return grid, rec",
    "",
    "",
    "# ──────────────────────────────",
    "# Rs の推定精度（誤差伝搬・モンテカルロ）",
    "# ──────────────────────────────",
    "def rs_confidence(model_mod, peaks, diagnostics, T, phi, F, Vm, L_mm,",
    "                  target=\"TP\", interfering=None, day=0,",
    "                  n_samples=600, ci=0.95, seed=0):",
    "    \"\"\"指定条件 (T,φ,F) での Rs_min の推定精度を誤差伝搬（モンテカルロ）で返す。",
    "    フィット係数を共分散から n_samples 回サンプルし、各回 Rs_min を再計算してばらつきを見る。",
    "    戻り値 dict: {'Rs_min':点推定, 'sd':標準偏差, 'lo','hi':信頼区間, 'samples':配列,",
    "                  'Rs_each_sd':{IP名:sd}}。",
    "    \"\"\"",
    "    if interfering is None:",
    "        interfering = [k for k in peaks.keys() if k != target]",
    "    rng = np.random.default_rng(seed)",
    "    base = model_mod.separation(peaks, T, phi, F, Vm, L_mm, day=day,",
    "                                target=target, interfering=interfering)",
    "    samples = np.empty(n_samples)",
    "    each = {ip: np.empty(n_samples) for ip in interfering}",
    "    for i in range(n_samples):",
    "        sp = model_mod.sample_peaks(peaks, diagnostics, rng, target, interfering)",
    "        s = model_mod.separation(sp, T, phi, F, Vm, L_mm, day=day,",
    "                                 target=target, interfering=interfering)",
    "        samples[i] = float(s[\"Rs_min\"])",
    "        for ip in interfering:",
    "            each[ip][i] = float(s[\"Rs_each\"][ip])",
    "    a = (1.0 - ci) / 2.0",
    "    lo, hi = np.quantile(samples, [a, 1.0 - a])",
    "    return {",
    "        \"Rs_min\": float(base[\"Rs_min\"]),",
    "        \"sd\": float(np.std(samples, ddof=1)),",
    "        \"lo\": float(lo), \"hi\": float(hi),",
    "        \"ci\": ci,",
    "        \"samples\": samples,",
    "        \"Rs_each_sd\": {ip: float(np.std(each[ip], ddof=1)) for ip in interfering},",
    "    }",
    "",
    "",
    "# ──────────────────────────────",
    "# 動作確認（合成パラメータでデザインスペースが出るか）",
    "# ──────────────────────────────",
    "def _load_module(path, name):",
    "    import importlib.util",
    "    spec = importlib.util.spec_from_file_location(name, path)",
    "    mod = importlib.util.module_from_spec(spec)",
    "    spec.loader.exec_module(mod)",
    "    return mod",
    "",
    "",
    "if __name__ == \"__main__\":",
    "    import os",
    "    here = os.path.dirname(__file__)",
    "    model_mod = _load_module(os.path.join(here, \"01_model.py\"), \"model01\")",
    "",
    "    Vm, L = 0.24, 100.0",
    "    factors = {",
    "        \"T\":   {\"low\": 40, \"high\": 60},",
    "        \"phi\": {\"low\": 0.38, \"high\": 0.52},",
    "        \"F\":   {\"low\": 0.4, \"high\": 0.8},",
    "    }",
    "    criteria = {\"Rs_min\": 2.0, \"tR_TP_max\": 7.5, \"tR_last_max\": 10.0}",
    "",
    "    # 交互作用入りの例パラメータ（クロスオーバーありの状況を模擬）",
    "    peaks = model_mod.example_peaks()",
    "    for name in (\"IP1\", \"TP\", \"IP2\"):",
    "        peaks[name][\"e\"] = 80.0",
    "",
    "    grid, rec = optimize(model_mod, peaks, factors, Vm, L, criteria, n=21)",
    "",
    "    n_pass = int(grid[\"pass_mask\"].sum())",
    "    n_total = grid[\"pass_mask\"].size",
    "    print(f\"格子点 {n_total} 点中、合格（デザインスペース内）= {n_pass} 点 \"",
    "          f\"（{100*n_pass/n_total:.1f}%）\")",
    "    print(f\"  Rs_min 範囲   = {grid['Rs_min'].min():.2f} 〜 {grid['Rs_min'].max():.2f}\")",
    "    print(f\"  t_R(TP) 範囲  = {grid['tR_TP'].min():.2f} 〜 {grid['tR_TP'].max():.2f} 分\")",

    "        print(\"\\n=== 推奨条件（最大余裕点）===\")",
    "        print(f\"  T   = {rec['T']:.1f} ℃\")",

    "        print(f\"  F   = {rec['F']:.2f} mL/min\")",
    "        print(f\"  余裕（正規化距離）= {rec['margin']:.3f}\")",
    "        # 推奨点での実際の分離を表示",
    "        s = model_mod.separation(peaks, rec[\"T\"], rec[\"phi\"], rec[\"F\"], Vm, L)",
    "        print(f\"  → Rs_min={float(s['Rs_min']):.2f}, \"",
    "              f\"t_R(TP)={float(s['TP']['tR']):.2f}分, \"",
    "              f\"最遅={float(max(s['TP']['tR'], s['IP1']['tR'], s['IP2']['tR'])):.2f}分\")",

  "scripts/05_designspace.py": [
    "\"\"\"",
    "05_designspace.py — デザインスペースの対話的 3D 可視化（plotly）",
    "",
    "依存: plotly。numpy / 01_model / 04_optimize を呼ぶ。",
    "plotly は Python in Excel 非対応のため、このスクリプトだけ通常 Python 環境専用。",
    "（Excel 側は 04_optimize の結果を matplotlib 等で静止画にする）",
    "",
    "出力:",
    "  outputs/designspace_3d.html  — ブラウザで開ける対話的 3D 散布図（回転・ズーム可）",
    "  outputs/designspace_3d.json  — 格子評価結果の軽量キャッシュ（任意）",
    "",
    "グラフの見方（配色は Viridis: 低Rs=紫 → 高Rs=黄）:",
    "  - 雲 = デザインスペース（合格領域）。色が明るい（黄寄り）ほど Rs_min が高く分離余裕が大きい",
    "    （既定は go.Volume の無段階ボリューム。cloud_style=\"scatter\" で散布点にも切替可）",
    "  - 壁の線 = Rs_min の等高線（太い黒線が Rs=2.0 の合格境界）",
    "  - 黒ドット = 推奨条件（最大余裕点）",
    "  軸: X=T[℃]、Y=φ（ACN 分率）、Z=F[mL/min]",
    "\"\"\"",
    "",
    "import os",
    "import numpy as np",
    "",
    "try:",
    "    import plotly.graph_objects as go",
    "    from plotly.subplots import make_subplots",
    "except ImportError as e:",
    "    raise ImportError(\"plotly が必要です: pip install plotly\") from e",
    "",
    "",
    "# ──────────────────────────────",
    "# 実験計画（設計点）の 3D 散布",
    "# ──────────────────────────────",
    "_DESIGN_COLORS = {",
    "    \"factorial\": \"#1f77b4\", \"axial\": \"#d62728\", \"center\": \"#2ca02c\",",
    "    \"bbd\": \"#17becf\", \"bridge_center\": \"#9467bd\",",
    "    \"augment_model\": \"#ff7f0e\", \"augment_rs\": \"#ff7f0e\",",
    "}",
    "",
    "",
    "def _cuboid_edges(Tl, Th, Pl, Ph, Fl, Fh):",
    "    \"\"\"直方体 [Tl,Th]×[Pl,Ph]×[Fl,Fh] の12辺を1本の線トレース用座標 (xs,ys,zs) で返す。\"\"\"",
    "    c = [(Tl, Pl, Fl), (Th, Pl, Fl), (Th, Ph, Fl), (Tl, Ph, Fl),",
    "         (Tl, Pl, Fh), (Th, Pl, Fh), (Th, Ph, Fh), (Tl, Ph, Fh)]",
    "    edges = [(0, 1), (1, 2), (2, 3), (3, 0), (4, 5), (5, 6), (6, 7), (7, 4),",
    "             (0, 4), (1, 5), (2, 6), (3, 7)]",
    "    xs, ys, zs = [], [], []",
    "    for a, b in edges:",
    "        xs += [c[a][0], c[b][0], None]",
    "        ys += [c[a][1], c[b][1], None]",
    "        zs += [c[a][2], c[b][2], None]",
    "    return xs, ys, zs",
    "",
    "",
    "def _box_edges(factors):",
    "    \"\"\"因子範囲 low/high の直方体（頂点が乗るべき箱）の12辺を返す。\"\"\"",
    "    return _cuboid_edges(factors[\"T\"][\"low\"], factors[\"T\"][\"high\"],",
    "                         factors[\"phi\"][\"low\"], factors[\"phi\"][\"high\"],",
    "                         factors[\"F\"][\"low\"], factors[\"F\"][\"high\"])",
    "",
    "",
    "def plot_design_points_3d(df, factors=None, title=\"実験計画（CCD）の配置\"):",
    "    \"\"\"CCD/D最適の設計点を 3D 散布で表示。type で色分け。",
    "    factors を渡すと「指定範囲 low/high の箱」も点線で描く（頂点がこの角に乗るのが正しい）。\"\"\"",
    "    fig = go.Figure()",
    "    if factors is not None:",
    "        xs, ys, zs = _box_edges(factors)",
    "        fig.add_trace(go.Scatter3d(",
    "            x=xs, y=ys, z=zs, mode=\"lines\", name=\"指定範囲 (low/high)\",",
    "            line=dict(color=\"rgba(80,80,80,0.6)\", width=3), hoverinfo=\"skip\"))",
    "    for t, sub in df.groupby(\"type\"):",
    "        fig.add_trace(go.Scatter3d(",
    "            x=sub[\"T\"], y=sub[\"phi\"], z=sub[\"F\"], mode=\"markers\", name=str(t),",
    "            marker=dict(size=5, color=_DESIGN_COLORS.get(str(t), \"#888888\")),",
    "            hovertemplate=\"type=%s\u003cbr>T=%%{x:.2f}\u003cbr>φ=%%{y:.3f}\u003cbr>F=%%{z:.3f}\u003cextra>\u003c/extra>\" % t))",
    "    fig.update_layout(",
    "        title=title, height=520, legend_title=\"点の種類\",",
    "        scene=dict(xaxis_title=\"T [℃]\", yaxis_title=\"φ (ACN分率)\", zaxis_title=\"F [mL/min]\"),",
    "        margin=dict(l=0, r=0, t=40, b=0))",
    "    return fig",
    "",
    "",
    "# ──────────────────────────────",
    "# 3D デザインスペースプロット",
    "# ──────────────────────────────",
    "WALL_LEVELS = [1.0, 1.5, 2.0, 2.5, 3.0]   # 壁に描く Rs_min の等高線レベル（既定）",
    "",
    "",
    "def build_levels(step, lo=0.5, hi=3.5):",
    "    \"\"\"Rs の等高線レベルを刻み step で作る。合格境界 2.0 を必ず含める。\"\"\"",
    "    step = max(float(step), 0.05)",
    "    kmin = int(np.floor((lo - 2.0) / step))",
    "    kmax = int(np.ceil((hi - 2.0) / step))",
    "    levels = [round(2.0 + k * step, 6) for k in range(kmin, kmax + 1)]",
    "    return [v for v in levels if lo - 1e-9 \u003c= v \u003c= hi + 1e-9]",
    "",
    "",
    "def _level_color(level, lo=0.0, hi=3.0):",
    "    \"\"\"Rs レベル → Viridis 上の色（低=紫→高=黄）。plotly のサンプラを使う。\"\"\"",
    "    from plotly.colors import sample_colorscale",
    "    t = (level - lo) / (hi - lo)",
    "    return sample_colorscale(\"Viridis\", [max(0.0, min(1.0, t))])[0]",
    "",
    "",
    "def _wall_contour_lines(model_mod, peaks, factors, Vm, L_mm, rec,",
    "                        which, n=81, day=0, wall_side=\"low\", levels=None,",
    "                        color_hi=3.0):",
    "    \"\"\"",
    "    箱の1つの壁に「等高線（ライン）」を描く Scatter3d トレース群を返す。",
    "    壁に垂直な因子を推奨値（rec）に固定し、残り2面内因子で Rs_min を計算、",
    "    matplotlib で等値線の座標を取り出して壁の平面に 3D ラインとして配置する。",
    "    Rs=2.0（合格境界）は太線で強調。",
    "",
    "    which: \"TP_floor\"(F壁・T-φ面) / \"TF_wall\"(φ壁・T-F面) / \"PF_wall\"(T壁・φ-F面)",
    "    wall_side: \"low\"=下限側の壁／\"high\"=上限側の壁（デザインスペースに近い面を選べる）",
    "    \"\"\"",
    "    import matplotlib",
    "    matplotlib.use(\"Agg\")            # 画面を使わず座標計算だけ",
    "    import matplotlib.pyplot as plt",
    "",
    "    T_lo, T_hi = factors[\"T\"][\"low\"], factors[\"T\"][\"high\"]",
    "    P_lo, P_hi = factors[\"phi\"][\"low\"], factors[\"phi\"][\"high\"]",
    "    F_lo, F_hi = factors[\"F\"][\"low\"], factors[\"F\"][\"high\"]",
    "    T_ax = np.linspace(T_lo, T_hi, n)",
    "    P_ax = np.linspace(P_lo, P_hi, n)",
    "    F_ax = np.linspace(F_lo, F_hi, n)",
    "    hi = (wall_side == \"high\")       # True なら上限側の壁に貼る",
    "",
    "    # 面内2軸 (a_ax, b_ax) で Rs を計算し、(a,b)→3D への射影関数 to_xyz を決める",
    "    if which == \"TP_floor\":          # T-φ 面、F=推奨値固定 → F の壁に置く",
    "        a_ax, b_ax = T_ax, P_ax",
    "        AA, BB = np.meshgrid(a_ax, b_ax)",
    "        Rs = model_mod.separation(peaks, AA, BB, rec[\"F\"], Vm, L_mm, day=day)[\"Rs_min\"]",
    "        F_wall = F_hi if hi else F_lo",
    "        to_xyz = lambda a, b: (a, b, np.full_like(a, F_wall))",
    "        wall_name = f\"F壁(F={rec['F']:.2f})\"",
    "    elif which == \"TF_wall\":         # T-F 面、φ=推奨値固定 → φ の壁に置く",
    "        a_ax, b_ax = T_ax, F_ax",
    "        AA, BB = np.meshgrid(a_ax, b_ax)",
    "        Rs = model_mod.separation(peaks, AA, rec[\"phi\"], BB, Vm, L_mm, day=day)[\"Rs_min\"]",
    "        P_wall = P_hi if hi else P_lo",
    "        to_xyz = lambda a, b: (a, np.full_like(a, P_wall), b)",
    "        wall_name = f\"φ壁(φ={rec['phi']:.3f})\"",
    "    else:                            # \"PF_wall\": φ-F 面、T=推奨値固定 → T の壁に置く",
    "        a_ax, b_ax = P_ax, F_ax",
    "        AA, BB = np.meshgrid(a_ax, b_ax)",
    "        Rs = model_mod.separation(peaks, rec[\"T\"], AA, BB, Vm, L_mm, day=day)[\"Rs_min\"]",
    "        T_wall = T_hi if hi else T_lo",
    "        to_xyz = lambda a, b: (np.full_like(a, T_wall), a, b)",
    "        wall_name = f\"T壁(T={rec['T']:.1f})\"",
    "",
    "    # matplotlib で等値線の座標（segments）を取得（描画はしない）",
    "    use_levels = WALL_LEVELS if levels is None else levels",
    "    fig_tmp, ax_tmp = plt.subplots()",
    "    cs = ax_tmp.contour(AA, BB, Rs, levels=use_levels)",
    "    traces = []",
    "    for level, segs in zip(cs.levels, cs.allsegs):",
    "        if not segs:",
    "            continue",
    "        is_pass = abs(level - 2.0) \u003c 1e-9",
    "        color = \"black\" if is_pass else _level_color(level, hi=max(color_hi, 2.5))",
    "        width = 6 if is_pass else 2.5",
    "        for seg in segs:",
    "            a, b = seg[:, 0], seg[:, 1]",
    "            x, y, z = to_xyz(a, b)",
    "            traces.append(go.Scatter3d(",
    "                x=x, y=y, z=z, mode=\"lines\",",
    "                line=dict(color=color, width=width),",
    "                name=(f\"{wall_name} Rs={level:g}\"",
    "                      + (\"（合格境界）\" if is_pass else \"\")),",
    "                showlegend=False,",
    "                hovertemplate=f\"Rs_min={level:g}\u003cextra>{wall_name}\u003c/extra>\",",
    "            ))",
    "    plt.close(fig_tmp)",
    "    return traces",
    "",
    "",
    "def _designspace_volume_trace(grid, criteria_Rs=2.0, surface_count=30):",
    "    \"\"\"",
    "    デザインスペースを「無段階の雲」として描く go.Volume トレース。",
    "    合格領域だけを残し（不合格点の値は 0 にして isomin で消す）、Rs_min で着色。",
    "    格子は make_grid の meshgrid(indexing='ij') 由来の規則格子である前提。",
    "    滑らかさ＝格子の細かさ（呼び出し側 n）× surface_count（等値層の枚数）。",
    "    \"\"\"",
    "    mask = grid[\"pass_mask\"]",
    "    # 合格点は Rs_min、不合格点は 0（isomin で描画対象外にする＝無色透明）",
    "    value = np.where(mask, grid[\"Rs_min\"], 0.0)",
    "    rs_max = float(grid[\"Rs_min\"][mask].max()) if mask.any() else 3.0",
    "    # 色スケールをデザインスペース内の Rs 範囲（境界〜最大）に引き伸ばす",
    "    #  → 内部で赤(ギリギリ合格)→緑(余裕大)の変化がはっきり出る。退化時は少し広げる。",
    "    cmin = float(criteria_Rs)",
    "    cmax = rs_max if rs_max > cmin + 1e-6 else cmin + 0.5",
    "    return go.Volume(",
    "        x=grid[\"T\"], y=grid[\"phi\"], z=grid[\"F\"], value=value,",
    "        isomin=criteria_Rs,                 # 合格境界（Rs≥2.0）から上だけ雲にする",
    "        isomax=rs_max,",
    "        opacity=0.10,                       # 半透明（無段階の靄）",
    "        opacityscale=\"uniform\",             # 層ごとの不透明度を均一にして靄を滑らかに",
    "        surface_count=surface_count,        # 等値層の枚数（多いほど滑らか）",
    "        colorscale=\"Viridis\", cmin=cmin, cmax=cmax,",
    "        caps=dict(x_show=False, y_show=False, z_show=False),",
    "        colorbar=dict(title=\"Rs_min\", thickness=15, len=0.6),",
    "        name=\"デザインスペース（雲）\",",
    "        hovertemplate=(\"T=%{x:.1f}℃\u003cbr>φ=%{y:.3f}\u003cbr>F=%{z:.2f}\u003cbr>\"",
    "                       \"Rs_min=%{value:.2f}\u003cextra>合格\u003c/extra>\"),",
    "    )",
    "",
    "",
    "def _auto_wall_side(grid, factor_key):",
    "    \"\"\"合格領域がどちら寄りかで壁の置き場所を自動判定。",
    "    合格点のその因子の重心が範囲中央より上なら上限側、下なら下限側に壁を置く",
    "    （等高線の壁をデザインスペースの近くに来させて見やすくする）。\"\"\"",
    "    mask = grid[\"pass_mask\"]",
    "    if not mask.any():",
    "        return \"low\"",
    "    vals = grid[factor_key][mask]",
    "    mid = 0.5 * (grid[factor_key].min() + grid[factor_key].max())",
    "    return \"high\" if vals.mean() >= mid else \"low\"",
    "",
    "",
    "def _validated_box_trace(factors):",
    "    \"\"\"検証済みの元因子範囲を表すワイヤーフレームの箱（12辺）。外挿域との境を示す。\"\"\"",
    "    Tl, Th = factors[\"T\"][\"low\"], factors[\"T\"][\"high\"]",
    "    Pl, Ph = factors[\"phi\"][\"low\"], factors[\"phi\"][\"high\"]",
    "    Fl, Fh = factors[\"F\"][\"low\"], factors[\"F\"][\"high\"]",
    "    c = [(Tl, Pl, Fl), (Th, Pl, Fl), (Th, Ph, Fl), (Tl, Ph, Fl),",
    "         (Tl, Pl, Fh), (Th, Pl, Fh), (Th, Ph, Fh), (Tl, Ph, Fh)]",
    "    edges = [(0, 1), (1, 2), (2, 3), (3, 0), (4, 5), (5, 6), (6, 7), (7, 4),",
    "             (0, 4), (1, 5), (2, 6), (3, 7)]",
    "    xs, ys, zs = [], [], []",
    "    for i, j in edges:",
    "        xs += [c[i][0], c[j][0], None]",
    "        ys += [c[i][1], c[j][1], None]",
    "        zs += [c[i][2], c[j][2], None]",
    "    return go.Scatter3d(",
    "        x=xs, y=ys, z=zs, mode=\"lines\",",
    "        line=dict(color=\"gray\", width=3, dash=\"dash\"),",
    "        name=\"検証範囲（この外は外挿）\",",
    "        hoverinfo=\"skip\",",
    "    )",

    "def plot_designspace_3d(grid, rec, title=\"デザインスペース\",",
    "                        model_mod=None, peaks=None, factors=None,",
    "                        Vm=None, L_mm=None, day=0, cloud_style=\"volume\",",
    "                        wall_side=\"auto\", n_contours=5, surface_count=30,",
    "                        rotate_frames=120, rotate_duration_ms=33,",
    "                        robust_box=None):",
    "    \"\"\"",
    "    04_optimize.evaluate_grid の結果と推奨条件 rec から",
    "    対話的 3D 図を作成し plotly Figure を返す。",
    "",
    "    中央: デザインスペースの雲。cloud_style で表現を選ぶ:",
    "      \"volume\"  … 無段階の半透明ボリューム（go.Volume。WebGL 必須）",
    "      \"scatter\" … 合格点の散布点（go.Scatter3d）",
    "    壁:   model_mod 等が渡されれば、各壁に「垂直因子＝推奨値固定」の Rs 等高線を投影。",
    "    wall_side: 等高線の壁の置き場所。文字列で全壁一括、または因子ごとの dict で個別指定。",
    "      文字列: \"auto\"（合格領域に近い面へ自動）／\"low\"（下限側）／\"high\"（上限側）",
    "      dict  : {\"T\": .., \"phi\": .., \"F\": ..} 各値は \"auto\"/\"low\"/\"high\"。",
    "              F壁は床(low)/天井(high)、T壁・φ壁は手前(low)/奥(high) に対応。",
    "",
    "    grid : evaluate_grid() の戻り値 dict（T, phi, F, Rs_min, pass_mask, ...）",
    "    rec  : max_margin_point() の戻り値 dict（T, phi, F, margin）または None",
    "    壁を描くには model_mod, peaks, factors, Vm, L_mm が必要（無ければ雲のみ）。",
    "    \"\"\"",
    "    mask = grid[\"pass_mask\"]",
    "    Rs_th = 2.0",
    "    # Rs 最大値を自動設定: 雲は合格域内の最大、壁の等高線は格子全体の最大に合わせる",
    "    ds_rs_max = float(grid[\"Rs_min\"][mask].max()) if mask.any() else 3.0",
    "    global_rs_max = float(grid[\"Rs_min\"].max())",
    "",
    "    fig = go.Figure()",
    "",
    "    # ── 外挿時は検証範囲の枠を描く（外挿域と見分けるため）──",
    "    in_range = grid.get(\"in_range\")",
    "    if factors is not None and in_range is not None and not in_range.all():",
    "        fig.add_trace(_validated_box_trace(factors))",
    "",
    "    # ── 各壁に等高線を投影（垂直な因子を推奨値に固定）──",
    "    # which と「その壁に垂直な因子キー」の対応（auto 配置の判定に使う）",
    "    perp_key = {\"TP_floor\": \"F\", \"TF_wall\": \"phi\", \"PF_wall\": \"T\"}",
    "",
    "    def _resolve_side(perp):",
    "        # wall_side が dict ならその因子の指定、文字列なら全壁共通",
    "        spec = wall_side.get(perp, \"auto\") if isinstance(wall_side, dict) else wall_side",
    "        return _auto_wall_side(grid, perp) if spec == \"auto\" else spec",
    "",
    "    can_walls = (rec is not None and model_mod is not None and peaks is not None",
    "                 and factors is not None and Vm is not None and L_mm is not None)",
    "    # 等高線はデザインスペース内（合格境界 Rs=2.0 〜 合格域の最大）を n_contours 本に等分",
    "    rs_hi = ds_rs_max if ds_rs_max > Rs_th + 1e-6 else Rs_th + 0.5",
    "    contour_levels = list(np.round(np.linspace(Rs_th, rs_hi, max(2, n_contours)), 4))",
    "    if can_walls:",
    "        for which in (\"TP_floor\", \"TF_wall\", \"PF_wall\"):",
    "            side = _resolve_side(perp_key[which])",
    "            for tr in _wall_contour_lines(",
    "                    model_mod, peaks, factors, Vm, L_mm, rec, which,",
    "                    day=day, wall_side=side, levels=contour_levels,",
    "                    color_hi=ds_rs_max):",
    "                fig.add_trace(tr)",
    "",
    "    # ── デザインスペースの雲 ──",
    "    if mask.any():",
    "        if cloud_style == \"volume\":",
    "            fig.add_trace(_designspace_volume_trace(grid, criteria_Rs=Rs_th,",
    "                                                    surface_count=surface_count))",
    "        else:",
    "            cmax = ds_rs_max if ds_rs_max > Rs_th + 1e-6 else Rs_th + 0.5",
    "            fig.add_trace(go.Scatter3d(",
    "                x=grid[\"T\"][mask], y=grid[\"phi\"][mask], z=grid[\"F\"][mask],",
    "                mode=\"markers\",",
    "                marker=dict(",
    "                    size=4, color=grid[\"Rs_min\"][mask],",
    "                    colorscale=\"Viridis\", cmin=Rs_th, cmax=cmax, opacity=0.8,",
    "                    colorbar=dict(title=\"Rs_min\", thickness=15, len=0.6),",
    "                    line=dict(width=0),",
    "                ),",
    "                name=\"デザインスペース（合格）\",",
    "                hovertemplate=(",
    "                    \"T=%{x:.1f}℃\u003cbr>φ=%{y:.3f}\u003cbr>F=%{z:.2f}\u003cbr>\"",
    "                    \"Rs_min=%{marker.color:.2f}\u003cextra>合格\u003c/extra>\"",
    "                ),",
    "            ))",
    "",
    "    # ── 推奨条件（最大余裕点）──",
    "    if rec is not None:",
    "        # 推奨点でのより詳細な情報をホバーに入れる。",
    "        # 最適化基準により margin（最大余裕）か objective（t_R最速/ACN最小）のどちらかが入る。",
    "        if \"margin\" in rec:",
    "            obj_txt = f\"余裕={rec['margin']:.3f}\"",
    "        elif \"objective\" in rec:",
    "            obj_txt = f\"目的値={rec['objective']:.3f}\"",
    "        else:",
    "            obj_txt = \"\"",
    "        hover_txt = (",
    "            f\"T={rec['T']:.1f}℃\u003cbr>\"",
    "            f\"φ={rec['phi']:.3f}\u003cbr>\"",
    "            f\"F={rec['F']:.2f} mL/min\u003cbr>\"",
    "            f\"{obj_txt}\"",
    "        )",
    "        fig.add_trace(go.Scatter3d(",
    "            x=[rec[\"T\"]], y=[rec[\"phi\"]], z=[rec[\"F\"]],",
    "            mode=\"markers\",",
    "            marker=dict(",
    "                size=7,",
    "                color=\"#111111\",                 # 締まった黒のドット",
    "                symbol=\"circle\",",
    "                line=dict(color=\"white\", width=2),  # 白ハロで背景から浮かせる",
    "            ),",
    "            name=\"推奨条件（最大余裕点）\",",
    "            hovertemplate=hover_txt + \"\u003cextra>推奨条件\u003c/extra>\",",
    "        ))",
    "",
    "        # ── 変動範囲の箱（最適化基準で設定した ±δ。推奨点中心の直方体）──",
    "        # robust_box = {\"center\": (T,phi,F), \"delta\": {\"T\":..,\"phi\":..,\"F\":..}}",
    "        if robust_box is not None:",
    "            cx, cy, cz = robust_box[\"center\"]",
    "            dl = robust_box[\"delta\"]",
    "            dT, dP, dF = dl.get(\"T\", 0.0), dl.get(\"phi\", 0.0), dl.get(\"F\", 0.0)",
    "            bxs, bys, bzs = _cuboid_edges(cx - dT, cx + dT, cy - dP, cy + dP,",
    "                                          cz - dF, cz + dF)",
    "            fig.add_trace(go.Scatter3d(",
    "                x=bxs, y=bys, z=bzs, mode=\"lines\",",
    "                line=dict(color=\"#111111\", width=4, dash=\"dash\"),",
    "                name=f\"変動範囲 ±({dT:g},{dP:g},{dF:g})\",",
    "                hoverinfo=\"skip\",",
    "            ))",
    "",
    "    # ── レイアウト ──",
    "    n_pass = int(mask.sum())",
    "    n_total = mask.size",
    "    subtitle = f\"合格領域 {n_pass}/{n_total} 点 ({100*n_pass/n_total:.1f}%)\"",
    "    if rec is not None:",
    "        subtitle += (f\" | 推奨: T={rec['T']:.1f}℃ / φ={rec['phi']:.3f}\"",
    "                     f\" / F={rec['F']:.2f} mL/min\")",
    "",
    "    # 自動回転アニメーション用フレーム（カメラを z 軸まわりに一周）",
    "    r, z_eye, n_frames = 2.4, 0.8, max(8, int(rotate_frames))",
    "    frames = []",
    "    for k in range(n_frames):",
    "        ang = 2.0 * np.pi * k / n_frames",
    "        eye = dict(x=r * np.cos(ang), y=r * np.sin(ang), z=z_eye)",
    "        frames.append(go.Frame(layout=dict(scene_camera=dict(eye=eye)), name=str(k)))",
    "    fig.frames = frames",
    "",
    "    fig.update_layout(",
    "        title=dict(text=f\"{title}\u003cbr>\u003csup>{subtitle}\u003c/sup>\", x=0.5),",
    "        scene=dict(",
    "            xaxis=dict(title=\"T [℃]\"),",
    "            yaxis=dict(title=\"φ (ACN 分率)\"),",
    "            zaxis=dict(title=\"F [mL/min]\"),",
    "            camera=dict(eye=dict(x=1.5, y=-1.8, z=0.8)),",
    "        ),",
    "        legend=dict(x=0.01, y=0.99, bordercolor=\"gray\", borderwidth=1),",
    "        margin=dict(l=0, r=0, t=80, b=0),",
    "        width=900, height=700,",
    "        updatemenus=[dict(",
    "            type=\"buttons\", showactive=False,",
    "            x=0.02, y=0.02, xanchor=\"left\", yanchor=\"bottom\",",
    "            buttons=[",
    "                dict(label=\"▶ 自動回転\", method=\"animate\",",
    "                     args=[None, {\"frame\": {\"duration\": int(rotate_duration_ms), \"redraw\": True},",
    "                                  \"fromcurrent\": True, \"mode\": \"immediate\",",
    "                                  \"transition\": {\"duration\": int(rotate_duration_ms),",
    "                                                 \"easing\": \"linear\"}}]),",
    "                dict(label=\"⏸ 停止\", method=\"animate\",",
    "                     args=[[None], {\"frame\": {\"duration\": 0, \"redraw\": False},",
    "                                    \"mode\": \"immediate\"}]),",
    "            ],",
    "        )],",
    "    )",
    "    return fig",
    "",

    "# ──────────────────────────────",
    "# 2D スライス（F 固定の T-φ 等高線）— 補助図",
    "# ──────────────────────────────",
    "def plot_slice_2d(model_mod, peaks, factors, Vm, L_mm, criteria,",
    "                  F_fixed=None, n=51, day=0):",
    "    \"\"\"",
    "    F を固定した T-φ 面の Rs_min 等高線図（合格/不合格境界を直感的に見せる）。",
    "    F_fixed=None のとき因子の center 値を使う。",
    "    \"\"\"",
    "    if F_fixed is None:",
    "        F_fixed = (factors[\"F\"][\"low\"] + factors[\"F\"][\"high\"]) / 2.0",
    "",
    "    T_ax = np.linspace(factors[\"T\"][\"low\"], factors[\"T\"][\"high\"], n)",
    "    P_ax = np.linspace(factors[\"phi\"][\"low\"], factors[\"phi\"][\"high\"], n)",
    "    TT, PP = np.meshgrid(T_ax, P_ax)",
    "    FF = np.full_like(TT, F_fixed)",
    "",
    "    sep = model_mod.separation(peaks, TT, PP, FF, Vm, L_mm, day=day)",
    "    Rs = sep[\"Rs_min\"]",
    "    tR_TP = sep[\"TP\"][\"tR\"]",
    "    tR_last = np.maximum.reduce([sep[\"TP\"][\"tR\"], sep[\"IP1\"][\"tR\"], sep[\"IP2\"][\"tR\"]])",
    "",
    "    # 3条件を全て満たす合否マスク（2値）",
    "    pass_2d = (",
    "        (Rs >= criteria[\"Rs_min\"])",
    "        & (tR_TP \u003c= criteria[\"tR_TP_max\"])",
    "        & (tR_last \u003c= criteria[\"tR_last_max\"])",
    "    ).astype(float)",
    "",
    "    fig = go.Figure()",
    "    # Rs_min の等高線",
    "    fig.add_trace(go.Contour(",
    "        x=T_ax, y=P_ax, z=Rs,",
    "        colorscale=\"Viridis\",",
    "        contours=dict(",
    "            start=0.5, end=3.5, size=0.25,",
    "            showlabels=True, labelfont=dict(size=10),",
    "        ),",
    "        colorbar=dict(title=\"Rs_min\", thickness=12, len=0.5, x=1.02),",
    "        name=\"Rs_min\",",
    "    ))",
    "    # 合格境界（白い太線）",
    "    fig.add_trace(go.Contour(",
    "        x=T_ax, y=P_ax, z=pass_2d,",
    "        contours=dict(start=0.5, end=0.5, size=1),",
    "        line=dict(color=\"white\", width=3, dash=\"solid\"),",
    "        showscale=False,",
    "        name=\"合格境界\",",
    "    ))",
    "",
    "    fig.update_layout(",
    "        title=f\"T-φ 断面（F={F_fixed:.2f} mL/min 固定）\",",
    "        xaxis_title=\"T [℃]\",",
    "        yaxis_title=\"φ (ACN 分率)\",",
    "        width=600, height=480,",
    "    )",
    "    return fig",
    "",
    "",
    "# ──────────────────────────────",
    "# HTML 書き出し",
    "# ──────────────────────────────",
    "def save_html(fig, path):",
    "    os.makedirs(os.path.dirname(path) or \".\", exist_ok=True)",
    "    fig.write_html(path, include_plotlyjs=\"cdn\", full_html=True)",
    "    print(f\"  → 保存: {path}\")",
    "",
    "",
    "# ──────────────────────────────",
    "# 回転 GIF 書き出し（カメラを一周させた静止画を連結）",
    "# ──────────────────────────────",
    "def rotation_gif_bytes(fig, n_frames=36, width=720, height=560,",
    "                       duration_ms=80, r=2.4, z_eye=0.8):",
    "    \"\"\"",
    "    3D 図のカメラを z 軸まわりに一周させ、各角度の静止画を GIF に連結してバイト列で返す。",
    "    各フレームは plotly の静止画書き出し（kaleido＋Chrome が必要）。",
    "    フレーム数が多いほど滑らかだが時間がかかる。",
    "    \"\"\"",
    "    import io",
    "    import copy",
    "    from PIL import Image",
    "",
    "    f = copy.deepcopy(fig)",
    "    f.layout.updatemenus = []          # GIF には操作ボタンは不要",
    "    images = []",
    "    for k in range(n_frames):",
    "        ang = 2.0 * np.pi * k / n_frames",
    "        f.update_layout(scene_camera=dict(eye=dict(",
    "            x=r * np.cos(ang), y=r * np.sin(ang), z=z_eye)))",
    "        png = f.to_image(format=\"png\", width=width, height=height, scale=1)",
    "        images.append(Image.open(io.BytesIO(png)).convert(\"RGB\"))",
    "    buf = io.BytesIO()",
    "    images[0].save(buf, format=\"GIF\", save_all=True, append_images=images[1:],",
    "                   duration=duration_ms, loop=0, disposal=2)",
    "    return buf.getvalue()",
    "",
    "",
    "def save_rotation_gif(fig, path, **kwargs):",
    "    \"\"\"回転 GIF をファイルに書き出す。\"\"\"",
    "    os.makedirs(os.path.dirname(path) or \".\", exist_ok=True)",
    "    data = rotation_gif_bytes(fig, **kwargs)",
    "    with open(path, \"wb\") as fp:",
    "        fp.write(data)",
    "    print(f\"  → 保存: {path}（{len(data)//1024} KB）\")",
    "    return data",
    "",
    "",
    "# ──────────────────────────────",
    "# 動作確認",
    "# ──────────────────────────────",
    "def _load_module(path, name):",
    "    import importlib.util",
    "    spec = importlib.util.spec_from_file_location(name, path)",
    "    mod = importlib.util.module_from_spec(spec)",
    "    spec.loader.exec_module(mod)",
    "    return mod",
    "",
    "",
    "if __name__ == \"__main__\":",
    "    here = os.path.dirname(__file__)",
    "    model_mod = _load_module(os.path.join(here, \"01_model.py\"), \"model01\")",
    "    opt_mod = _load_module(os.path.join(here, \"04_optimize.py\"), \"opt04\")",
    "",
    "    Vm, L = 0.24, 100.0",
    "    factors = {",
    "        \"T\":   {\"low\": 40, \"center\": 50, \"high\": 60},",
    "        \"phi\": {\"low\": 0.38, \"center\": 0.45, \"high\": 0.52},",
    "        \"F\":   {\"low\": 0.4, \"center\": 0.6, \"high\": 0.8},",
    "    }",
    "    criteria = {\"Rs_min\": 2.0, \"tR_TP_max\": 7.5, \"tR_last_max\": 10.0}",
    "",
    "    peaks = model_mod.example_peaks()",
    "    for name in (\"IP1\", \"TP\", \"IP2\"):",
    "        peaks[name][\"e\"] = 80.0    # クロスオーバーが起きる例パラメータ",
    "",
    "    print(\"格子評価中...\")",
    "    grid, rec = opt_mod.optimize(model_mod, peaks, factors, Vm, L, criteria, n=25)",
    "",
    "    print(f\"合格点: {int(grid['pass_mask'].sum())}/{grid['pass_mask'].size} 点\")",
    "    if rec:",
    "        print(f\"推奨条件: T={rec['T']:.1f}℃ / φ={rec['phi']:.3f} / F={rec['F']:.2f} mL/min\")",
    "        print(f\"余裕（正規化）: {rec['margin']:.3f}\")",
    "",
    "    print(\"\\n3D グラフを生成中...\")",
    "    fig3d = plot_designspace_3d(grid, rec, model_mod=model_mod, peaks=peaks,",
    "                                factors=factors, Vm=Vm, L_mm=L)",
    "    save_html(fig3d, \"outputs/designspace_3d.html\")",
    "",
    "    print(\"2D スライスを生成中（F=中水準固定）...\")",
    "    fig2d = plot_slice_2d(model_mod, peaks, factors, Vm, L, criteria,",
    "                          F_fixed=factors[\"F\"][\"center\"])",
    "    save_html(fig2d, \"outputs/designspace_slice_2d.html\")",
    "",
    "    print(\"\\n完了。ブラウザで outputs/ 内の HTML を開いてください。\")",

  "scripts/06_quadratic.py": [
    "\"\"\"",
    "06_quadratic.py — 二次回帰（フル2次・応答曲面）モデル",
    "",
    "メカニズムモデル（01_model）の代替。各ピークについて t_R と W_h を",
    "(T, φ, F) のフル2次式で直接フィットする（10パラメータ／応答）:",
    "",
    "  y = β0 + β1·T + β2·φ + β3·F + β4·T² + β5·φ² + β6·F² + β7·Tφ + β8·TF + β9·φF",
    "",
    "01_model と同じ `separation()` / `sample_peaks()` インターフェースを持つので、",
    "evaluate_grid / optimize / 3D描画 / rs_confidence にそのまま差し込める（入口だけ分岐）。",
    "",
    "注意（references/モデル比較_メカニズムvs二次回帰.md）:",
    "  二次回帰は10パラメータ固定で、点数が少ないと過学習し外挿が弱い。",
    "  少数データではメカニズムモデルの方が LOO 予測で明確に優れる。用途に応じて選ぶこと。",
    "",
    "依存: numpy / statsmodels / pandas。",
    "\"\"\"",
    "",
    "import numpy as np",
    "import statsmodels.api as sm",
    "",
    "EIGHT_LN2 = 8.0 * np.log(2.0)",
    "WB_OVER_WH = 4.0 / np.sqrt(EIGHT_LN2)   # W_b = 4·t_R/√N, W_h = √(8ln2)·t_R/√N → W_b = 1.699·W_h",
    "QTERMS = [\"const\", \"T\", \"phi\", \"F\", \"T^2\", \"phi^2\", \"F^2\", \"T*phi\", \"T*F\", \"phi*F\"]  # 2次項名",
    "",
    "",
    "# ──────────────────────────────",
    "# 2次の計画ベクトル",
    "# ──────────────────────────────",
    "def qdesign(T, phi, F):",
    "    \"\"\"(T,φ,F) → フル2次の説明変数行列 [1,T,φ,F,T²,φ²,F²,Tφ,TF,φF]（n×10）。",
    "    任意形状（スカラー・1次元・メッシュ）を受け、ブロードキャスト後に平坦化して (n,10) を返す。\"\"\"",
    "    T, phi, F = np.broadcast_arrays(np.asarray(T, float), np.asarray(phi, float),",
    "                                    np.asarray(F, float))",
    "    t, p, f = T.ravel(), phi.ravel(), F.ravel()",
    "    one = np.ones_like(t)",
    "    return np.column_stack([one, t, p, f, t**2, p**2, f**2, t*p, t*f, p*f])",
    "",
    "",
    "def _bshape(T, phi, F):",
    "    \"\"\"T,φ,F をブロードキャストしたときの形（predict の戻り値をこの形に戻す）。\"\"\"",
    "    return np.broadcast(np.asarray(T), np.asarray(phi), np.asarray(F)).shape",
    "",
    "",
    "# ──────────────────────────────",
    "# フィット（03_fit.fit_all と同じ戻り値形）",
    "# ──────────────────────────────",
    "def _rmse(a, b):",
    "    return float(np.sqrt(np.mean((np.asarray(a) - np.asarray(b)) ** 2)))",
    "",
    "",
    "def adj_r2(res):",
    "    \"\"\"自由度調整済み R²（nan なら None）。\"\"\"",
    "    v = float(res.rsquared_adj)",
    "    return None if not np.isfinite(v) else v",
    "",
    "",
    "def q2_loo(res):",
    "    \"\"\"Q²（予測 R²）= 1 − PRESS/SST。OLS の LOO 残差 e_i/(1−h_ii) から算出（03_fit と同定義）。\"\"\"",
    "    y = np.asarray(res.model.endog, dtype=float)",
    "    resid = np.asarray(res.resid, dtype=float)",
    "    h = np.asarray(res.get_influence().hat_matrix_diag, dtype=float)",
    "    if np.any(h > 1.0 - 1e-8):",
    "        return None",
    "    press = float(np.sum((resid / (1.0 - h)) ** 2))",
    "    sst = float(np.sum((y - y.mean()) ** 2))",
    "    return None if sst \u003c= 0 else 1.0 - press / sst",
    "",
    "",
    "def lack_of_fit(cond_df, res):",
    "    \"\"\"同一条件の繰り返し（純誤差）から当てはまり不足を F 検定（03_fit と同定義）。",
    "    レプリケートが無い/自由度不足なら None。p\u003c0.05 で「モデルで説明しきれないズレあり」。\"\"\"",
    "    import collections",
    "    from scipy import stats as _stats",
    "    y = np.asarray(res.model.endog, dtype=float)",
    "    sse = float(np.sum(np.asarray(res.resid, dtype=float) ** 2))",
    "    df_e = float(res.df_resid)",
    "    keys = list(zip(np.round(cond_df[\"T\"].to_numpy(float), 6),",
    "                    np.round(cond_df[\"phi\"].to_numpy(float), 6),",
    "                    np.round(cond_df[\"F\"].to_numpy(float), 6)))",
    "    groups = collections.defaultdict(list)",
    "    for i, k in enumerate(keys):",
    "        groups[k].append(i)",
    "    ss_pe, df_pe = 0.0, 0.0",
    "    for idx in groups.values():",
    "        if len(idx) > 1:",
    "            yy = y[idx]",
    "            ss_pe += float(np.sum((yy - yy.mean()) ** 2))",
    "            df_pe += len(idx) - 1",
    "    df_lof = df_e - df_pe",
    "    if df_pe \u003c 1 or df_lof \u003c 1:",
    "        return None",
    "    ss_lof = max(sse - ss_pe, 0.0)",
    "    ms_pe, ms_lof = ss_pe / df_pe, ss_lof / df_lof",
    "    F = ms_lof / ms_pe if ms_pe > 0 else float(\"inf\")",
    "    return {\"F\": float(F), \"p\": float(_stats.f.sf(F, df_lof, df_pe)),",
    "            \"df_lof\": int(df_lof), \"df_pe\": int(df_pe)}",
    "",
    "",
    "def fit_all(df, Vm, L_mm, peak_names=None, **_ignore):",
    "    \"\"\"",
    "    各ピークの t_R・W_h を (T,φ,F) のフル2次で OLS フィット。",
    "    戻り値 (peaks, diagnostics) は 03_fit.fit_all と同じ形（app 側の表示コードを共有できる）:",
    "      peaks[name] = {\"tR_coef\": (10,), \"Wh_coef\": (10,)}",
    "      diagnostics[name] = {R2_retention, R2_width, RMSE_tR_min, RMSE_Wh_min, n, tR_cov, Wh_cov}",
    "    Vm, L_mm は署名互換のため受け取るが 2次回帰では未使用。",
    "    \"\"\"",
    "    names = list(peak_names) if peak_names is not None else [\"IP1\", \"TP\", \"IP2\"]",
    "    peaks, diagnostics = {}, {}",
    "    for name in names:",
    "        sub = df.dropna(subset=[f\"tR_{name}\", f\"Wh_{name}\"])",
    "        T = sub[\"T\"].to_numpy(float); phi = sub[\"phi\"].to_numpy(float); F = sub[\"F\"].to_numpy(float)",
    "        tR = sub[f\"tR_{name}\"].to_numpy(float); Wh = sub[f\"Wh_{name}\"].to_numpy(float)",
    "        X = qdesign(T, phi, F)",
    "        rt = sm.OLS(tR, X).fit()",
    "        rw = sm.OLS(Wh, X).fit()",
    "        peaks[name] = {\"tR_coef\": np.asarray(rt.params), \"Wh_coef\": np.asarray(rw.params)}",
    "        diagnostics[name] = {",
    "            \"R2_retention\": rt.rsquared,",
    "            \"R2_width\": rw.rsquared,",
    "            \"RMSE_tR_min\": _rmse(rt.fittedvalues, tR),",
    "            \"RMSE_Wh_min\": _rmse(rw.fittedvalues, Wh),",
    "            \"n\": len(sub),",
    "            \"tR_cov\": np.asarray(rt.cov_params()),",
    "            \"Wh_cov\": np.asarray(rw.cov_params()),",
    "            \"LOF_retention\": lack_of_fit(sub, rt),",
    "            \"LOF_width\": lack_of_fit(sub, rw),",
    "            \"adjR2_retention\": adj_r2(rt),",
    "            \"adjR2_width\": adj_r2(rw),",
    "            \"Q2_retention\": q2_loo(rt),",
    "            \"Q2_width\": q2_loo(rw),",
    "            \"ret_pvalues\": dict(zip(QTERMS, np.asarray(rt.pvalues, dtype=float))),",
    "            \"wid_pvalues\": dict(zip(QTERMS, np.asarray(rw.pvalues, dtype=float))),",
    "        }",
    "    return peaks, diagnostics",
    "",
    "",
    "# ──────────────────────────────",
    "# 予測・分離度（01_model.separation と同じインターフェース）",
    "# ──────────────────────────────",
    "def predict_peak(peak, T, phi, F, Vm, L_mm, day=0):",
    "    \"\"\"1ピークの t_R, W_h, W_b を dict で返す（2次回帰の係数から）。",
    "    外挿で負になり得るので W_h は微小正値でクリップ（Rs の 0 割り回避）。\"\"\"",
    "    shape = _bshape(T, phi, F)",
    "    X = qdesign(T, phi, F)",
    "    tR = (X @ peak[\"tR_coef\"]).reshape(shape)                     # 入力形状に戻す",
    "    Wh = np.maximum(X @ peak[\"Wh_coef\"], 1e-6).reshape(shape)     # 外挿で負→微小正にクリップ",
    "    Wb = WB_OVER_WH * Wh",
    "    return {\"tR\": tR, \"Wh\": Wh, \"Wb\": Wb}",
    "",
    "",
    "def resolution(tR_a, Wb_a, tR_b, Wb_b):",
    "    return 2.0 * np.abs(tR_a - tR_b) / (Wb_a + Wb_b)",
    "",
    "",
    "def separation(peaks, T, phi, F, Vm, L_mm, day=0, target=\"TP\", interfering=None):",
    "    \"\"\"01_model.separation と同じ戻り値（target/各IP の予測 ＋ Rs_each ＋ Rs_min）。\"\"\"",
    "    if interfering is None:",
    "        interfering = [k for k in peaks.keys() if k != target]",
    "    tp = predict_peak(peaks[target], T, phi, F, Vm, L_mm, day)",
    "    out = {target: tp}",
    "    rs_each, rs_vals = {}, []",
    "    for ip in interfering:",
    "        p = predict_peak(peaks[ip], T, phi, F, Vm, L_mm, day)",
    "        out[ip] = p",
    "        rs = resolution(tp[\"tR\"], tp[\"Wb\"], p[\"tR\"], p[\"Wb\"])",
    "        rs_each[ip] = rs",
    "        rs_vals.append(rs)",
    "    rs_min = rs_vals[0]",
    "    for r in rs_vals[1:]:",
    "        rs_min = np.minimum(rs_min, r)",
    "    out[\"Rs_each\"] = rs_each",
    "    out[\"Rs_min\"] = rs_min",
    "    if \"IP1\" in rs_each:",
    "        out[\"Rs1\"] = rs_each[\"IP1\"]",
    "    if \"IP2\" in rs_each:",
    "        out[\"Rs2\"] = rs_each[\"IP2\"]",
    "    return out",
    "",
    "",
    "# ──────────────────────────────",
    "# Rs 信頼区間用の係数サンプリング（04_optimize.rs_confidence から呼ばれる）",
    "# ──────────────────────────────",
    "def sample_peaks(peaks, diagnostics, rng, target, interfering):",
    "    \"\"\"各ピークの t_R・W_h の2次係数を OLS 共分散からサンプルした peaks dict を返す。\"\"\"",
    "    out = {}",
    "    for nm in [target] + list(interfering):",
    "        d = diagnostics[nm]",
    "        out[nm] = {",
    "            \"tR_coef\": rng.multivariate_normal(peaks[nm][\"tR_coef\"], np.atleast_2d(d[\"tR_cov\"])),",
    "            \"Wh_coef\": rng.multivariate_normal(peaks[nm][\"Wh_coef\"], np.atleast_2d(d[\"Wh_cov\"])),",
    "        }",
    "    return out",
    ""
  ].join("\n"),
