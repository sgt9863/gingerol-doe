n    nt, npp, nf = len(axes[0]), len(axes[1]), len(axes[2])\n    return np.asarray(arr).reshape(nt, npp, nf)\n\n\ndef robust_box_mask(grid_result, delta):\n    \"\"\"\n    各格子点を中心にした「変動範囲の箱」（各因子 ±delta[f]）の全域が合格かを返す。\n    ＝合格マスクを箱サイズで収縮（erosion）した bool 配列。\n    箱が評価格子の外にはみ出す端の点は「保証できない」ので不合格（=非ロバスト）扱い。\n    delta は {\"T\":℃, \"phi\":分率, \"F\":mL/min} の半幅。0 の因子はその軸方向に広げない。\n    \"\"\"\n    axes = grid_result[\"axes\"]\n    pass3d = _reshape_to_grid(grid_result[\"pass_mask\"], axes).astype(float)\n    sizes = []\n    for ax, f in zip(axes, [\"T\", \"phi\", \"F\"]):\n        step = (ax[1] - ax[0]) if len(ax) > 1 else 1.0\n        k = int(np.floor((delta.get(f, 0.0)) / step + 1e-9)) if step > 0 else 0\n        sizes.append(2 * k + 1)            # ±k 格子 → 箱の一辺\n    try:\n        from scipy.ndimage import minimum_filter\n        eroded = minimum_filter(pass3d, size=sizes, mode=\"constant\", cval=0.0)\n    except ImportError:\n        eroded = pass3d                    # scipy 無し（Excel貼付）は収縮なしで代替\n    return (eroded >= 0.5).ravel()\n\n\ndef _candidate_mask(grid_result, robust, restrict_range=True):\n    \"\"\"推奨候補 = ロバスト合格（restrict_range なら さらに検証済み範囲内 in_range）。\"\"\"\n    in_range = grid_result.get(\"in_range\")\n    if restrict_range and in_range is not None:\n        return robust & in_range\n    return robust\n\n\ndef _pack(grid_result, idx, extra):\n    \"\"\"格子 index から推奨条件 dict を組む。\"\"\"\n    out = {\n        \"T\": float(grid_result[\"T\"][idx]),\n        \"phi\": float(grid_result[\"phi\"][idx]),\n        \"F\": float(grid_result[\"F\"][idx]),\n        \"index\": int(idx),\n    }\n    out.update(extra)\n    return out\n\n\ndef fastest_tR_point(grid_result, delta, restrict_range=True):\n    \"\"\"変動範囲の箱が全域合格な点のうち、t_R(TP) が最速の点を返す。無ければ None。\"\"\"\n    cand = _candidate_mask(grid_result, robust_box_mask(grid_result, delta), restrict_range)\n    if not cand.any():\n        return None\n    idx = np.flatnonzero(cand)\n    best = int(idx[np.argmin(grid_result[\"tR_TP\"][idx])])\n    return _pack(grid_result, best, {\"objective\": float(grid_result[\"tR_TP\"][best])})\n\n\ndef min_acn_point(grid_result, delta, restrict_range=True):\n    \"\"\"変動範囲の箱が全域合格な点のうち、TP 溶出までの ACN 消費量が最小の点を返す。\n    ACN 消費量 = φ × F × t_R(TP)（移動相通液量 F·t_R に ACN 分率 φ を掛けた体積 [mL]）。\"\"\"\n    cand = _candidate_mask(grid_result, robust_box_mask(grid_result, delta), restrict_range)\n    if not cand.any():\n        return None\n    acn = grid_result[\"phi\"] * grid_result[\"F\"] * grid_result[\"tR_TP\"]\n    idx = np.flatnonzero(cand)\n    best = int(idx[np.argmin(acn[idx])])\n    return _pack(grid_result, best, {\"objective\": float(acn[best])})\n\n\ndef recommend(grid_result, factors, mode=\"robust\", delta=None, restrict_range=True):\n    \"\"\"最適化基準を選んで推奨条件を返す。\n      mode=\"robust\"     … 最大余裕点（不合格領域から最も遠い）\n      mode=\"fastest_tR\" … 変動範囲全域が合格で t_R(TP) 最速（delta 必須）\n      mode=\"min_acn\"    … 変動範囲全域が合格で ACN 消費量最小（delta 必須）\n    restrict_range=True … 推奨は検証済み範囲内から。False で外挿域も推奨候補に含める。\n    \"\"\"\n    if mode == \"robust\":\n        return max_margin_point(grid_result, factors, restrict_range=restrict_range)\n    if mode == \"fastest_tR\":\n        return fastest_tR_point(grid_result, delta or {}, restrict_range=restrict_range)\n    if mode == \"min_acn\":\n        return min_acn_point(grid_result, delta or {}, restrict_range=restrict_range)\n    raise ValueError(f\"unknown mode: {mode}\")\n\n\ndef optimize(model_mod, peaks, factors, Vm, L_mm, criteria, n=21, day=0,\n             extrapolate=0.0, target=\"TP\", interfering=None,\n             mode=\"robust\", delta=None, restrict_range=True):\n    \"\"\"格子評価 → 推奨条件までを一括実行。戻り値: (grid_result, recommend dict or None)。\n    extrapolate>0 で評価格子を因子範囲の外まで広げる。\n    restrict_range=True なら推奨は元範囲内から、False なら外挿域も候補に含める。\n    mode で最適化基準を選ぶ（robust / fastest_tR / min_acn）。\n    夾雑ピーク数は interfering で任意（None なら target 以外すべて）。\"\"\"\n    grid = evaluate_grid(model_mod, peaks, factors, Vm, L_mm, criteria, n=n, day=day,\n                         extrapolate=extrapolate, target=target, interfering=interfering)\n    rec = recommend(grid, factors, mode=mode, delta=delta, restrict_range=restrict_range)\n    return grid, rec\n\n\n# ──────────────────────────────\n# Rs の推定精度（誤差伝搬・モンテカルロ）\n# ──────────────────────────────\ndef rs_confidence(model_mod, peaks, diagnostics, T, phi, F, Vm, L_mm,\n                  target=\"TP\", interfering=None, day=0,\n                  n_samples=600, ci=0.95, seed=0):\n    \"\"\"指定条件 (T,φ,F) での Rs_min の推定精度を誤差伝搬（モンテカルロ）で返す。\n    フィット係数を共分散から n_samples 回サンプルし、各回 Rs_min を再計算してばらつきを見る。\n    戻り値 dict: {'Rs_min':点推定, 'sd':標準偏差, 'lo','hi':信頼区間, 'samples':配列,\n                  'Rs_each_sd':{IP名:sd}}。\n    \"\"\"\n    if interfering is None:\n        interfering = [k for k in peaks.keys() if k != target]\n    rng = np.random.default_rng(seed)\n    base = model_mod.separation(peaks, T, phi, F, Vm, L_mm, day=day,\n                                target=target, interfering=interfering)\n    samples = np.empty(n_samples)\n    each = {ip: np.empty(n_samples) for ip in interfering}\n    for i in range(n_samples):\n        sp = model_mod.sample_peaks(peaks, diagnostics, rng, target, interfering)\n        s = model_mod.separation(sp, T, phi, F, Vm, L_mm, day=day,\n                                 target=target, interfering=interfering)\n        samples[i] = float(s[\"Rs_min\"])\n        for ip in interfering:\n            each[ip][i] = float(s[\"Rs_each\"][ip])\n    a = (1.0 - ci) / 2.0\n    lo, hi = np.quantile(samples, [a, 1.0 - a])\n    return {\n        \"Rs_min\": float(base[\"Rs_min\"]),\n        \"sd\": float(np.std(samples, ddof=1)),\n        \"lo\": float(lo), \"hi\": float(hi),\n        \"ci\": ci,\n        \"samples\": samples,\n        \"Rs_each_sd\": {ip: float(np.std(each[ip], ddof=1)) for ip in interfering},\n    }\n\n\n# ──────────────────────────────\n# 動作確認（合成パラメータでデザインスペースが出るか）\n# ──────────────────────────────\ndef _load_module(path, name):\n    import importlib.util\n    spec = importlib.util.spec_from_file_location(name, path)\n    mod = importlib.util.module_from_spec(spec)\n    spec.loader.exec_module(mod)\n    return mod\n\n\nif __name__ == \"__main__\":\n    import os\n    here = os.path.dirname(__file__)\n    model_mod = _load_module(os.path.join(here, \"01_model.py\"), \"model01\")\n\n    Vm, L = 0.24, 100.0\n    factors = {\n        \"T\":   {\"low\": 40, \"high\": 60},\n        \"phi\": {\"low\": 0.38, \"high\": 0.52},\n        \"F\":   {\"low\": 0.4, \"high\": 0.8},\n    }\n    criteria = {\"Rs_min\": 2.0, \"tR_TP_max\": 7.5, \"tR_last_max\": 10.0}\n\n    # 交互作用入りの例パラメータ（クロスオーバーありの状況を模擬）\n    peaks = model_mod.example_peaks()\n    for name in (\"IP1\", \"TP\", \"IP2\"):\n        peaks[name][\"e\"] = 80.0\n\n    grid, rec = optimize(model_mod, peaks, factors, Vm, L, criteria, n=21)\n\n    n_pass = int(grid[\"pass_mask\"].sum())\n    n_total = grid[\"pass_mask\"].size\n    print(f\"格子点 {n_total} 点中、合格（デザインスペース内）= {n_pass} 点 \"\n          f\"（{100*n_pass/n_total:.1f}%）\")\n    print(f\"  Rs_min 範囲   = {grid['Rs_min'].min():.2f} 〜 {grid['Rs_min'].max():.2f}\")\n    print(f\"  t_R(TP) 範囲  = {grid['tR_TP'].min():.2f} 〜 {grid['tR_TP'].max():.2f} 分\")\n    print(f\"  最遅 t_R 範囲 = {grid['tR_last'].min():.2f} 〜 {grid['tR_last'].max():.2f} 分\")\n\n    if rec is None:\n        print(\"\\n合格領域なし。因子範囲か合格条件を見直してください。\")\n    else:\n        print(\"\\n=== 推奨条件（最大余裕点）===\")\n        print(f\"  T   = {rec['T']:.1f} ℃\")\n        print(f\"  phi = {rec['phi']:.3f}（ACN 分率）\")\n        print(f\"  F   = {rec['F']:.2f} mL/min\")\n        print(f\"  余裕（正規化距離）= {rec['margin']:.3f}\")\n        # 推奨点での実際の分離を表示\n        s = model_mod.separation(peaks, rec[\"T\"], rec[\"phi\"], rec[\"F\"], Vm, L)\n        print(f\"  → Rs_min={float(s['Rs_min']):.2f}, \"\n              f\"t_R(TP)={float(s['TP']['tR']):.2f}分, \"\n              f\"最遅={float(max(s['TP']['tR'], s['IP1']['tR'], s['IP2']['tR'])):.2f}分\")\n", "scripts/05_designspace.py": "\"\"\"\n05_designspace.py — デザインスペースの対話的 3D 可視化（plotly）\n\n依存: plotly。numpy / 01_model / 04_optimize を呼ぶ。\nplotly は Python in Excel 非対応のため、このスクリプトだけ通常 Python 環境専用。\n（Excel 側は 04_optimize の結果を matplotlib 等で静止画にする）\n\n出力:\n  outputs/designspace_3d.html  — ブラウザで開ける対話的 3D 散布図（回転・ズーム可）\n  outputs/designspace_3d.json  — 格子評価結果の軽量キャッシュ（任意）\n\nグラフの見方（配色は Viridis: 低Rs=紫 → 高Rs=黄）:\n  - 雲 = デザインスペース（合格領域）。色が明るい（黄寄り）ほど Rs_min が高く分離余裕が大きい\n    （既定は go.Volume の無段階ボリューム。cloud_style=\"scatter\" で散布点にも切替可）\n  - 壁の線 = Rs_min の等高線（太い黒線が Rs=2.0 の合格境界）\n  - 黒ドット = 推奨条件（最大余裕点）\n  軸: X=T[℃]、Y=φ（ACN 分率）、Z=F[mL/min]\n\"\"\"\n\nimport os\nimport numpy as np\n\ntry:\n    import plotly.graph_objects as go\n    from plotly.subplots import make_subplots\nexcept ImportError as e:\n    raise ImportError(\"plotly が必要です: pip install plotly\") from e\n\n\n# ──────────────────────────────\n# 実験計画（設計点）の 3D 散布\n# ──────────────────────────────\n_DESIGN_COLORS = {\n    \"factorial\": \"#1f77b4\", \"axial\": \"#d62728\", \"center\": \"#2ca02c\",\n    \"bbd\": \"#17becf\", \"bridge_center\": \"#9467bd\",\n    \"augment_model\": \"#ff7f0e\", \"augment_rs\": \"#ff7f0e\",\n}\n\n\ndef _cuboid_edges(Tl, Th, Pl, Ph, Fl, Fh):\n    \"\"\"直方体 [Tl,Th]×[Pl,Ph]×[Fl,Fh] の12辺を1本の線トレース用座標 (xs,ys,zs) で返す。\"\"\"\n    c = [(Tl, Pl, Fl), (Th, Pl, Fl), (Th, Ph, Fl), (Tl, Ph, Fl),\n         (Tl, Pl, Fh), (Th, Pl, Fh), (Th, Ph, Fh), (Tl, Ph, Fh)]\n    edges = [(0, 1), (1, 2), (2, 3), (3, 0), (4, 5), (5, 6), (6, 7), (7, 4),\n             (0, 4), (1, 5), (2, 6), (3, 7)]\n    xs, ys, zs = [], [], []\n    for a, b in edges:\n        xs += [c[a][0], c[b][0], None]\n        ys += [c[a][1], c[b][1], None]\n        zs += [c[a][2], c[b][2], None]\n    return xs, ys, zs\n\n\ndef _box_edges(factors):\n    \"\"\"因子範囲 low/high の直方体（頂点が乗るべき箱）の12辺を返す。\"\"\"\n    return _cuboid_edges(factors[\"T\"][\"low\"], factors[\"T\"][\"high\"],\n                         factors[\"phi\"][\"low\"], factors[\"phi\"][\"high\"],\n                         factors[\"F\"][\"low\"], factors[\"F\"][\"high\"])\n\n\ndef plot_design_points_3d(df, factors=None, title=\"実験計画（CCD）の配置\"):\n    \"\"\"CCD/D最適の設計点を 3D 散布で表示。type で色分け。\n    factors を渡すと「指定範囲 low/high の箱」も点線で描く（頂点がこの角に乗るのが正しい）。\"\"\"\n    fig = go.Figure()\n    if factors is not None:\n        xs, ys, zs = _box_edges(factors)\n        fig.add_trace(go.Scatter3d(\n            x=xs, y=ys, z=zs, mode=\"lines\", name=\"指定範囲 (low/high)\",\n            line=dict(color=\"rgba(80,80,80,0.6)\", width=3), hoverinfo=\"skip\"))\n    for t, sub in df.groupby(\"type\"):\n        fig.add_trace(go.Scatter3d(\n            x=sub[\"T\"], y=sub[\"phi\"], z=sub[\"F\"], mode=\"markers\", name=str(t),\n            marker=dict(size=5, color=_DESIGN_COLORS.get(str(t), \"#888888\")),\n            hovertemplate=\"type=%s\u003cbr>T=%%{x:.2f}\u003cbr>φ=%%{y:.3f}\u003cbr>F=%%{z:.3f}\u003cextra>\u003c/extra>\" % t))\n    fig.update_layout(\n        title=title, height=520, legend_title=\"点の種類\",\n        scene=dict(xaxis_title=\"T [℃]\", yaxis_title=\"φ (ACN分率)\", zaxis_title=\"F [mL/min]\"),\n        margin=dict(l=0, r=0, t=40, b=0))\n    return fig\n\n\n# ──────────────────────────────\n# 3D デザインスペースプロット\n# ──────────────────────────────\nWALL_LEVELS = [1.0, 1.5, 2.0, 2.5, 3.0]   # 壁に描く Rs_min の等高線レベル（既定）\n\n\ndef build_levels(step, lo=0.5, hi=3.5):\n    \"\"\"Rs の等高線レベルを刻み step で作る。合格境界 2.0 を必ず含める。\"\"\"\n    step = max(float(step), 0.05)\n    kmin = int(np.floor((lo - 2.0) / step))\n    kmax = int(np.ceil((hi - 2.0) / step))\n    levels = [round(2.0 + k * step, 6) for k in range(kmin, kmax + 1)]\n    return [v for v in levels if lo - 1e-9 \u003c= v \u003c= hi + 1e-9]\n\n\ndef _level_color(level, lo=0.0, hi=3.0):\n    \"\"\"Rs レベル → Viridis 上の色（低=紫→高=黄）。plotly のサンプラを使う。\"\"\"\n    from plotly.colors import sample_colorscale\n    t = (level - lo) / (hi - lo)\n    return sample_colorscale(\"Viridis\", [max(0.0, min(1.0, t))])[0]\n\n\ndef _wall_contour_lines(model_mod, peaks, factors, Vm, L_mm, rec,\n                        which, n=81, day=0, wall_side=\"low\", levels=None,\n                        color_hi=3.0):\n    \"\"\"\n    箱の1つの壁に「等高線（ライン）」を描く Scatter3d トレース群を返す。\n    壁に垂直な因子を推奨値（rec）に固定し、残り2面内因子で Rs_min を計算、\n    matplotlib で等値線の座標を取り出して壁の平面に 3D ラインとして配置する。\n    Rs=2.0（合格境界）は太線で強調。\n\n    which: \"TP_floor\"(F壁・T-φ面) / \"TF_wall\"(φ壁・T-F面) / \"PF_wall\"(T壁・φ-F面)\n    wall_side: \"low\"=下限側の壁／\"high\"=上限側の壁（デザインスペースに近い面を選べる）\n    \"\"\"\n    import matplotlib\n    matplotlib.use(\"Agg\")            # 画面を使わず座標計算だけ\n    import matplotlib.pyplot as plt\n\n    T_lo, T_hi = factors[\"T\"][\"low\"], factors[\"T\"][\"high\"]\n    P_lo, P_hi = factors[\"phi\"][\"low\"], factors[\"phi\"][\"high\"]\n    F_lo, F_hi = factors[\"F\"][\"low\"], factors[\"F\"][\"high\"]\n    T_ax = np.linspace(T_lo, T_hi, n)\n    P_ax = np.linspace(P_lo, P_hi, n)\n    F_ax = np.linspace(F_lo, F_hi, n)\n    hi = (wall_side == \"high\")       # True なら上限側の壁に貼る\n\n    # 面内2軸 (a_ax, b_ax) で Rs を計算し、(a,b)→3D への射影関数 to_xyz を決める\n    if which == \"TP_floor\":          # T-φ 面、F=推奨値固定 → F の壁に置く\n        a_ax, b_ax = T_ax, P_ax\n        AA, BB = np.meshgrid(a_ax, b_ax)\n        Rs = model_mod.separation(peaks, AA, BB, rec[\"F\"], Vm, L_mm, day=day)[\"Rs_min\"]\n        F_wall = F_hi if hi else F_lo\n        to_xyz = lambda a, b: (a, b, np.full_like(a, F_wall))\n        wall_name = f\"F壁(F={rec['F']:.2f})\"\n    elif which == \"TF_wall\":         # T-F 面、φ=推奨値固定 → φ の壁に置く\n        a_ax, b_ax = T_ax, F_ax\n        AA, BB = np.meshgrid(a_ax, b_ax)\n        Rs = model_mod.separation(peaks, AA, rec[\"phi\"], BB, Vm, L_mm, day=day)[\"Rs_min\"]\n        P_wall = P_hi if hi else P_lo\n        to_xyz = lambda a, b: (a, np.full_like(a, P_wall), b)\n        wall_name = f\"φ壁(φ={rec['phi']:.3f})\"\n    else:                            # \"PF_wall\": φ-F 面、T=推奨値固定 → T の壁に置く\n        a_ax, b_ax = P_ax, F_ax\n        AA, BB = np.meshgrid(a_ax, b_ax)\n        Rs = model_mod.separation(peaks, rec[\"T\"], AA, BB, Vm, L_mm, day=day)[\"Rs_min\"]\n        T_wall = T_hi if hi else T_lo\n        to_xyz = lambda a, b: (np.full_like(a, T_wall), a, b)\n        wall_name = f\"T壁(T={rec['T']:.1f})\"\n\n    # matplotlib で等値線の座標（segments）を取得（描画はしない）\n    use_levels = WALL_LEVELS if levels is None else levels\n    fig_tmp, ax_tmp = plt.subplots()\n    cs = ax_tmp.contour(AA, BB, Rs, levels=use_levels)\n    traces = []\n    for level, segs in zip(cs.levels, cs.allsegs):\n        if not segs:\n            continue\n        is_pass = abs(level - 2.0) \u003c 1e-9\n        color = \"black\" if is_pass else _level_color(level, hi=max(color_hi, 2.5))\n        width = 6 if is_pass else 2.5\n        for seg in segs:\n            a, b = seg[:, 0], seg[:, 1]\n            x, y, z = to_xyz(a, b)\n            traces.append(go.Scatter3d(\n                x=x, y=y, z=z, mode=\"lines\",\n                line=dict(color=color, width=width),\n                name=(f\"{wall_name} Rs={level:g}\"\n                      + (\"（合格境界）\" if is_pass else \"\")),\n                showlegend=False,\n                hovertemplate=f\"Rs_min={level:g}\u003cextra>{wall_name}\u003c/extra>\",\n            ))\n    plt.close(fig_tmp)\n    return traces\n\n\ndef _designspace_volume_trace(grid, criteria_Rs=2.0, surface_count=30):\n    \"\"\"\n    デザインスペースを「無段階の雲」として描く go.Volume トレース。\n    合格領域だけを残し（不合格点の値は 0 にして isomin で消す）、Rs_min で着色。\n    格子は make_grid の meshgrid(indexing='ij') 由来の規則格子である前提。\n    滑らかさ＝格子の細かさ（呼び出し側 n）× surface_count（等値層の枚数）。\n    \"\"\"\n    mask = grid[\"pass_mask\"]\n    # 合格点は Rs_min、不合格点は 0（isomin で描画対象外にする＝無色透明）\n    value = np.where(mask, grid[\"Rs_min\"], 0.0)\n    rs_max = float(grid[\"Rs_min\"][mask].max()) if mask.any() else 3.0\n    # 色スケールをデザインスペース内の Rs 範囲（境界〜最大）に引き伸ばす\n    #  → 内部で赤(ギリギリ合格)→緑(余裕大)の変化がはっきり出る。退化時は少し広げる。\n    cmin = float(criteria_Rs)\n    cmax = rs_max if rs_max > cmin + 1e-6 else cmin + 0.5\n    return go.Volume(\n        x=grid[\"T\"], y=grid[\"phi\"], z=grid[\"F\"], value=value,\n        isomin=criteria_Rs,                 # 合格境界（Rs≥2.0）から上だけ雲にする\n        isomax=rs_max,\n        opacity=0.10,                       # 半透明（無段階の靄）\n        opacityscale=\"uniform\",             # 層ごとの不透明度を均一にして靄を滑らかに\n        surface_count=surface_count,        # 等値層の枚数（多いほど滑らか）\n        colorscale=\"Viridis\", cmin=cmin, cmax=cmax,\n        caps=dict(x_show=False, y_show=False, z_show=False),\n        colorbar=dict(title=\"Rs_min\", thickness=15, len=0.6),\n        name=\"デザインスペース（雲）\",\n        hovertemplate=(\"T=%{x:.1f}℃\u003cbr>φ=%{y:.3f}\u003cbr>F=%{z:.2f}\u003cbr>\"\n                       \"Rs_min=%{value:.2f}\u003cextra>合格\u003c/extra>\"),\n    )\n\n\ndef _auto_wall_side(grid, factor_key):\n    \"\"\"合格領域がどちら寄りかで壁の置き場所を自動判定。\n    合格点のその因子の重心が範囲中央より上なら上限側、下なら下限側に壁を置く\n    （等高線の壁をデザインスペースの近くに来させて見やすくする）。\"\"\"\n    mask = grid[\"pass_mask\"]\n    if not mask.any():\n        return \"low\"\n    vals = grid[factor_key][mask]\n    mid = 0.5 * (grid[factor_key].min() + grid[factor_key].max())\n    return \"high\" if vals.mean() >= mid else \"low\"\n\n\ndef _validated_box_trace(factors):\n    \"\"\"検証済みの元因子範囲を表すワイヤーフレームの箱（12辺）。外挿域との境を示す。\"\"\"\n    Tl, Th = factors[\"T\"][\"low\"], factors[\"T\"][\"high\"]\n    Pl, Ph = factors[\"phi\"][\"low\"], factors[\"phi\"][\"high\"]\n    Fl, Fh = factors[\"F\"][\"low\"], factors[\"F\"][\"high\"]\n    c = [(Tl, Pl, Fl), (Th, Pl, Fl), (Th, Ph, Fl), (Tl, Ph, Fl),\n         (Tl, Pl, Fh), (Th, Pl, Fh), (Th, Ph, Fh), (Tl, Ph, Fh)]\n    edges = [(0, 1), (1, 2), (2, 3), (3, 0), (4, 5), (5, 6), (6, 7), (7, 4),\n             (0, 4), (1, 5), (2, 6), (3, 7)]\n    xs, ys, zs = [], [], []\n    for i, j in edges:\n        xs += [c[i][0], c[j][0], None]\n        ys += [c[i][1], c[j][1], None]\n        zs += [c[i][2], c[j][2], None]\n    return go.Scatter3d(\n        x=xs, y=ys, z=zs, mode=\"lines\",\n        line=dict(color=\"gray\", width=3, dash=\"dash\"),\n        name=\"検証範囲（この外は外挿）\",\n        hoverinfo=\"skip\",\n    )\n\n\ndef plot_designspace_3d(grid, rec, title=\"デザインスペース\",\n                        model_mod=None, peaks=None, factors=None,\n                        Vm=None, L_mm=None, day=0, cloud_style=\"volume\",\n                        wall_side=\"auto\", n_contours=5, surface_count=30,\n                        rotate_frames=120, rotate_duration_ms=33,\n                        robust_box=None):\n    \"\"\"\n    04_optimize.evaluate_grid の結果と推奨条件 rec から\n    対話的 3D 図を作成し plotly Figure を返す。\n\n    中央: デザインスペースの雲。cloud_style で表現を選ぶ:\n      \"volume\"  … 無段階の半透明ボリューム（go.Volume。WebGL 必須）\n      \"scatter\" … 合格点の散布点（go.Scatter3d）\n    壁:   model_mod 等が渡されれば、各壁に「垂直因子＝推奨値固定」の Rs 等高線を投影。\n    wall_side: 等高線の壁の置き場所。文字列で全壁一括、または因子ごとの dict で個別指定。\n      文字列: \"auto\"（合格領域に近い面へ自動）／\"low\"（下限側）／\"high\"（上限側）\n      dict  : {\"T\": .., \"phi\": .., \"F\": ..} 各値は \"auto\"/\"low\"/\"high\"。\n              F壁は床(low)/天井(high)、T壁・φ壁は手前(low)/奥(high) に対応。\n\n    grid : evaluate_grid() の戻り値 dict（T, phi, F, Rs_min, pass_mask, ...）\n    rec  : max_margin_point() の戻り値 dict（T, phi, F, margin）または None\n    壁を描くには model_mod, peaks, factors, Vm, L_mm が必要（無ければ雲のみ）。\n    \"\"\"\n    mask = grid[\"pass_mask\"]\n    Rs_th = 2.0\n    # Rs 最大値を自動設定: 雲は合格域内の最大、壁の等高線は格子全体の最大に合わせる\n    ds_rs_max = float(grid[\"Rs_min\"][mask].max()) if mask.any() else 3.0\n    global_rs_max = float(grid[\"Rs_min\"].max())\n\n    fig = go.Figure()\n\n    # ── 外挿時は検証範囲の枠を描く（外挿域と見分けるため）──\n    in_range = grid.get(\"in_range\")\n    if factors is not None and in_range is not None and not in_range.all():\n        fig.add_trace(_validated_box_trace(factors))\n\n    # ── 各壁に等高線を投影（垂直な因子を推奨値に固定）──\n    # which と「その壁に垂直な因子キー」の対応（auto 配置の判定に使う）\n    perp_key = {\"TP_floor\": \"F\", \"TF_wall\": \"phi\", \"PF_wall\": \"T\"}\n\n    def _resolve_side(perp):\n        # wall_side が dict ならその因子の指定、文字列なら全壁共通\n        spec = wall_side.get(perp, \"auto\") if isinstance(wall_side, dict) else wall_side\n        return _auto_wall_side(grid, perp) if spec == \"auto\" else spec\n\n    can_walls = (rec is not None and model_mod is not None and peaks is not None\n                 and factors is not None and Vm is not None and L_mm is not None)\n    # 等高線はデザインスペース内（合格境界 Rs=2.0 〜 合格域の最大）を n_contours 本に等分\n    rs_hi = ds_rs_max if ds_rs_max > Rs_th + 1e-6 else Rs_th + 0.5\n    contour_levels = list(np.round(np.linspace(Rs_th, rs_hi, max(2, n_contours)), 4))\n    if can_walls:\n        for which in (\"TP_floor\", \"TF_wall\", \"PF_wall\"):\n            side = _resolve_side(perp_key[which])\n            for tr in _wall_contour_lines(\n                    model_mod, peaks, factors, Vm, L_mm, rec, which,\n                    day=day, wall_side=side, levels=contour_levels,\n                    color_hi=ds_rs_max):\n                fig.add_trace(tr)\n\n    # ── デザインスペースの雲 ──\n    if mask.any():\n        if cloud_style == \"volume\":\n            fig.add_trace(_designspace_volume_trace(grid, criteria_Rs=Rs_th,\n                                                    surface_count=surface_count))\n        else:\n            cmax = ds_rs_max if ds_rs_max > Rs_th + 1e-6 else Rs_th + 0.5\n            fig.add_trace(go.Scatter3d(\n                x=grid[\"T\"][mask], y=grid[\"phi\"][mask], z=grid[\"F\"][mask],\n                mode=\"markers\",\n                marker=dict(\n                    size=4, color=grid[\"Rs_min\"][mask],\n                    colorscale=\"Viridis\", cmin=Rs_th, cmax=cmax, opacity=0.8,\n                    colorbar=dict(title=\"Rs_min\", thickness=15, len=0.6),\n                    line=dict(width=0),\n                ),\n                name=\"デザインスペース（合格）\",\n                hovertemplate=(\n                    \"T=%{x:.1f}℃\u003cbr>φ=%{y:.3f}\u003cbr>F=%{z:.2f}\u003cbr>\"\n                    \"Rs_min=%{marker.color:.2f}\u003cextra>合格\u003c/extra>\"\n                ),\n            ))\n\n    # ── 推奨条件（最大余裕点）──\n    if rec is not None:\n        # 推奨点でのより詳細な情報をホバーに入れる。\n        # 最適化基準により margin（最大余裕）か objective（t_R最速/ACN最小）のどちらかが入る。\n        if \"margin\" in rec:\n            obj_txt = f\"余裕={rec['margin']:.3f}\"\n        elif \"objective\" in rec:\n            obj_txt = f\"目的値={rec['objective']:.3f}\"\n        else:\n            obj_txt = \"\"\n        hover_txt = (\n            f\"T={rec['T']:.1f}℃\u003cbr>\"\n            f\"φ={rec['phi']:.3f}\u003cbr>\"\n            f\"F={rec['F']:.2f} mL/min\u003cbr>\"\n            f\"{obj_txt}\"\n        )\n        fig.add_trace(go.Scatter3d(\n            x=[rec[\"T\"]], y=[rec[\"phi\"]], z=[rec[\"F\"]],\n            mode=\"markers\",\n            marker=dict(\n                size=7,\n                color=\"#111111\",                 # 締まった黒のドット\n                symbol=\"circle\",\n                line=dict(color=\"white\", width=2),  # 白ハロで背景から浮かせる\n            ),\n            name=\"推奨条件（最大余裕点）\",\n            hovertemplate=hover_txt + \"\u003cextra>推奨条件\u003c/extra>\",\n        ))\n\n        # ── 変動範囲の箱（最適化基準で設定した ±δ。推奨点中心の直方体）──\n        # robust_box = {\"center\": (T,phi,F), \"delta\": {\"T\":..,\"phi\":..,\"F\":..}}\n        if robust_box is not None:\n            cx, cy, cz = robust_box[\"center\"]\n            dl = robust_box[\"delta\"]\n            dT, dP, dF = dl.get(\"T\", 0.0), dl.get(\"phi\", 0.0), dl.get(\"F\", 0.0)\n            bxs, bys, bzs = _cuboid_edges(cx - dT, cx + dT, cy - dP, cy + dP,\n                                          cz - dF, cz + dF)\n            fig.add_trace(go.Scatter3d(\n                x=bxs, y=bys, z=bzs, mode=\"lines\",\n                line=dict(color=\"#111111\", width=4, dash=\"dash\"),\n                name=f\"変動範囲 ±({dT:g},{dP:g},{dF:g})\",\n                hoverinfo=\"skip\",\n            ))\n\n    # ── レイアウト ──\n    n_pass = int(mask.sum())\n    n_total = mask.size\n    subtitle = f\"合格領域 {n_pass}/{n_total} 点 ({100*n_pass/n_total:.1f}%)\"\n    if rec is not None:\n        subtitle += (f\" | 推奨: T={rec['T']:.1f}℃ / φ={rec['phi']:.3f}\"\n                     f\" / F={rec['F']:.2f} mL/min\")\n\n    # 自動回転アニメーション用フレーム（カメラを z 軸まわりに一周）\n    r, z_eye, n_frames = 2.4, 0.8, max(8, int(rotate_frames))\n    frames = []\n    for k in range(n_frames):\n        ang = 2.0 * np.pi * k / n_frames\n        eye = dict(x=r * np.cos(ang), y=r * np.sin(ang), z=z_eye)\n        frames.append(go.Frame(layout=dict(scene_camera=dict(eye=eye)), name=str(k)))\n    fig.frames = frames\n\n    fig.update_layout(\n        title=dict(text=f\"{title}\u003cbr>\u003csup>{subtitle}\u003c/sup>\", x=0.5),\n        scene=dict(\n            xaxis=dict(title=\"T [℃]\"),\n            yaxis=dict(title=\"φ (ACN 分率)\"),\n            zaxis=dict(title=\"F [mL/min]\"),\n            camera=dict(eye=dict(x=1.5, y=-1.8, z=0.8)),\n        ),\n        legend=dict(x=0.01, y=0.99, bordercolor=\"gray\", borderwidth=1),\n        margin=dict(l=0, r=0, t=80, b=0),\n        width=900, height=700,\n        updatemenus=[dict(\n            type=\"buttons\", showactive=False,\n            x=0.02, y=0.02, xanchor=\"left\", yanchor=\"bottom\",\n            buttons=[\n                dict(label=\"▶ 自動回転\", method=\"animate\",\n                     args=[None, {\"frame\": {\"duration\": int(rotate_duration_ms), \"redraw\": True},\n                                  \"fromcurrent\": True, \"mode\": \"immediate\",\n                                  \"transition\": {\"duration\": int(rotate_duration_ms),\n                                                 \"easing\": \"linear\"}}]),\n                dict(label=\"⏸ 停止\", method=\"animate\",\n                     args=[[None], {\"frame\": {\"duration\": 0, \"redraw\": False},\n                                    \"mode\": \"immediate\"}]),\n            ],\n        )],\n    )\n    return fig\n\n\n# ──────────────────────────────\n# 2D スライス（F 固定の T-φ 等高線）— 補助図\n# ──────────────────────────────\ndef plot_slice_2d(model_mod, peaks, factors, Vm, L_mm, criteria,\n                  F_fixed=None, n=51, day=0):\n    \"\"\"\n    F を固定した T-φ 面の Rs_min 等高線図（合格/不合格境界を直感的に見せる）。\n    F_fixed=None のとき因子の center 値を使う。\n    \"\"\"\n    if F_fixed is None:\n        F_fixed = (factors[\"F\"][\"low\"] + factors[\"F\"][\"high\"]) / 2.0\n\n    T_ax = np.linspace(factors[\"T\"][\"low\"], factors[\"T\"][\"high\"], n)\n    P_ax = np.linspace(factors[\"phi\"][\"low\"], factors[\"phi\"][\"high\"], n)\n    TT, PP = np.meshgrid(T_ax, P_ax)\n    FF = np.full_like(TT, F_fixed)\n\n    sep = model_mod.separation(peaks, TT, PP, FF, Vm, L_mm, day=day)\n    Rs = sep[\"Rs_min\"]\n    tR_TP = sep[\"TP\"][\"tR\"]\n    tR_last = np.maximum.reduce([sep[\"TP\"][\"tR\"], sep[\"IP1\"][\"tR\"], sep[\"IP2\"][\"tR\"]])\n\n    # 3条件を全て満たす合否マスク（2値）\n    pass_2d = (\n        (Rs >= criteria[\"Rs_min\"])\n        & (tR_TP \u003c= criteria[\"tR_TP_max\"])\n        & (tR_last \u003c= criteria[\"tR_last_max\"])\n    ).astype(float)\n\n    fig = go.Figure()\n    # Rs_min の等高線\n    fig.add_trace(go.Contour(\n        x=T_ax, y=P_ax, z=Rs,\n        colorscale=\"Viridis\",\n        contours=dict(\n            start=0.5, end=3.5, size=0.25,\n            showlabels=True, labelfont=dict(size=10),\n        ),\n        colorbar=dict(title=\"Rs_min\", thickness=12, len=0.5, x=1.02),\n        name=\"Rs_min\",\n    ))\n    # 合格境界（白い太線）\n    fig.add_trace(go.Contour(\n        x=T_ax, y=P_ax, z=pass_2d,\n        contours=dict(start=0.5, end=0.5, size=1),\n        line=dict(color=\"white\", width=3, dash=\"solid\"),\n        showscale=False,\n        name=\"合格境界\",\n    ))\n\n    fig.update_layout(\n        title=f\"T-φ 断面（F={F_fixed:.2f} mL/min 固定）\",\n        xaxis_title=\"T [℃]\",\n        yaxis_title=\"φ (ACN 分率)\",\n        width=600, height=480,\n    )\n    return fig\n\n\n# ──────────────────────────────\n# HTML 書き出し\n# ──────────────────────────────\ndef save_html(fig, path):\n    os.makedirs(os.path.dirname(path) or \".\", exist_ok=True)\n    fig.write_html(path, include_plotlyjs=\"cdn\", full_html=True)\n    print(f\"  → 保存: {path}\")\n\n\n# ──────────────────────────────\n# 回転 GIF 書き出し（カメラを一周させた静止画を連結）\n# ──────────────────────────────\ndef rotation_gif_bytes(fig, n_frames=36, width=720, height=560,\n                       duration_ms=80, r=2.4, z_eye=0.8):\n    \"\"\"\n    3D 図のカメラを z 軸まわりに一周させ、各角度の静止画を GIF に連結してバイト列で返す。\n    各フレームは plotly の静止画書き出し（kaleido＋Chrome が必要）。\n    フレーム数が多いほど滑らかだが時間がかかる。\n    \"\"\"\n    import io\n    import copy\n    from PIL import Image\n\n    f = copy.deepcopy(fig)\n    f.layout.updatemenus = []          # GIF には操作ボタンは不要\n    images = []\n    for k in range(n_frames):\n        ang = 2.0 * np.pi * k / n_frames\n        f.update_layout(scene_camera=dict(eye=dict(\n            x=r * np.cos(ang), y=r * np.sin(ang), z=z_eye)))\n        png = f.to_image(format=\"png\", width=width, height=height, scale=1)\n        images.append(Image.open(io.BytesIO(png)).convert(\"RGB\"))\n    buf = io.BytesIO()\n    images[0].save(buf, format=\"GIF\", save_all=True, append_images=images[1:],\n                   duration=duration_ms, loop=0, disposal=2)\n    return buf.getvalue()\n\n\ndef save_rotation_gif(fig, path, **kwargs):\n    \"\"\"回転 GIF をファイルに書き出す。\"\"\"\n    os.makedirs(os.path.dirname(path) or \".\", exist_ok=True)\n    data = rotation_gif_bytes(fig, **kwargs)\n    with open(path, \"wb\") as fp:\n        fp.write(data)\n    print(f\"  → 保存: {path}（{len(data)//1024} KB）\")\n    return data\n\n\n# ──────────────────────────────\n# 動作確認\n# ──────────────────────────────\ndef _load_module(path, name):\n    import importlib.util\n    spec = importlib.util.spec_from_file_location(name, path)\n    mod = importlib.util.module_from_spec(spec)\n    spec.loader.exec_module(mod)\n    return mod\n\n\nif __name__ == \"__main__\":\n    here = os.path.dirname(__file__)\n    model_mod = _load_module(os.path.join(here, \"01_model.py\"), \"model01\")\n    opt_mod = _load_module(os.path.join(here, \"04_optimize.py\"), \"opt04\")\n\n    Vm, L = 0.24, 100.0\n    factors = {\n        \"T\":   {\"low\": 40, \"center\": 50, \"high\": 60},\n        \"phi\": {\"low\": 0.38, \"center\": 0.45, \"high\": 0.52},\n        \"F\":   {\"low\": 0.4, \"center\": 0.6, \"high\": 0.8},\n    }\n    criteria = {\"Rs_min\": 2.0, \"tR_TP_max\": 7.5, \"tR_last_max\": 10.0}\n\n    peaks = model_mod.example_peaks()\n    for name in (\"IP1\", \"TP\", \"IP2\"):\n        peaks[name][\"e\"] = 80.0    # クロスオーバーが起きる例パラメータ\n\n    print(\"格子評価中...\")\n    grid, rec = opt_mod.optimize(model_mod, peaks, factors, Vm, L, criteria, n=25)\n\n    print(f\"合格点: {int(grid['pass_mask'].sum())}/{grid['pass_mask'].size} 点\")\n    if rec:\n        print(f\"推奨条件: T={rec['T']:.1f}℃ / φ={rec['phi']:.3f} / F={rec['F']:.2f} mL/min\")\n        print(f\"余裕（正規化）: {rec['margin']:.3f}\")\n\n    print(\"\\n3D グラフを生成中...\")\n    fig3d = plot_designspace_3d(grid, rec, model_mod=model_mod, peaks=peaks,\n                                factors=factors, Vm=Vm, L_mm=L)\n    save_html(fig3d, \"outputs/designspace_3d.html\")\n\n    print(\"2D スライスを生成中（F=中水準固定）...\")\n    fig2d = plot_slice_2d(model_mod, peaks, factors, Vm, L, criteria,\n                          F_fixed=factors[\"F\"][\"center\"])\n    save_html(fig2d, \"outputs/designspace_slice_2d.html\")\n\n    print(\"\\n完了。ブラウザで outputs/ 内の HTML を開いてください。\")\n", "scripts/06_quadratic.py": "\"\"\"\n06_quadratic.py — 二次回帰（フル2次・応答曲面）モデル\n\nメカニズムモデル（01_model）の代替。各ピークについて t_R と W_h を\n(T, φ, F) のフル2次式で直接フィットする（10パラメータ／応答）:\n\n  y = β0 + β1·T + β2·φ + β3·F + β4·T² + β5·φ² + β6·F² + β7·Tφ + β8·TF + β9·φF\n\n01_model と同じ `separation()` / `sample_peaks()` インターフェースを持つので、\nevaluate_grid / optimize / 3D描画 / rs_confidence にそのまま差し込める（入口だけ分岐）。\n\n注意（references/モデル比較_メカニズムvs二次回帰.md）:\n  二次回帰は10パラメータ固定で、点数が少ないと過学習し外挿が弱い。\n  少数データではメカニズムモデルの方が LOO 予測で明確に優れる。用途に応じて選ぶこと。\n\n依存: numpy / statsmodels / pandas。\n\"\"\"\n\nimport numpy as np\nimport statsmodels.api as sm\n\nEIGHT_LN2 = 8.0 * np.log(2.0)\nWB_OVER_WH = 4.0 / np.sqrt(EIGHT_LN2)   # W_b = 4·t_R/√N, W_h = √(8ln2)·t_R/√N → W_b = 1.699·W_h\nQTERMS = [\"const\", \"T\", \"phi\", \"F\", \"T^2\", \"phi^2\", \"F^2\", \"T*phi\", \"T*F\", \"phi*F\"]  # 2次項名\n\n\n# ──────────────────────────────\n# 2次の計画ベクトル\n# ──────────────────────────────\ndef qdesign(T, phi, F):\n    \"\"\"(T,φ,F) → フル2次の説明変数行列 [1,T,φ,F,T²,φ²,F²,Tφ,TF,φF]（n×10）。\n    任意形状（スカラー・1次元・メッシュ）を受け、ブロードキャスト後に平坦化して (n,10) を返す。\"\"\"\n    T, phi, F = np.broadcast_arrays(np.asarray(T, float), np.asarray(phi, float),\n                                    np.asarray(F, float))\n    t, p, f = T.ravel(), phi.ravel(), F.ravel()\n    one = np.ones_like(t)\n    return np.column_stack([one, t, p, f, t**2, p**2, f**2, t*p, t*f, p*f])\n\n\ndef _bshape(T, phi, F):\n    \"\"\"T,φ,F をブロードキャストしたときの形（predict の戻り値をこの形に戻す）。\"\"\"\n    return np.broadcast(np.asarray(T), np.asarray(phi), np.asarray(F)).shape\n\n\n# ──────────────────────────────\n# フィット（03_fit.fit_all と同じ戻り値形）\n# ──────────────────────────────\ndef _rmse(a, b):\n    return float(np.sqrt(np.mean((np.asarray(a) - np.asarray(b)) ** 2)))\n\n\ndef adj_r2(res):\n    \"\"\"自由度調整済み R²（nan なら None）。\"\"\"\n    v = float(res.rsquared_adj)\n    return None if not np.isfinite(v) else v\n\n\ndef q2_loo(res):\n    \"\"\"Q²（予測 R²）= 1 − PRESS/SST。OLS の LOO 残差 e_i/(1−h_ii) から算出（03_fit と同定義）。\"\"\"\n    y = np.asarray(res.model.endog, dtype=float)\n    resid = np.asarray(res.resid, dtype=float)\n    h = np.asarray(res.get_influence().hat_matrix_diag, dtype=float)\n    if np.any(h > 1.0 - 1e-8):\n        return None\n    press = float(np.sum((resid / (1.0 - h)) ** 2))\n    sst = float(np.sum((y - y.mean()) ** 2))\n    return None if sst \u003c= 0 else 1.0 - press / sst\n\n\ndef lack_of_fit(cond_df, res):\n    \"\"\"同一条件の繰り返し（純誤差）から当てはまり不足を F 検定（03_fit と同定義）。\n    レプリケートが無い/自由度不足なら None。p\u003c0.05 で「モデルで説明しきれないズレあり」。\"\"\"\n    import collections\n    from scipy import stats as _stats\n    y = np.asarray(res.model.endog, dtype=float)\n    sse = float(np.sum(np.asarray(res.resid, dtype=float) ** 2))\n    df_e = float(res.df_resid)\n    keys = list(zip(np.round(cond_df[\"T\"].to_numpy(float), 6),\n                    np.round(cond_df[\"phi\"].to_numpy(float), 6),\n                    np.round(cond_df[\"F\"].to_numpy(float), 6)))\n    groups = collections.defaultdict(list)\n    for i, k in enumerate(keys):\n        groups[k].append(i)\n    ss_pe, df_pe = 0.0, 0.0\n    for idx in groups.values():\n        if len(idx) > 1:\n            yy = y[idx]\n            ss_pe += float(np.sum((yy - yy.mean()) ** 2))\n            df_pe += len(idx) - 1\n    df_lof = df_e - df_pe\n    if df_pe \u003c 1 or df_lof \u003c 1:\n        return None\n    ss_lof = max(sse - ss_pe, 0.0)\n    ms_pe, ms_lof = ss_pe / df_pe, ss_lof / df_lof\n    F = ms_lof / ms_pe if ms_pe > 0 else float(\"inf\")\n    return {\"F\": float(F), \"p\": float(_stats.f.sf(F, df_lof, df_pe)),\n            \"df_lof\": int(df_lof), \"df_pe\": int(df_pe)}\n\n\ndef fit_all(df, Vm, L_mm, peak_names=None, **_ignore):\n    \"\"\"\n    各ピークの t_R・W_h を (T,φ,F) のフル2次で OLS フィット。\n    戻り値 (peaks, diagnostics) は 03_fit.fit_all と同じ形（app 側の表示コードを共有できる）:\n      peaks[name] = {\"tR_coef\": (10,), \"Wh_coef\": (10,)}\n      diagnostics[name] = {R2_retention, R2_width, RMSE_tR_min, RMSE_Wh_min, n, tR_cov, Wh_cov}\n    Vm, L_mm は署名互換のため受け取るが 2次回帰では未使用。\n    \"\"\"\n    names = list(peak_names) if peak_names is not None else [\"IP1\", \"TP\", \"IP2\"]\n    peaks, diagnostics = {}, {}\n    for name in names:\n        sub = df.dropna(subset=[f\"tR_{name}\", f\"Wh_{name}\"])\n        T = sub[\"T\"].to_numpy(float); phi = sub[\"phi\"].to_numpy(float); F = sub[\"F\"].to_numpy(float)\n        tR = sub[f\"tR_{name}\"].to_numpy(float); Wh = sub[f\"Wh_{name}\"].to_numpy(float)\n        X = qdesign(T, phi, F)\n        rt = sm.OLS(tR, X).fit()\n        rw = sm.OLS(Wh, X).fit()\n        peaks[name] = {\"tR_coef\": np.asarray(rt.params), \"Wh_coef\": np.asarray(rw.params)}\n        diagnostics[name] = {\n            \"R2_retention\": rt.rsquared,\n            \"R2_width\": rw.rsquared,\n            \"RMSE_tR_min\": _rmse(rt.fittedvalues, tR),\n            \"RMSE_Wh_min\": _rmse(rw.fittedvalues, Wh),\n            \"n\": len(sub),\n            \"tR_cov\": np.asarray(rt.cov_params()),\n            \"Wh_cov\": np.asarray(rw.cov_params()),\n            \"LOF_retention\": lack_of_fit(sub, rt),\n            \"LOF_width\": lack_of_fit(sub, rw),\n            \"adjR2_retention\": adj_r2(rt),\n            \"adjR2_width\": adj_r2(rw),\n            \"Q2_retention\": q2_loo(rt),\n            \"Q2_width\": q2_loo(rw),\n            \"ret_pvalues\": dict(zip(QTERMS, np.asarray(rt.pvalues, dtype=float))),\n            \"wid_pvalues\": dict(zip(QTERMS, np.asarray(rw.pvalues, dtype=float))),\n        }\n    return peaks, diagnostics\n\n\n# ──────────────────────────────\n# 予測・分離度（01_model.separation と同じインターフェース）\n# ──────────────────────────────\ndef predict_peak(peak, T, phi, F, Vm, L_mm, day=0):\n    \"\"\"1ピークの t_R, W_h, W_b を dict で返す（2次回帰の係数から）。\n    外挿で負になり得るので W_h は微小正値でクリップ（Rs の 0 割り回避）。\"\"\"\n    shape = _bshape(T, phi, F)\n    X = qdesign(T, phi, F)\n    tR = (X @ peak[\"tR_coef\"]).reshape(shape)                     # 入力形状に戻す\n    Wh = np.maximum(X @ peak[\"Wh_coef\"], 1e-6).reshape(shape)     # 外挿で負→微小正にクリップ\n    Wb = WB_OVER_WH * Wh\n    return {\"tR\": tR, \"Wh\": Wh, \"Wb\": Wb}\n\n\ndef resolution(tR_a, Wb_a, tR_b, Wb_b):\n    return 2.0 * np.abs(tR_a - tR_b) / (Wb_a + Wb_b)\n\n\ndef separation(peaks, T, phi, F, Vm, L_mm, day=0, target=\"TP\", interfering=None):\n    \"\"\"01_model.separation と同じ戻り値（target/各IP の予測 ＋ Rs_each ＋ Rs_min）。\"\"\"\n    if interfering is None:\n        interfering = [k for k in peaks.keys() if k != target]\n    tp = predict_peak(peaks[target], T, phi, F, Vm, L_mm, day)\n    out = {target: tp}\n    rs_each, rs_vals = {}, []\n    for ip in interfering:\n        p = predict_peak(peaks[ip], T, phi, F, Vm, L_mm, day)\n        out[ip] = p\n        rs = resolution(tp[\"tR\"], tp[\"Wb\"], p[\"tR\"], p[\"Wb\"])\n        rs_each[ip] = rs\n        rs_vals.append(rs)\n    rs_min = rs_vals[0]\n    for r in rs_vals[1:]:\n        rs_min = np.minimum(rs_min, r)\n    out[\"Rs_each\"] = rs_each\n    out[\"Rs_min\"] = rs_min\n    if \"IP1\" in rs_each:\n        out[\"Rs1\"] = rs_each[\"IP1\"]\n    if \"IP2\" in rs_each:\n        out[\"Rs2\"] = rs_each[\"IP2\"]\n    return out\n\n\n# ──────────────────────────────\n# Rs 信頼区間用の係数サンプリング（04_optimize.rs_confidence から呼ばれる）\n# ──────────────────────────────\ndef sample_peaks(peaks, diagnostics, rng, target, interfering):\n    \"\"\"各ピークの t_R・W_h の2次係数を OLS 共分散からサンプルした peaks dict を返す。\"\"\"\n    out = {}\n    for nm in [target] + list(interfering):\n        d = diagnostics[nm]\n        out[nm] = {\n            \"tR_coef\": rng.multivariate_normal(peaks[nm][\"tR_coef\"], np.atleast_2d(d[\"tR_cov\"])),\n            \"Wh_coef\": rng.multivariate_normal(peaks[nm][\"Wh_coef\"], np.atleast_2d(d[\"Wh_cov\"])),\n        }\n    return out\n", "config.example.yaml": "# config.example.yaml\n# 使い方：このファイルを config.yaml にコピーし、実際の値に書き換えて使う。\n# 変わる部分（因子範囲・ピーク定義・カラム情報・合格条件・実験設計）をここに集約。\n# 固定ロジックは scripts/ に置く（このファイルを変えるだけで別化合物に転用できる）。\n\n# ──────────────────────────────\n# ピーク定義\n# ──────────────────────────────\npeaks:\n  target: TP                  # 目的ピーク名\n  interfering: [IP1, IP2]     # 夾雑ピーク名（溶出順不問。クロスオーバー対応済み）\n  elution_order_nominal:      # 現行条件（中水準）での溶出順（モデルの初期値チェック用）\n    - IP1\n    - TP\n    - IP2\n\n# ──────────────────────────────\n# カラム情報\n# ──────────────────────────────\ncolumn:\n  name: \"Waters ACQUITY UPLC BEH C8\"\n  length_mm: 100              # カラム長 [mm]\n  id_mm: 2.1                  # 内径 [mm]\n  dp_um: 1.7                  # 粒径 [µm]\n  porosity: 0.66              # 全空隙率（Waters 推奨の概算値。BEH 全多孔性粒子）\n  Vm_mL: 0.23                 # カラム死容量 [mL]（幾何推算: 0.66 × π r² L ≈ 0.229）\n                              # 厳密化: 不保持物質(ウラシル等)を注入し Vm = t0 × F で実測\n  peak_width_definition: half_height  # ピーク幅の定義（半値幅 W_h）\n                                      # 理論段数換算: N = 5.54 × (t_R / W_h)²\n\n# ──────────────────────────────\n# 実験因子の範囲（探索範囲）\n# ──────────────────────────────\n# 中水準は現行条件より低温・高ACN側にシフト（現行: T=75℃ / phi=0.40 / F=0.6）\n# F の水準は t_R = Vm*(1+k)/F の反比例から計算。\n#   実測後の更新式: F_low = Vm*(1+k_center)/tR_high, F_high = Vm*(1+k_center)/tR_low\n# 既定値は実測 Day1 CCD（data/demo_runs.csv）の設計範囲（±1 水準）に合わせてある。\n# → ②解析タブの初期因子範囲がデモと一致する。別化合物では自分の設計範囲に書き換える。\nfactors:\n  T:\n    low: 45          # [°C]\n    center: 50       # [°C]  中水準\n    high: 55         # [°C]\n    unit: \"degC\"\n  phi:\n    low: 0.42        # ACN 体積分率（= 42% ACN）\n    center: 0.45     # ACN 体積分率（= 45% ACN）\n    high: 0.48       # ACN 体積分率（= 48% ACN）\n    unit: \"ACN_fraction\"\n  F:\n    low: 0.55        # [mL/min]\n    center: 0.60     # [mL/min]\n    high: 0.65       # [mL/min]\n    unit: \"mL_per_min\"\n\n# ──────────────────────────────\n# デザインスペースの合格条件\n# ──────────────────────────────\nacceptance_criteria:\n  Rs_min: 2.0        # min{Rs1, Rs2} の下限（ICH Q8 ベース）\n  tR_TP_max: 7.5     # 目的ピーク TP の保持時間の上限 [分]（TP固有の分析時間制約）\n  tR_last_max: null  # 最遅ピークの上限 [分]。これは「データ取り段階の洗浄前制約」であって\n                     # デザインスペースの合否ではないため既定は null（不使用）。\n                     # データ取り時の運用制約として課したい場合のみ数値（例 10.0）を入れる。\n\n# ──────────────────────────────\n# 実験計画（DoE）の設定\n# ──────────────────────────────\ndesign:\n  day1:\n    type: ccd              # 中心複合計画（Central Composite Design）\n    center_points: 6       # 中心点繰り返し数（純誤差推定・湾曲検定用、自由度5）\n    # 合計: 頂点 2³=8 + 軸上点 6 + 中心点 6 = 20 本\n  day2:\n    type: d_optimal        # D 最適（情報が薄い領域を狙い打ち）\n    bridge_center_points: 3  # Day2 冒頭に入れる中心点（Day1↔Day2 の日間差橋渡し用）\n  blocking: true           # 別日実施 → 日間変動をブロック項で補正\n                           # モデル: ln k = a + b/T + c·φ + δ·day\n  budget_per_day: 50       # 1日あたり実験本数の上限\n  run_time_min: 22         # 1注入あたりの所要時間 [分]（洗浄込み）\n\n# ──────────────────────────────\n# 入出力\n# ──────────────────────────────\nio:\n  input_excel: data/runs.xlsx   # 実測データ（各条件の T/phi/F/day と3ピークの t_R・W_h）\n  output_dir: outputs           # 推奨条件・3D html・フィット残差を出力するフォルダ\n", "data/demo_runs.csv": "T,phi,F,day,tR_TP,tR_IP1,tR_IP2,Wh_TP,Wh_IP1,Wh_IP2\n45,0.42,0.55,0,9.975,9.250,,,0.1605,\n55,0.42,0.55,0,8.619,8.063,9.631,0.1717,,0.1975\n45,0.42,0.65,0,8.392,8.127,9.525,0.1548,,0.1855\n55,0.42,0.65,0,7.270,6.792,8.099,0.1393,,0.1601\n45,0.48,0.55,0,4.720,4.422,5.452,0.0893,,0.1068\n55,0.48,0.55,0,4.212,3.967,4.776,0.0888,0.0813,0.0917\n45,0.48,0.65,0,3.968,3.708,4.568,0.0747,0.0798,0.0850\n55,0.48,0.65,0,3.533,3.319,3.992,0.0764,,0.0762\n41.59,0.45,0.6,0,6.452,6.001,7.450,0.1324,0.1118,0.1390\n58.41,0.45,0.6,0,5.150,4.842,5.771,0.1266,0.0958,0.1099\n50,0.45,0.5159,0,6.741,6.323,7.680,0.1253,0.1187,0.1475\n50,0.45,0.6841,0,5.046,4.713,5.726,0.1101,0.0934,0.1062\n50,0.39954,0.6,0,,,,,,\n50,0.50046,0.6,0,3.317,3.117,3.792,0.0687,,0.0721\n50,0.45,0.6,0,5.769,5.400,6.563,0.1107,0.0936,0.1230\n50,0.45,0.6,0,5.775,5.406,6.572,0.1103,0.0948,0.1228\n50,0.45,0.6,0,5.746,5.378,6.538,0.1098,0.0942,0.1228\n50,0.45,0.6,0,5.776,5.404,6.568,0.1105,0.0946,0.1226\n50,0.45,0.6,0,5.774,5.402,6.566,0.1118,0.0997,0.1220\n50,0.45,0.6,0,5.783,5.414,6.582,0.1106,0.0946,0.1234\n", ".streamlit/config.toml": "# アプリの配色テーマ（分析化学らしい teal/cyan アクセント）\n[theme]\nprimaryColor = \"#0d9488\"\nbackgroundColor = \"#ffffff\"\nsecondaryBackgroundColor = \"#f1f5f9\"\ntextColor = \"#0f172a\"\nfont = \"sans serif\"\n"};
