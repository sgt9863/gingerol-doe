<div id="boot">
  <h1>HPLC デザインスペース最適化</h1>
  <div class="bar"><i></i></div>
  <p>ブラウザ内で Python を準備しています。<br>
     初回だけ数十秒〜数分かかります（2 回目以降はキャッシュから高速に起動）。</p>
</div>
<div id="root"></div>
<script type="module">
import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.js";

const files = {
  "app.py": [
    "\"\"\"",
    "app.py — HPLC デザインスペース最適化の Streamlit Web アプリ（薄い入口）",
    "",
    "起動: streamlit run app.py",
    "",
    "実験〜可視化の正規フロー（タブで順に進む）:",
    "  ① 計画(CCD)      … Day1 の中心複合計画を生成し、データ入力用 Excel 雛形をDL",
    "  ② Day1 フィット   … 記入済み Day1 データを読み込み、保持3・幅3モデルをフィット",
    "  ③ D最適 augment  … メカニズムモデル基準で Day2 の追加点を生成、Excel 雛形をDL",
    "  ④ 最終解析        … Day1+Day2 全データでフィット → デザインスペース → 推奨条件 → DL",
    "  （デモ … 合成データで①〜④を一気に体験）",
    "",
    "注: 中核ロジック（01〜04）は numpy 系のみ。plotly/streamlit はこの入口と 05 専用。",
    "\"\"\"",
    "",
    "import io",
    "import os",
    "import re",
    "import importlib.util",
    "",
    "import numpy as np",
    "import pandas as pd",
    "import streamlit as st",
    "import yaml",
    "",
    "",
    "# ──────────────────────────────",
    "# scripts/ の数字始まりモジュールを読み込む",
    "# ──────────────────────────────",
    "HERE = os.path.dirname(os.path.abspath(__file__))",
    "SCRIPTS = os.path.join(HERE, \"scripts\")",
    "",
    "# kaleido（plotly の静止画レンダラ）の有無。stlite（ブラウザ内 Pyodide）には無いため、",
    "# 回転 GIF 機能はある環境でだけ表示する。中核の計算・3D表示はどちらでも同じ。",
    "HAS_KALEIDO = importlib.util.find_spec(\"kaleido\") is not None",
    "",
    "",
    "def _load(path, name):",
    "    spec = importlib.util.spec_from_file_location(name, path)",
    "    mod = importlib.util.module_from_spec(spec)",
    "    spec.loader.exec_module(mod)",
    "    return mod",
    "",
    "",
    "def _scripts_signature():",
    "    \"\"\"scripts/*.py の内容ハッシュ。中身が変わると load_modules のキャッシュキーも変わり、",
    "    再デプロイ後に古いモジュールが居座る（AttributeError 等）のを防ぐ。\"\"\"",
    "    import hashlib",
    "    h = hashlib.md5()",
    "    for fn in sorted(os.listdir(SCRIPTS)):",
    "        if fn.endswith(\".py\"):",
    "            with open(os.path.join(SCRIPTS, fn), \"rb\") as f:",
    "                h.update(f.read())",
    "    return h.hexdigest()",
    "",
    "",
    "@st.cache_resource",
    "def load_modules(scripts_sig):",
    "    # scripts_sig はキャッシュキー専用（中身は使わない）。スクリプトが変わると再ロードされる。",
    "    # 注意: 引数名をアンダースコア始まりにすると Streamlit がハッシュ対象から除外し、",
    "    # キャッシュが無効化されなくなる（古いモジュールが居座る）。必ず非アンダースコア名にする。",
    "    model = _load(os.path.join(SCRIPTS, \"01_model.py\"), \"model01\")",
    "    design = _load(os.path.join(SCRIPTS, \"02_design.py\"), \"design02\")",
    "    fit = _load(os.path.join(SCRIPTS, \"03_fit.py\"), \"fit03\")",
    "    opt = _load(os.path.join(SCRIPTS, \"04_optimize.py\"), \"opt04\")",
    "    ds = _load(os.path.join(SCRIPTS, \"05_designspace.py\"), \"ds05\")",
    "    quad = _load(os.path.join(SCRIPTS, \"06_quadratic.py\"), \"quad06\")",
    "    return model, design, fit, opt, ds, quad",
    "",
    "",
    "def load_config():",
    "    \"\"\"config.yaml があれば読む。無ければ config.example.yaml。\"\"\"",
    "    for fn in (\"config.yaml\", \"config.example.yaml\"):",
    "        p = os.path.join(HERE, fn)",
    "        if os.path.exists(p):",
    "            with open(p, encoding=\"utf-8\") as f:",
    "                return yaml.safe_load(f), fn",
    "    return None, None",
    "",
    "",
    "def to_excel_bytes(df, sheet_name=\"runs\"):",
    "    \"\"\"DataFrame を xlsx のバイト列にする（ダウンロードボタン用）。\"\"\"",
    "    buf = io.BytesIO()",
    "    with pd.ExcelWriter(buf, engine=\"openpyxl\") as w:",
    "        df.to_excel(w, index=False, sheet_name=sheet_name)",
    "    return buf.getvalue()",
    "",
    "",
    "def read_runs(uploaded, required_cols):",
    "    \"\"\"アップロードされた xlsx/csv を読み、必要列を検証して返す（不足なら None と不足列）。\"\"\"",
    "    df = (pd.read_csv(uploaded, keep_default_na=True, na_values=[\"\", \" \"])",
    "          if uploaded.name.endswith(\".csv\")",
    "          else pd.read_excel(uploaded, keep_default_na=True, na_values=[\"\", \" \"]))",
    "    missing = [c for c in required_cols if c not in df.columns]",
    "    return (None, missing) if missing else (df, [])",
    "",
    "",
    "def peaks_from_columns(columns):",
    "    \"\"\"アップロード表の列名からピーク構成を判定する。",
    "    tR_X と Wh_X の両方が揃う X をピークとして採用し、目的 TP を先頭に並べる。",
    "    IP は末尾の数字順（IP1, IP2, …, IP10 …）にソート。",
    "    見つからなければ (None, None)。\"\"\"",
    "    trs = {c[3:] for c in columns if c.startswith(\"tR_\")}",
    "    whs = {c[3:] for c in columns if c.startswith(\"Wh_\")}",
    "    names = trs & whs",
    "    if TARGET not in names:",
    "        return None, None",
    "",
    "    def _key(n):",
    "        m = re.search(r\"(\\d+)$\", n)",
    "        return (0, int(m.group(1))) if m else (1, n)",
    "",
    "    interfering = sorted((n for n in names if n != TARGET), key=_key)",
    "    return interfering, [TARGET] + interfering",
    "",
    "",
    "def factors_from_data(df, response_cols):",
    "    \"\"\"アップロードデータの T/φ/F 列の min–max を評価範囲（内挿範囲）にする。",
    "    応答が全て欠損の行（測定できなかった点）は「データが無い」ので範囲決定から除外する。",
    "    退化（min==max・全欠損など）で範囲が取れない因子があれば None を返す。\"\"\"",
    "    resp = df[[c for c in response_cols if c in df.columns]]",
    "    keep = resp.notna().any(axis=1) if resp.shape[1] else pd.Series(True, index=df.index)",
    "    sub = df[keep] if keep.any() else df",
    "    fr = {}",
    "    for k in (\"T\", \"phi\", \"F\"):",
    "        col = pd.to_numeric(sub[k], errors=\"coerce\")",
    "        lo, hi = float(np.nanmin(col)) if col.notna().any() else np.nan, \\",
    "            float(np.nanmax(col)) if col.notna().any() else np.nan",
    "        if not (np.isfinite(lo) and np.isfinite(hi)) or hi \u003c= lo:",
    "            return None",
    "        fr[k] = {\"low\": lo, \"center\": (lo + hi) / 2.0, \"high\": hi}",
    "    return fr",
    "",
    "",
    "def read_runs_auto(uploaded):",
    "    \"\"\"②解析用: ファイルを読み、基本列（T/φ/F/day）を検証し、ピーク構成を列名から判定する。",
    "    返り値は (df, interfering, all_peaks, error)。成功時 error=None、失敗時は df=None・error に理由。\"\"\"",
    "    df = (pd.read_csv(uploaded, keep_default_na=True, na_values=[\"\", \" \"])",
    "          if uploaded.name.endswith(\".csv\")",
    "          else pd.read_excel(uploaded, keep_default_na=True, na_values=[\"\", \" \"]))",
    "    miss = [c for c in (\"T\", \"phi\", \"F\", \"day\") if c not in df.columns]",
    "    if miss:",
    "        return None, None, None, f\"基本列が不足: {miss}\"",
    "    interfering, all_peaks = peaks_from_columns(df.columns)",
    "    if all_peaks is None:",
    "        return None, None, None, \"目的ピークの列（tR_TP と Wh_TP）が見つかりません\"",
    "    if not interfering:",
    "        return None, None, None, \"夾雑ピークの列（tR_IP*/Wh_IP* など）が見つかりません\"",
    "    return df, interfering, all_peaks, None",
    "",
    "",
    "# ──────────────────────────────",
    "# 画面共通：設定・スタイル",
    "# ──────────────────────────────",
    "st.set_page_config(page_title=\"HPLC デザインスペース最適化\", layout=\"wide\")",
    "",
    "st.markdown(\"\"\"",
    "\u003cstyle>",
    "  :root { --accent:#0d9488; --accent2:#0891b2; --line:rgba(128,128,128,.22); }",
    "  .block-container { padding-top: 1.1rem; max-width: 1120px; }",
    "",
    "  /* ── ヘッダー（帯ではなく、グラデ見出し＋細いルール） ── */",
    "  .app-header { margin:.1rem 0 1.15rem; }",
    "  .app-header h1 { margin:0; font-size:1.55rem; font-weight:650; letter-spacing:-.015em;",
    "    background:linear-gradient(92deg,var(--accent),var(--accent2));",
    "    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }",
    "  .app-header p { margin:.3rem 0 0; font-size:.85rem; font-weight:400; opacity:.68; }",
    "  .app-header .rule { height:2px; margin-top:.75rem; border-radius:2px;",
    "    background:linear-gradient(90deg,var(--accent),var(--accent2) 38%,transparent 92%); }",
    "",
    "  /* ── 設定内の小見出しラベル（大文字・トラッキング） ── */",
    "  .sec-label { font-size:.7rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase;",
    "    color:var(--accent); margin:.15rem 0 .45rem; }",
    "",
    "  /* ── タブ：下線式のアクティブ表示 ── */",
    "  .stTabs [data-baseweb=\"tab-list\"] { gap:1.5rem; border-bottom:1px solid var(--line); }",
    "  .stTabs [data-baseweb=\"tab\"] { padding:.5rem .15rem; font-weight:600; font-size:.95rem; }",
    "  .stTabs [aria-selected=\"true\"] { color:var(--accent); }",
    "  .stTabs [data-baseweb=\"tab-highlight\"] { background:var(--accent); height:2px; }",
    "",
    "  /* ── メトリクスを淡いカードに ── */",
    "  [data-testid=\"stMetric\"] { border:1px solid var(--line); border-radius:12px;",
    "    padding:.7rem 1rem; background:rgba(13,148,136,.035); }",
    "  [data-testid=\"stMetricValue\"] { color:var(--accent); font-weight:700; }",
    "",
    "  /* ── expander / popover は角丸・細枠 ── */",
    "  [data-testid=\"stExpander\"] { border-radius:12px; border:1px solid var(--line); }",
    "  [data-testid=\"stExpander\"] summary { font-weight:600; }",
    "",
    "  /* ── テーブルのヘッダ強調 ── */",
    "  [data-testid=\"stTable\"] thead th { background:rgba(13,148,136,.07); font-weight:700; }",
    "",
    "  /* ── ボタン角丸 ── */",
    "  .stButton button, .stDownloadButton button { border-radius:10px; font-weight:600; }",
    "",
    "  /* ── 見出しを引き締める ── */",
    "  h2, h3 { margin-top:.3rem; font-weight:650; letter-spacing:-.006em; }",
    "\u003c/style>",
    "\"\"\", unsafe_allow_html=True)",
    "",
    "st.markdown(\"\"\"",
    "\u003cdiv class=\"app-header\">",
    "  \u003ch1>HPLC デザインスペース最適化\u003c/h1>",
    "  \u003cp>実験計画（CCD / BBD） → メカニズム・二次回帰フィット → デザインスペース → ロバストな最適条件\u003c/p>",
    "  \u003cdiv class=\"rule\">\u003c/div>",
    "\u003c/div>",
    "\"\"\", unsafe_allow_html=True)",
    "",
    "model, design, fit, opt, ds, quad = load_modules(_scripts_signature())",
    "cfg, cfg_name = load_config()",
    "if cfg is None:",
    "    st.error(\"config.yaml / config.example.yaml が見つかりません。\")",
    "    st.stop()",
    "",
    "# ── 設定の構成 ──",
    "# 共通設定ボックスは廃止。各設定は「実際に必要になるタブ」で入力する:",
    "#   ① 計画  … 因子範囲・ピーク数・実験計画（まだデータが無いので手入力するしかない）",
    "#   ② 解析  … カラム(→V_m)・合格条件・解析モデル。因子範囲とピーク構成は",
    "#             アップロードデータから自動判定（データがある＝範囲もピークも読める）",
    "#   ③ D最適 … 追加点数。①の計画（範囲・ピーク）と②の V_m・合格条件を引き継ぐ",
    "# Streamlit は全タブを毎回描画し ①→②→③→デモ の順に実行するので、後段タブが参照する",
    "# グローバル（①の factors/peaks、②の Vm/criteria/model）は前段タブで確定済みになる。",
    "fc = cfg[\"factors\"]",
    "ac = cfg[\"acceptance_criteria\"]",
    "colu = cfg[\"column\"]",
    "TARGET = \"TP\"",
    "WATERS_ID = [1.0, 2.1, 3.0]            # Waters ACQUITY BEH でよくある内径 [mm]",
    "WATERS_LEN = [30, 50, 75, 100, 150]    # よくある長さ [mm]",
    "# 実験計画タイプ → (kind, alpha)。BBD は α 不使用。",
    "DESIGN_OPTIONS = {",
    "    \"Box-Behnken (BBD) — 角も軸点もなし／全点が範囲内\": (\"bbd\", 1.0),",
    "    \"面心 CCD (α=1.0) — 頂点＋軸点が範囲の面上\": (\"ccd\", 1.0),",
    "    \"回転可能 CCD (α≈1.682) — 予測精度が均一・軸点は範囲外\": (\"ccd\", (2 ** 3) ** 0.25),",
    "}",
    "grid_n = 51                            # デザインスペース格子の解像度（固定）",
    "",
    "",
    "def section_label(text):",
    "    \"\"\"設定内の小見出し（大文字・トラッキングのアクセントラベル）。\"\"\"",
    "    st.markdown(f\"\u003cdiv class='sec-label'>{text}\u003c/div>\", unsafe_allow_html=True)",
    "",
    "",
    "def basic_factor_inputs():",
    "    \"\"\"因子範囲・ピーク構成の入力（共通設定の「分離対象」で呼ぶ）。グローバルに値を設定する。\"\"\"",
    "    global factors, INTERFERING, ALL_PEAKS, RESPONSE_COLS, REQUIRED_COLS",
    "    st.caption(\"因子範囲（T・φ・F の下限／上限）\")",
    "    sc = st.columns(3)",
    "    T_lo = sc[0].number_input(\"T 下限 [℃]\", value=float(fc[\"T\"][\"low\"]))",
    "    T_hi = sc[0].number_input(\"T 上限 [℃]\", value=float(fc[\"T\"][\"high\"]))",
    "    P_lo = sc[1].number_input(\"φ 下限\", value=float(fc[\"phi\"][\"low\"]), format=\"%.3f\")",
    "    P_hi = sc[1].number_input(\"φ 上限\", value=float(fc[\"phi\"][\"high\"]), format=\"%.3f\")",
    "    F_lo = sc[2].number_input(\"F 下限 [mL/min]\", value=float(fc[\"F\"][\"low\"]), format=\"%.2f\")",
    "    F_hi = sc[2].number_input(\"F 上限 [mL/min]\", value=float(fc[\"F\"][\"high\"]), format=\"%.2f\")",
    "    factors = {",
    "        \"T\":   {\"low\": T_lo, \"center\": (T_lo + T_hi) / 2, \"high\": T_hi},",
    "        \"phi\": {\"low\": P_lo, \"center\": (P_lo + P_hi) / 2, \"high\": P_hi},",
    "        \"F\":   {\"low\": F_lo, \"center\": (F_lo + F_hi) / 2, \"high\": F_hi},",
    "    }",
    "    n_ip = int(st.number_input(\"夾雑ピークの数（目的ピークの前後）\", 1, 8, 1, step=1,",
    "                               help=\"目的ピーク TP に対し、邪魔なピークを何本入れるか。既定1。\"))",
    "    INTERFERING = [f\"IP{i}\" for i in range(1, n_ip + 1)]",
    "    ALL_PEAKS = [TARGET] + INTERFERING",
    "    RESPONSE_COLS = [f\"tR_{p}\" for p in ALL_PEAKS] + [f\"Wh_{p}\" for p in ALL_PEAKS]",
    "    REQUIRED_COLS = [\"T\", \"phi\", \"F\", \"day\"] + RESPONSE_COLS",
    "    st.caption(f\"ピーク: {TARGET}（目的）＋ {', '.join(INTERFERING)}\")",
    "",
    "",
    "def ccd_design_inputs():",
    "    \"\"\"実験計画タイプ（BBD / 面心CCD / 回転CCD）と中心点数の入力（①計画タブで呼ぶ）。\"\"\"",
    "    global n_center, alpha_ccd, design_kind",
    "    c = st.columns(2)",
    "    n_center = c[0].slider(\"中心点の数\", 3, 8, 6)",
    "    label = c[1].radio(\"実験計画のタイプ\", list(DESIGN_OPTIONS.keys()), index=1)",
    "    design_kind, alpha_ccd = DESIGN_OPTIONS[label]",
    "    if design_kind == \"bbd\":",
    "        c[1].caption(\"Box-Behnken: 各因子ペアの辺中点 12 点 ＋ 中心点\")",
    "    else:",
    "        c[1].caption(f\"CCD: 頂点8 ＋ 軸上点6 ＋ 中心点（α = {alpha_ccd:.4f}）\")",
    "",
    "",
    "def column_inputs():",
    "    \"\"\"カラム寸法 → V_m の入力（共通設定の「カラム」で呼ぶ）。\"\"\"",
    "    global Vm, L_mm",
    "    cc = st.columns(3)",
    "    id_default = float(colu.get(\"id_mm\", 2.1))",
    "    len_default = int(colu.get(\"length_mm\", 100))",
    "    id_mm = cc[0].selectbox(\"内径 [mm]\", WATERS_ID,",
    "                            index=WATERS_ID.index(id_default) if id_default in WATERS_ID else 1)",
    "    L_mm = float(cc[1].selectbox(\"長さ [mm]\", WATERS_LEN,",
    "                                 index=WATERS_LEN.index(len_default) if len_default in WATERS_LEN else 3))",
    "    porosity = cc[2].number_input(\"空隙率\", value=float(colu.get(\"porosity\", 0.66)), format=\"%.2f\")",
    "    Vm_geo = porosity * np.pi * (id_mm / 2.0) ** 2 * L_mm / 1000.0",
    "    st.caption(f\"幾何推算 V_m = {Vm_geo:.3f} mL（{id_mm}×{int(L_mm)} mm, 空隙率{porosity}）\")",
    "    if st.checkbox(\"V_m を手入力で上書き（ウラシル実測値など）\"):",
    "        Vm = st.number_input(\"V_m [mL]\", value=round(Vm_geo, 3), format=\"%.3f\")",
    "    else:",
    "        Vm = Vm_geo",
    "",
    "",
    "def criteria_inputs():",
    "    \"\"\"合格条件（Rs_min・t_R(TP) 上限）の入力（共通設定の「合格条件」で呼ぶ）。\"\"\"",
    "    global criteria",
    "    ac_cols = st.columns(2)",
    "    criteria = {",
    "        \"Rs_min\": ac_cols[0].number_input(\"Rs_min ≥\", value=float(ac[\"Rs_min\"]), format=\"%.1f\"),",
    "        \"tR_TP_max\": ac_cols[1].number_input(\"t_R(TP) ≤ [分]\", value=float(ac[\"tR_TP_max\"]), format=\"%.1f\"),",
    "        # 最遅ピークの上限はデータ取り段階の洗浄前制約であり、デザインスペースの合否には含めない",
    "        \"tR_last_max\": None,",
    "    }",
    "",
    "",
    "def augment_inputs():",
    "    \"\"\"D最適の点数・橋渡し中心点の入力。\"\"\"",
    "    global n_augment, n_bridge",
    "    c = st.columns(2)",
    "    n_augment = c[0].slider(\"D最適 追加点の数\", 0, 16, 8)",
    "    n_bridge = c[1].slider(\"Day2 橋渡し中心点\", 0, 5, 3)",
    "",
    "",
    "# 解析モデルの選択肢 → (予測モジュール, フィットモジュール, タグ)",
    "MODEL_OPTIONS = {",
    "    \"メカニズム（推奨・少数データに強い）\": (\"mech\",),",
    "    \"二次回帰（フル2次の応答曲面）\": (\"quad\",),",
    "}",
    "",
    "",
    "def model_inputs():",
    "    \"\"\"解析モデル（メカニズム / 二次回帰）の選択。active_model / active_fit を確定。\"\"\"",
    "    global active_model, active_fit, model_type",
    "    label = st.radio(\"解析モデル\", list(MODEL_OPTIONS.keys()), index=0, horizontal=True,",
    "                     help=\"メカニズム=クロマトの物理式（少数データ・外挿に強い）。\"",
    "                          \"二次回帰=(T,φ,F)のフル2次（点数が十分なら有効、少数だと過学習）。\")",
    "    model_type = MODEL_OPTIONS[label][0]",
    "    if model_type == \"quad\":",
    "        active_model, active_fit = quad, quad",
    "    else:",
    "        active_model, active_fit = model, fit",
    "    with st.popover(\"モデルの数式を表示\"):",
    "        if model_type == \"quad\":",
    "            st.markdown(\"**二次回帰（応答曲面）モデル** — t_R・W_h を各ピークごとに (T, φ, F) のフル2次で直接フィット\")",
    "            st.latex(r\"y = \\beta_0 + \\beta_1 T + \\beta_2 \\varphi + \\beta_3 F\"",
    "                     r\" + \\beta_4 T^2 + \\beta_5 \\varphi^2 + \\beta_6 F^2\"",
    "                     r\" + \\beta_7 T\\varphi + \\beta_8 TF + \\beta_9 \\varphi F\")",
    "            st.caption(\"y は t_R または W_h。分離度 Rs は予測した t_R・W_h から計算。\")",
    "        else:",
    "            st.markdown(\"**メカニズムモデル**（クロマトの物理式）\")",
    "            st.markdown(\"保持係数 k（ファントホッフ × LSS）:\")",
    "            st.latex(r\"\\ln k = a + \\frac{b}{T_K} + c\\,\\varphi + d\\,\\varphi^2\"",
    "                     r\" + e\\,\\frac{\\varphi}{T_K} + \\delta\\,\\mathrm{day}\")",
    "            st.markdown(\"保持時間:\")",
    "            st.latex(r\"t_R = \\frac{V_m}{F}\\,(1 + k)\")",
    "            st.markdown(\"ピーク幅（保持時間比例。N ほぼ一定 → W_h ∝ t_R）:\")",
    "            st.latex(r\"W_h = w_{c0} + w_{c1}\\,t_R,\\qquad W_b = \\tfrac{4}{\\sqrt{8\\ln 2}}\\,W_h\")",
    "        st.markdown(\"分離度（クロスオーバー対応・化合物同一性で固定）:\")",
    "        st.latex(r\"R_s = \\frac{2\\,|t_R^{\\mathrm{TP}} - t_R^{\\mathrm{IP}}|}{W_b^{\\mathrm{TP}} + W_b^{\\mathrm{IP}}},\"",
    "                 r\"\\qquad \\text{目標}\\ \\min_{\\mathrm{IP}} R_s \\ge 2.0\")",
    "        st.caption(\"T_K=T+273.15[K]、φ=ACN分率、u=L·F/V_m。記号の詳細は references/理論構築の流れ.md。\")",
    "",
    "",
    "def run_fit_and_designspace(df, factors, all_peaks, interfering, Vm, L_mm, header_prefix=\"\"):",
    "    \"\"\"共通処理: フィット → 診断表示 → 最適化 → 推奨条件 → 3D → DL。",
    "    因子範囲・ピーク構成・V_m は呼び出し側が渡す（②はアップロードデータから自動判定、",
    "    デモはデモデータから）。解析モデル・合格条件はグローバル（②タブで確定）を参照する。\"\"\"",
    "    ALL_PEAKS = all_peaks            # 以降の本体は ALL_PEAKS / INTERFERING の名前で参照する",
    "    INTERFERING = interfering",
    "    peaks_hat, diag = active_fit.fit_all(df, Vm, L_mm, peak_names=ALL_PEAKS)",
    "",
    "    _mdl_name = \"二次回帰\" if model_type == \"quad\" else \"メカニズム\"",
    "    st.caption(f\"解析モデル: **{_mdl_name}**\")",
    "    if model_type == \"quad\":",
    "        min_n = min(diag[nm].get(\"n\", 0) for nm in ALL_PEAKS)",
    "        if min_n \u003c 15:",
    "            st.warning(f\"⚠ 二次回帰は1応答あたり10パラメータ。最小点数 n={min_n} では過学習しやすく\"",
    "                       \"外挿が不安定です（LOO検証で確認済み）。少数データではメカニズムを推奨します。\")",
    "",
    "    st.subheader(f\"{header_prefix}モデルフィット\")",
    "",
    "    def _lof_p(lof):",
    "        return \"—\" if not lof else round(lof[\"p\"], 3)",
    "",
    "    def _r2_triple(r2, adj, q2):",
    "        f = lambda v: \"—\" if v is None else f\"{v:.3f}\"",
    "        return f\"{r2:.3f} / {f(adj)} / {f(q2)}\"",
    "",
    "    rows = []",
    "    lof_flag = False",
    "    for nm in ALL_PEAKS:",
    "        d = diag[nm]",
    "        lr, lw = d.get(\"LOF_retention\"), d.get(\"LOF_width\")",
    "        if (lr and lr[\"p\"] \u003c 0.05) or (lw and lw[\"p\"] \u003c 0.05):",
    "            lof_flag = True",
    "        rows.append({",
    "            \"ピーク\": nm + (\"（目的）\" if nm == TARGET else \"\"),",
    "            \"n\": d.get(\"n\", \"\"),",
    "            \"保持 R²/adj/Q²\": _r2_triple(d[\"R2_retention\"], d.get(\"adjR2_retention\"),",
    "                                         d.get(\"Q2_retention\")),",
    "            \"RMSE(t_R)秒\": round(d[\"RMSE_tR_min\"] * 60, 2),",
    "            \"LOF p(保持)\": _lof_p(lr),",
    "            \"幅 R²/adj/Q²\": _r2_triple(d[\"R2_width\"], d.get(\"adjR2_width\"), d.get(\"Q2_width\")),",
    "            \"RMSE(W_h)秒\": round(d[\"RMSE_Wh_min\"] * 60, 2),",
    "            \"LOF p(幅)\": _lof_p(lw),",
    "        })",
    "    st.table(pd.DataFrame(rows))",
    "    st.caption(\"**R²/adj/Q²** = 当てはまり / 自由度調整済み R² / 予測 R²（Q²=LOO交差検証）。\"",
    "               \"n=使った点数（欠損除外）。RMSE=予測の平均的ズレ。\"",
    "               \"**Q² が R² に近いほど過学習が小さく予測力が高い**（Q²≪R² は過学習のサイン）。\"",
    "               \"**LOF p**=lack-of-fit 検定（中心点の純誤差と比較。p>0.05 で当てはまり不足の証拠なし）。「—」は算出不能。\")",
    "    if lof_flag:",
    "        st.warning(\"⚠ 一部で LOF p\u003c0.05（当てはまり不足の兆候）。ただし中心点の純誤差が極めて小さいと\"",
    "                   \"検定が過敏になり、実用上は無視できる系統ズレでも有意になり得ます。\"",
    "                   \"RMSE の実寸（秒）や Q² が許容範囲かも併せて判断してください。\")",
    "",
    "    with st.expander(\"係数の p 値（各項が有意か・p\u003c0.05 で有意）\"):",
    "        def _pv_table(key):",
    "            rows = []",
    "            for nm in ALL_PEAKS:",
    "                r = {\"ピーク\": nm + (\"（目的）\" if nm == TARGET else \"\")}",
    "                r.update({k: (\"—\" if not np.isfinite(v) else round(v, 3))",
    "                          for k, v in diag[nm].get(key, {}).items()})",
    "                rows.append(r)",
    "            return pd.DataFrame(rows)",
    "        st.markdown(\"**保持モデル 係数 p 値**\")",
    "        st.table(_pv_table(\"ret_pvalues\"))",
    "        st.markdown(\"**幅モデル 係数 p 値**\")",
    "        st.table(_pv_table(\"wid_pvalues\"))",
    "        st.caption(\"p\u003c0.05 でその項が統計的に有意。ただし**保持モデルは実験範囲が狭く多重共線**のため、\"",
    "                   \"個別係数の p 値・符号は不安定になりやすく深読み非推奨（予測精度＝RMSE/Q² で評価するのが妥当）。\"",
    "                   \"二次回帰では交差項の有意性の目安になる。\")",
    "",
    "    st.subheader(f\"{header_prefix}デザインスペースと推奨条件\")",
    "",
    "    # ── 計算範囲（内挿 / 外挿）と最適化基準を 3D の手前で選ぶ ──",
    "    oc1, oc2 = st.columns(2)",
    "    range_mode = oc1.radio(",
    "        \"計算範囲\", [\"検証範囲内（内挿）\", \"外挿あり（範囲外も予測）\"],",
    "        key=header_prefix + \"rangemode\",",
    "        help=\"外挿は因子範囲の外まで雲・グラフを広げます（検証外の予測）。推奨条件は安全のため検証済み範囲内からのみ選びます。\")",
    "    if range_mode.startswith(\"外挿\"):",
    "        extrapolate = oc1.slider(\"外挿の広さ（範囲幅に対する割合）\", 0.0, 0.5, 0.1, step=0.05,",
    "                                 key=header_prefix + \"ext\")",
    "        restrict_range = False           # 外挿域も推奨候補に含める",
    "        oc1.caption(\"⚠ 外挿域から推奨点を選びます（検証外の予測のため、採用時は追加検証を推奨）。\")",
    "    else:",
    "        extrapolate = 0.0",
    "        restrict_range = True",
    "",
    "    MODE_LABELS = {",
    "        \"最も頑健（不合格領域から最も遠い）\": \"robust\",",
    "        \"変動範囲全域が合格で t_R(TP) 最速\": \"fastest_tR\",",
    "        \"変動範囲全域が合格で ACN 消費量が最小\": \"min_acn\",",
    "    }",
    "    mode_label = oc2.radio(\"最適化の基準\", list(MODE_LABELS.keys()),",
    "                           key=header_prefix + \"optmode\")",
    "    opt_mode = MODE_LABELS[mode_label]",
    "    delta = None",
    "    if opt_mode in (\"fastest_tR\", \"min_acn\"):",
    "        oc2.caption(\"各因子が運用中にブレうる半幅（±）を設定。その箱の全域が合格な点だけを候補にします。\")",
    "        dc = oc2.columns(3)",
    "        delta = {",
    "            \"T\": float(dc[0].number_input(\"±T [℃]\", value=1.0, min_value=0.0, step=0.5,",
    "                                          key=header_prefix + \"dT\")),",
    "            \"phi\": float(dc[1].number_input(\"±φ [分率]\", value=0.01, min_value=0.0, step=0.005,",
    "                                            format=\"%.3f\", key=header_prefix + \"dphi\")),",
    "            \"F\": float(dc[2].number_input(\"±F [mL/min]\", value=0.02, min_value=0.0, step=0.01,",
    "                                          format=\"%.2f\", key=header_prefix + \"dF\")),",
    "        }",
    "",
    "    grid, rec = opt.optimize(active_model, peaks_hat, factors, Vm, L_mm, criteria, n=grid_n,",
    "                             extrapolate=extrapolate, target=TARGET, interfering=INTERFERING,",
    "                             mode=opt_mode, delta=delta, restrict_range=restrict_range)",
    "    n_pass, n_total = int(grid[\"pass_mask\"].sum()), grid[\"pass_mask\"].size",
    "    c1, c2 = st.columns(2)",
    "    c1.metric(\"合格領域の広さ\", f\"{n_pass} / {n_total} 点\", f\"{100*n_pass/n_total:.1f}%\")",
    "    if rec is None:",
    "        if opt_mode == \"robust\":",
    "            c2.error(\"合格領域なし。因子範囲か合格条件を見直してください。\")",
    "        else:",
    "            c2.error(\"変動範囲の箱が全域合格となる点がありません。±の幅を小さくするか合格条件を見直してください。\")",
    "        return",
    "    s = active_model.separation(peaks_hat, rec[\"T\"], rec[\"phi\"], rec[\"F\"], Vm, L_mm,",
    "                                target=TARGET, interfering=INTERFERING)",
    "    last = float(max(s[nm][\"tR\"] for nm in ALL_PEAKS))",
    "    # 推奨点での Rs の推定精度（フィット係数の共分散から誤差伝搬・モンテカルロ）",
    "    rsci = opt.rs_confidence(active_model, peaks_hat, diag, rec[\"T\"], rec[\"phi\"], rec[\"F\"],",
    "                             Vm, L_mm, target=TARGET, interfering=INTERFERING, n_samples=600)",
    "    # 基準ごとの補足（目的関数の達成値）",
    "    if opt_mode == \"robust\":",
    "        obj_line = f\"- 余裕（正規化距離）= {rec['margin']:.3f}\\n\"",
    "    elif opt_mode == \"fastest_tR\":",
    "        obj_line = f\"- 変動範囲全域が合格、t_R(TP) 最速 = {rec['objective']:.2f} 分\\n\"",
    "    else:",
    "        obj_line = f\"- 変動範囲全域が合格、ACN 消費量最小 = {rec['objective']:.3f} mL\\n\"",
    "    c2.success(",
    "        f\"**推奨条件（{mode_label}）**\\n\\n\"",
    "        f\"- T = {rec['T']:.1f} ℃\\n- φ = {rec['phi']:.3f}（ACN 分率）\\n\"",
    "        f\"- F = {rec['F']:.2f} mL/min\\n\"",
    "        f\"{obj_line}\\n\"",
    "        f\"→ Rs_min={float(s['Rs_min']):.2f} \"",
    "        f\"（95%CI {rsci['lo']:.2f}–{rsci['hi']:.2f}, ±{rsci['sd']:.2f}） \"",
    "        f\"/ t_R(TP)={float(s[TARGET]['tR']):.2f}分 / 最遅={last:.2f}分\"",
    "    )",
    "    if rsci[\"lo\"] \u003c float(criteria[\"Rs_min\"]):",
    "        c2.caption(\"⚠ Rs の95%信頼区間の下限が合格基準を下回ります（フィットの不確かさを考えると\"",
    "                   \"ギリギリ）。余裕のある条件か、データ追加（③D最適）での精度向上を検討してください。\")",
    "",
    "    st.subheader(f\"{header_prefix}3D デザインスペース\")",
    "    cloud_style = \"volume\"",
    "    cc2, cc3 = st.columns(2)",
    "    side_map = {\"自動\": \"auto\", \"手前\": \"low\", \"奥\": \"high\"}",
    "    side_lr = side_map[cc2.radio(\"T壁・φ壁（手前/奥）\", [\"自動\", \"手前\", \"奥\"],",
    "                                 key=header_prefix + \"wall_lr\")]",
    "    floor_map = {\"自動\": \"auto\", \"床\": \"low\", \"天井\": \"high\"}",
    "    side_fc = floor_map[cc3.radio(\"F壁（床/天井）\", [\"自動\", \"床\", \"天井\"],",
    "                                  key=header_prefix + \"wall_fc\")]",
    "    wall_side = {\"T\": side_lr, \"phi\": side_lr, \"F\": side_fc}",
    "    rc1, rc2 = st.columns(2)",
    "    surface_count = rc1.slider(\"雲の密度（層の数・大=濃く滑らか）\", 5, 40, 30, step=1,",
    "                               key=header_prefix + \"scount\")",
    "    rot_speed = rc2.select_slider(\"自動回転の速さ\", options=[\"遅い\", \"標準\", \"速い\"],",
    "                                  value=\"標準\", key=header_prefix + \"rot\")",
    "    rot_dur = {\"遅い\": 140, \"標準\": 80, \"速い\": 40}[rot_speed]",
    "    # 変動範囲を設定する基準（t_R最速 / ACN最小）のときは推奨点に ±δ の箱を重ねる",
    "    robust_box = None",
    "    if delta is not None and rec is not None:",
    "        robust_box = {\"center\": (rec[\"T\"], rec[\"phi\"], rec[\"F\"]), \"delta\": delta}",
    "    fig = ds.plot_designspace_3d(grid, rec, model_mod=active_model, peaks=peaks_hat,",
    "                                 factors=factors, Vm=Vm, L_mm=L_mm,",
    "                                 cloud_style=cloud_style, wall_side=wall_side,",
    "                                 surface_count=surface_count, rotate_duration_ms=rot_dur,",
    "                                 robust_box=robust_box)",
    "    st.plotly_chart(fig, use_container_width=True)",
    "    _box_note = (\"、破線の箱＝設定した変動範囲（この箱全域が合格になる推奨点）\" if robust_box else \"\")",
    "    st.caption(\"雲＝合格領域（Viridis: 紫=ギリギリ→黄=余裕大）、壁の線＝デザインスペース内のRs等高線5本\"",
    "               f\"（太黒線が Rs=2.0 の合格境界）、黒ドット＝推奨条件{_box_note}。左下の「▶ 自動回転」で回転。\")",
    "",
    "    rec_df = pd.DataFrame([{",
    "        \"T_degC\": rec[\"T\"], \"phi_ACN\": rec[\"phi\"], \"F_mL_min\": rec[\"F\"],",
    "        \"criterion\": mode_label,",
    "        \"margin_normalized\": rec.get(\"margin\", \"\"),",
    "        \"objective\": rec.get(\"objective\", \"\"),",
    "        \"Rs_min\": float(s[\"Rs_min\"]),",
    "        \"Rs_min_CI_lo\": rsci[\"lo\"], \"Rs_min_CI_hi\": rsci[\"hi\"], \"Rs_min_sd\": rsci[\"sd\"],",
    "        \"tR_TP_min\": float(s[TARGET][\"tR\"]), \"tR_last_min\": last,",
    "    }])",
    "    dc1, dc2 = st.columns(2)",
    "    dc1.download_button(\"推奨条件 CSV をDL\", rec_df.to_csv(index=False).encode(\"utf-8-sig\"),",
    "                        file_name=\"recommended_condition.csv\", mime=\"text/csv\",",
    "                        key=header_prefix + \"reccsv\")",
    "    dc2.download_button(\"3D グラフ HTML をDL\",",
    "                        fig.to_html(include_plotlyjs=\"cdn\", full_html=True).encode(\"utf-8\"),",
    "                        file_name=\"designspace_3d.html\", mime=\"text/html\",",
    "                        key=header_prefix + \"html\")",
    "",
    "    # 回転 GIF（kaleido＋Chrome が必要・生成に時間がかかる）",
    "    # kaleido が無い環境（stlite＝ブラウザ内 Pyodide）ではこの節ごと出さない。",
    "    if HAS_KALEIDO:",
    "        with st.expander(\"回転アニメーションを GIF で書き出す\"):",
    "            gif_frames = st.slider(\"フレーム数（多いほど滑らか・遅い）\", 12, 48, 24, step=4,",
    "                                   key=header_prefix + \"gifn\")",
    "            if st.button(\"GIF を生成\", key=header_prefix + \"gifbtn\"):",
    "                with st.spinner(\"GIF 生成中…（フレーム数×数秒）\"):",
    "                    try:",
    "                        gif = ds.rotation_gif_bytes(fig, n_frames=gif_frames,",
    "                                                    duration_ms=rot_dur)",
    "                        st.image(gif, caption=\"回転プレビュー\")",
    "                        st.download_button(\"回転 GIF をDL\", gif,",
    "                                           file_name=\"designspace_rotation.gif\",",
    "                                           mime=\"image/gif\", key=header_prefix + \"gifdl\")",
    "                    except Exception as e:",
    "                        st.error(f\"GIF 生成に失敗しました（kaleido/Chrome が必要）: {e}\")",
    "",
    "",
    "# ──────────────────────────────",
    "# タブ構成（各タブが自分の設定を持つ）",
    "# ──────────────────────────────",
    "tab1, tab2, tab3, tab_demo = st.tabs(",
    "    [\"① 計画\", \"② 解析\", \"③ D最適（任意）\", \"デモ\"])",
    "",
    "# ── ① 計画（データが無い段階＝範囲・ピーク・計画は手入力）──",
    "with tab1:",
    "    s1, s2 = st.columns([1.15, 1])",
    "    with s1:",
    "        section_label(\"分離対象\")",
    "        basic_factor_inputs()",
    "    with s2:",
    "        section_label(\"実験計画\")",
    "        ccd_design_inputs()",
    "    st.divider()",
    "    _plan_desc = (\"Box-Behnken 計画（辺中点12＋中心点）\" if design_kind == \"bbd\"",

  "scripts/01_model.py": [
    "\"\"\"",
    "01_model.py — HPLC 数理モデル（保持・幅・分離度）",
    "",
    "このモジュールは「物理化学のメカニズムに基づく」中核ロジック。",
    "依存は numpy のみ（yaml も pandas も使わない）。",
    "→ 通常環境の import / Python in Excel のセル貼付 / Streamlit から呼ぶ、の3経路すべてで使える。",
    "",
    "記号の意味（全関数共通）:",
    "  T    : カラム温度 [℃]",
    "  phi  : 移動相の ACN 体積分率（0〜1、例 0.45 = 45% ACN）",
    "  F    : 流速 [mL/min]",
    "  Vm   : カラム死容量 [mL]（カラム内の移動相の体積）",
    "  L_mm : カラム長 [mm]",
    "  k    : 保持係数（ピークがどれだけ長く保持されるかの無次元量）",
    "  t_R  : 保持時間 [min]（ピークが出てくる時刻）",
    "  t_0  : ボイド時間 [min]（保持されない物質が出る時刻、t_0 = Vm/F）",
    "  N    : 理論段数（カラム効率。大きいほどピークが鋭い）",
    "  W_h  : 半値幅 [min]（ピーク高さ半分での幅）",
    "  W_b  : ベースライン幅 [min]（= 4σ。分離度 Rs の式で使う）",
    "  day  : 実験日（ブロック因子。0=Day1, 1=Day2 …）",
    "",
    "1ピークのパラメータは dict で持つ:",
    "  retention（保持）: a, b, c, d, e, delta",
    "    ln k = a + b/T_K + c*phi + d*phi^2 + e*phi/T_K + delta*day   （T_K = T+273.15 [K]）",
    "      a     : 切片",
    "      b     : 温度項の係数（ファントホッフ。b>0 なら低温ほど高保持）[K]",
    "      c     : 溶媒1次項の係数（LSS/Snyder。c\u003c0 なら ACN 増で低保持）",
    "      d     : 溶媒2次項の係数（曲がりの補正。不要なら 0）",
    "      e     : 温度×溶媒の交互作用項（溶媒傾き S が温度で変わる効果。",
    "              ピークごとに違うとクロスオーバーが起きる。不要なら 0）",
    "      delta : 日間差（ブロック項。別日のオフセット）",
    "  width（幅・保持時間比例モデル）: wc0, wc1",
    "    W_h = wc0 + wc1 · t_R      （W_h=半値幅 [min], t_R=保持時間 [min]）",
    "      wc0 : 切片",
    "      wc1 : t_R への傾き",
    "    根拠: W_h = √(8ln2)·t_R/√N で、理論段数 N は条件でほぼ一定（実データ CV 5〜13%）なので",
    "    W_h は t_R にほぼ比例する。AICc 後退法でも「W_h の最良の説明変数は t_R」と支持された",
    "    （van Deemter の u 項・φ・T 項は F 範囲が狭く効果を検出できず削除される）。",
    "    ベースライン幅は W_b = (4/√(8ln2))·W_h ≈ 1.699·W_h（ガウス近似で W_h と一定比）。",
    "",
    "すべての関数は scalar でも numpy 配列でも動く（グリッド評価のためベクトル化対応）。",
    "\"\"\"",
    "",
    "import numpy as np",
    "",
    "KELVIN = 273.15          # ℃ → K の変換オフセット",
    "EIGHT_LN2 = 8.0 * np.log(2.0)   # = 5.545…（半値幅 ↔ 段数の換算定数）",
    "WB_OVER_WH = 4.0 / np.sqrt(EIGHT_LN2)   # W_b = 4t_R/√N, W_h=√(8ln2)t_R/√N → W_b ≈ 1.699·W_h",
    "",
    "",
    "# ──────────────────────────────",
    "# 保持（retention）",
    "# ──────────────────────────────",
    "def retention_factor(T, phi, a, b, c, d=0.0, e=0.0, day=0, delta=0.0):",
    "    \"\"\"保持係数 k を返す。 ln k = a + b/T_K + c*phi + d*phi^2 + e*phi/T_K + delta*day\"\"\"",
    "    T_K = np.asarray(T, dtype=float) + KELVIN",
    "    phi_arr = np.asarray(phi, dtype=float)",
    "    ln_k = (a + b / T_K + c * phi_arr + d * phi_arr ** 2",
    "            + e * phi_arr / T_K + delta * day)",
    "    return np.exp(ln_k)",
    "",
    "",
    "def void_time(Vm, F):",
    "    \"\"\"ボイド時間 t_0 = Vm / F [min]。\"\"\"",
    "    return Vm / F",
    "",
    "",
    "def retention_time(T, phi, F, Vm, a, b, c, d=0.0, e=0.0, day=0, delta=0.0):",
    "    \"\"\"保持時間 t_R = (Vm/F)*(1+k) [min]。\"\"\"",
    "    k = retention_factor(T, phi, a, b, c, d, e, day, delta)",
    "    return (Vm / F) * (1.0 + k)",
    "",
    "",
    "# ──────────────────────────────",
    "# 幅・効率（band broadening）",
    "# ──────────────────────────────",
    "def linear_velocity(F, Vm, L_mm):",
    "    \"\"\"線速度 u = L/t_0 = L*F/Vm [mm/min]。\"\"\"",
    "    return L_mm * F / Vm",
    "",
    "",
    "def plate_count(T, phi, F, Vm, L_mm, A, B, C, D=0.0, E=0.0, G=0.0):",
    "    \"\"\"理論段数 N。拡張 van Deemter H = A + B/u + C*u + D*phi + E/T_K + G*phi^2、N = L/H。",
    "    D, E, G は既定 0（与えなければ従来の u のみ van Deemter と一致）。\"\"\"",
    "    u = linear_velocity(F, Vm, L_mm)",
    "    T_K = np.asarray(T, dtype=float) + KELVIN",
    "    phi_arr = np.asarray(phi, dtype=float)",
    "    H = A + B / u + C * u + D * phi_arr + E / T_K + G * phi_arr ** 2",
    "    return L_mm / H",
    "",
    "",
    "def width_half_height(t_R, N):",
    "    \"\"\"半値幅 W_h = sqrt(8 ln2) * t_R / sqrt(N)。逆に N = 5.54*(t_R/W_h)^2。\"\"\"",
    "    return np.sqrt(EIGHT_LN2) * t_R / np.sqrt(N)",
    "",
    "",
    "def width_baseline(t_R, N):",
    "    \"\"\"ベースライン幅 W_b = 4*t_R/sqrt(N)（= 4σ）。Rs の式で使う。\"\"\"",
    "    return 4.0 * t_R / np.sqrt(N)",
    "",
    "",
    "def plate_count_from_width(t_R, W_h):",
    "    \"\"\"実測の半値幅 W_h から理論段数 N を逆算: N = 8ln2*(t_R/W_h)^2 = 5.54*(t_R/W_h)^2。",
    "    03_fit で「実測幅 → N → van Deemter フィット」に使う（width_half_height の逆関数）。\"\"\"",
    "    return EIGHT_LN2 * (t_R / W_h) ** 2",
    "",
    "",
    "# ──────────────────────────────",
    "# 1ピックの予測をまとめる",
    "# ──────────────────────────────",
    "def predict_peak(peak, T, phi, F, Vm, L_mm, day=0):",
    "    \"\"\"1ピークの t_R, N, W_h, W_b を dict で返す。peak は上記パラメータの dict。",
    "    幅は保持時間比例モデル W_h = wc0 + wc1·t_R（N はほぼ一定という近似）。\"\"\"",
    "    tR = retention_time(",
    "        T, phi, F, Vm,",
    "        peak[\"a\"], peak[\"b\"], peak[\"c\"],",
    "        peak.get(\"d\", 0.0), peak.get(\"e\", 0.0), day, peak.get(\"delta\", 0.0),",
    "    )",
    "    Wh = np.maximum(peak[\"wc0\"] + peak[\"wc1\"] * tR, 1e-6)   # 外挿で負→微小正にクリップ",
    "    Wb = WB_OVER_WH * Wh",
    "    N = EIGHT_LN2 * (tR / Wh) ** 2                          # 参考（表示用）",
    "    return {\"tR\": tR, \"N\": N, \"Wh\": Wh, \"Wb\": Wb}",
    "",
    "",
    "# ──────────────────────────────",
    "# 分離度（resolution）— 化合物の同一性で定義（クロスオーバー対応）",
    "# ──────────────────────────────",
    "def resolution(tR_a, Wb_a, tR_b, Wb_b):",
    "    \"\"\"Rs = 2*|t_R(a) - t_R(b)| / (Wb_a + Wb_b)。絶対値なので溶出順が入れ替わっても正しい。\"\"\"",
    "    return 2.0 * np.abs(tR_a - tR_b) / (Wb_a + Wb_b)",
    "",
    "",
    "def separation(peaks, T, phi, F, Vm, L_mm, day=0, target=\"TP\", interfering=None):",
    "    \"\"\"",
    "    目的ピーク（target）と任意個の夾雑ピーク（interfering）の予測と Rs を返す。",
    "    各 Rs は化合物の同一性で固定（target と各 IP の間。絶対値でクロスオーバー対応）。",
    "    最適化目標は Rs_min = 全 IP に対する Rs の最小値。",
    "    interfering=None なら peaks のうち target 以外を全部使う。",
    "    戻り値: {target: 予測, 各IP名: 予測, 'Rs_each': {IP名:Rs}, 'Rs_min': ...,",
    "             （後方互換）該当すれば 'Rs1','Rs2' も付く}",
    "    \"\"\"",
    "    if interfering is None:",
    "        interfering = [k for k in peaks.keys() if k != target]",
    "    tp = predict_peak(peaks[target], T, phi, F, Vm, L_mm, day)",
    "    out = {target: tp}",
    "    rs_each = {}",
    "    rs_vals = []",
    "    for ip in interfering:",
    "        p = predict_peak(peaks[ip], T, phi, F, Vm, L_mm, day)",
    "        out[ip] = p",
    "        rs = resolution(tp[\"tR\"], tp[\"Wb\"], p[\"tR\"], p[\"Wb\"])",
    "        rs_each[ip] = rs",
    "        rs_vals.append(rs)",
    "    rs_min = rs_vals[0]",
    "    for r in rs_vals[1:]:",
    "        rs_min = np.minimum(rs_min, r)",
    "    out[\"Rs_each\"] = rs_each",
    "    out[\"Rs_min\"] = rs_min",
    "    if \"IP1\" in rs_each:",
    "        out[\"Rs1\"] = rs_each[\"IP1\"]",
    "    if \"IP2\" in rs_each:",
    "        out[\"Rs2\"] = rs_each[\"IP2\"]",
    "    return out",
    "",
    "",
    "# ──────────────────────────────",
    "# Rs 信頼区間用の係数サンプリング（04_optimize.rs_confidence から呼ばれる）",
    "# ──────────────────────────────",
    "def sample_peaks(peaks, diagnostics, rng, target, interfering):",
    "    \"\"\"フィット係数の共分散から、保持・幅の係数を1セット乱数で引いた peaks dict を作る。",
    "    保持と幅は別フィット（ほぼ独立）なのでそれぞれの cov から個別にサンプルする。",
    "    多重共線で cov が縮退していても、Rs は安定な係数結合で決まるため正しくばらつきが伝わる。\"\"\"",
    "    out = {}",
    "    for nm in [target] + list(interfering):",
    "        p = dict(peaks[nm])",
    "        d = diagnostics[nm]",
    "        for keys, cov in ((\"ret_keys\", \"ret_cov\"), (\"wid_keys\", \"wid_cov\")):",
    "            klist = d.get(keys)",
    "            C = d.get(cov)",
    "            if not klist or C is None:",
    "                continue",
    "            mean = np.array([peaks[nm][k] for k in klist], dtype=float)",
    "            draw = rng.multivariate_normal(mean, np.atleast_2d(C))",
    "            for k, v in zip(klist, draw):",
    "                p[k] = float(v)",
    "        out[nm] = p",
    "    return out",
    "",
    "",

    "# 例示用パラメータ（実フィット前の動作確認・デモ用のダミー）",

  "scripts/02_design.py": [
    "\"\"\"",
    "02_design.py — 実験計画の生成（CCD ＋ 日のブロッキング ＋ D最適 augment）",
    "",
    "依存は numpy / pandas のみ（01_model には依存しない。DoE の幾何だけ扱う）。",
    "",
    "設計（references/decisions.md 指摘5）:",
    "  Day1: CCD = 頂点 2³=8 + 軸上点 6 + 中心点 6 = 20 本",
    "  Day2: D最適 augment + 中心点3本（Day1↔Day2 の日間差を橋渡し）",
    "  別日のため day をブロック列として持つ（0=Day1, 1=Day2 …）",
    "",
    "座標系:",
    "  coded（符号化）… 各因子を -alpha〜+alpha に正規化した値。中心=0。",
    "    factorial（頂点）: 各因子 ±1",
    "    axial（軸上点）  : 1因子だけ ±alpha、他は 0",
    "    center（中心点）  : すべて 0",
    "  real（実値）   … 実際の T[℃] / phi[ACN分率] / F[mL/min]。",
    "",
    "alpha（軸上点の距離）:",
    "  既定 1.0 = 面心複合計画（CCF）。軸上点も頂点も low/high に乗るので、",
    "  温度上限・ACN沸点などの「超えてはいけない範囲」を守れる（今回の制約向き）。",
    "  回転可能性を優先するなら alpha=(2^3)^(1/4)=1.682。この場合、頂点(±1)が",
    "  low/high に乗り、軸上点(±alpha)はその外側へ伸びる（範囲を超えるので注意）。",
    "",
    "real への変換: real = center + coded * half_range,  half_range=(high-low)/2",
    "  → 頂点 factorial(±1) は center±half_range = low/high にちょうど乗る（標準的な規約）。",
    "  → 軸上点 axial(±alpha) は alpha=1 なら low/high、alpha>1 なら範囲の外側。",
    "\"\"\"",
    "",
    "import itertools",
    "",
    "import numpy as np",
    "import pandas as pd",
    "",
    "FACTOR_NAMES = [\"T\", \"phi\", \"F\"]",
    "# 実測で埋める応答列（テンプレートに空欄で用意する）",
    "RESPONSE_COLS = [\"tR_IP1\", \"tR_TP\", \"tR_IP2\", \"Wh_IP1\", \"Wh_TP\", \"Wh_IP2\"]",
    "",
    "",
    "# ──────────────────────────────",
    "# 符号化 ↔ 実値",
    "# ──────────────────────────────",
    "def coded_to_real(coded, low, center, high, alpha=None):",
    "    \"\"\"符号化値 coded を実値に変換。 real = center + coded*half_range。",
    "    頂点 ±1 が low/high に乗る標準規約（軸点 ±alpha は alpha>1 なら範囲外へ伸びる）。",
    "    alpha は受け取るが変換には使わない（呼び出し側の互換のため残す）。\"\"\"",
    "    half_range = (high - low) / 2.0",
    "    return center + np.asarray(coded, dtype=float) * half_range",
    "",
    "",
    "def _factor_specs(factors):",
    "    \"\"\"config の factors dict から (low, center, high) を取り出す。\"\"\"",
    "    return {f: (factors[f][\"low\"], factors[f][\"center\"], factors[f][\"high\"])",
    "            for f in FACTOR_NAMES}",
    "",
    "",
    "# ──────────────────────────────",
    "# CCD（Day1）",
    "# ──────────────────────────────",
    "def ccd_coded(n_center=6, alpha=1.0):",
    "    \"\"\"CCD の符号化計画を返す（type 列付き）。頂点8 + 軸上6 + 中心n。\"\"\"",
    "    rows = []",
    "    # 頂点（factorial）: ±1 の全組み合わせ 2³=8",
    "    for combo in itertools.product([-1.0, 1.0], repeat=3):",
    "        rows.append((\"factorial\", *combo))",
    "    # 軸上点（axial）: 1因子だけ ±alpha",
    "    for i in range(3):",
    "        for sign in (-alpha, alpha):",
    "            pt = [0.0, 0.0, 0.0]",
    "            pt[i] = sign",
    "            rows.append((\"axial\", *pt))",
    "    # 中心点（center）",
    "    for _ in range(n_center):",
    "        rows.append((\"center\", 0.0, 0.0, 0.0))",
    "    cols = [\"type\"] + [f\"c{f}\" for f in FACTOR_NAMES]",
    "    return pd.DataFrame(rows, columns=cols)",
    "",
    "",
    "def bbd_coded(n_center=6):",
    "    \"\"\"Box-Behnken 設計（3因子）の符号化計画を返す（type 列付き）。",
    "    各因子ペアの辺中点 2²×3=12 + 中心点 n。頂点(角)も軸上点(範囲外)も使わない。",
    "    → 全点が範囲内に収まり、角条件が物理的に無理な系（高温×高ACN など）に向く。\"\"\"",
    "    rows = []",
    "    for i, j in [(0, 1), (0, 2), (1, 2)]:        # 因子ペア（残り1因子は0）",
    "        for a in (-1.0, 1.0):",
    "            for b in (-1.0, 1.0):",
    "                pt = [0.0, 0.0, 0.0]",
    "                pt[i], pt[j] = a, b",
    "                rows.append((\"bbd\", *pt))",
    "    for _ in range(n_center):",
    "        rows.append((\"center\", 0.0, 0.0, 0.0))",
    "    cols = [\"type\"] + [f\"c{f}\" for f in FACTOR_NAMES]",
    "    return pd.DataFrame(rows, columns=cols)",
    "",
    "",
    "def design_coded(kind=\"ccd\", n_center=6, alpha=1.0):",
    "    \"\"\"計画タイプを選んで符号化計画を返す。kind=\"bbd\" なら Box-Behnken、それ以外は CCD。\"\"\"",
    "    if kind == \"bbd\":",
    "        return bbd_coded(n_center=n_center)",
    "    return ccd_coded(n_center=n_center, alpha=alpha)",
    "",
    "",
    "def ccd_design(factors, n_center=6, alpha=1.0, day=0, kind=\"ccd\"):",
    "    \"\"\"実験計画を実値つきの DataFrame で返す（Day1 用）。",
    "    kind=\"ccd\"（既定）で中心複合計画、kind=\"bbd\" で Box-Behnken。\"\"\"",
    "    coded = design_coded(kind=kind, n_center=n_center, alpha=alpha)",
    "    specs = _factor_specs(factors)",
    "    df = coded.copy()",
    "    for f in FACTOR_NAMES:",
    "        low, center, high = specs[f]",
    "        df[f] = coded_to_real(coded[f\"c{f}\"], low, center, high, alpha)",
    "    df.insert(0, \"day\", day)",
    "    return df",
    "",
    "",
    "def bridge_center(factors, n_bridge=3, day=1):",
    "    \"\"\"Day2 冒頭の橋渡し中心点（日間差の測定用）。\"\"\"",
    "    coded = pd.DataFrame(",
    "        [(\"center\", 0.0, 0.0, 0.0)] * n_bridge,",
    "        columns=[\"type\"] + [f\"c{f}\" for f in FACTOR_NAMES],",
    "    )",
    "    specs = _factor_specs(factors)",
    "    df = coded.copy()",
    "    for f in FACTOR_NAMES:",
    "        low, center, high = specs[f]",
    "        df[f] = coded_to_real(coded[f\"c{f}\"], low, center, high, alpha=1.0)",
    "    df.insert(0, \"day\", day)",
    "    df[\"type\"] = \"bridge_center\"",
    "    return df",
    "",
    "",
    "# ──────────────────────────────",
    "# D最適 augment（Day2）",
    "# ──────────────────────────────",
    "def second_order_model_matrix(coded_array):",
    "    \"\"\"符号化点 (n×3) → 2次応答曲面モデルの計画行列 X。",
    "    列: [1, x1, x2, x3, x1², x2², x3², x1x2, x1x3, x2x3]（10列）。\"\"\"",
    "    x = np.atleast_2d(np.asarray(coded_array, dtype=float))",
    "    x1, x2, x3 = x[:, 0], x[:, 1], x[:, 2]",
    "    ones = np.ones_like(x1)",
    "    return np.column_stack([",
    "        ones, x1, x2, x3,",
    "        x1 ** 2, x2 ** 2, x3 ** 2,",
    "        x1 * x2, x1 * x3, x2 * x3,",
    "    ])",
    "",
    "",
    "def d_optimal_augment(existing_coded, n_add, alpha=1.0, grid_levels=5, ridge=1e-6):",
    "    \"\"\"",
    "    既存計画 existing_coded（n×3 の符号化点）に、D最適基準で n_add 点を貪欲追加する。",
    "    候補は [-alpha, alpha]^3 の格子（grid_levels 段）。",
    "    各ステップで予測分散（レバレッジ x'·(X'X)^-1·x）最大の候補を選ぶ",
    "    ＝ det(X'X) を最も増やす点（行列式補題による貪欲 Fedorov）。",
    "    戻り値: 追加点の符号化座標 (n_add×3)。",
    "    \"\"\"",
    "    levels = np.linspace(-alpha, alpha, grid_levels)",
    "    candidates = np.array(list(itertools.product(levels, levels, levels)))",
    "",
    "    chosen = np.atleast_2d(np.asarray(existing_coded, dtype=float)).copy()",
    "    added = []",
    "    for _ in range(n_add):",
    "        X = second_order_model_matrix(chosen)",
    "        M = X.T @ X + ridge * np.eye(X.shape[1])   # ridge で初期の特異性を回避",
    "        Minv = np.linalg.inv(M)",
    "        Xc = second_order_model_matrix(candidates)",
    "        # 各候補のレバレッジ = diag(Xc · Minv · Xc^T)",
    "        leverage = np.einsum(\"ij,jk,ik->i\", Xc, Minv, Xc)",
    "        best = int(np.argmax(leverage))",
    "        pick = candidates[best]",
    "        added.append(pick)",
    "        chosen = np.vstack([chosen, pick])",
    "    return np.array(added)",
    "",
    "",
    "KELVIN = 273.15   # ℃ → K（01_model と同じ。モデル基準 D最適で 1/T_K を作るため）",
    "",
    "",
    "def mechanistic_model_matrix(T, phi, F, Vm, L_mm):",
    "    \"\"\"",
    "    メカニズムモデルの説明変数で計画行列 X を作る（実値ベース）。",
    "    保持: ln k = a + b/T_K + c·φ + d·φ² + e·φ/T_K  → 列 [1, 1/T_K, φ, φ², φ/T_K]",
    "    幅  : H = A + B/u + C·u（u=L·F/Vm）            → 列 [1/u, u]（切片は保持側と共有）",
    "    合わせて [1, 1/T_K, φ, φ², φ/T_K, 1/u, u] の7列。",
    "    ※ これらは係数について線形なので、X は係数の値に依存しない（フィット前でも作れる）。",
    "    \"\"\"",
    "    T = np.asarray(T, dtype=float)",
    "    phi = np.asarray(phi, dtype=float)",
    "    F = np.asarray(F, dtype=float)",
    "    T_K = T + KELVIN",
    "    u = L_mm * F / Vm",
    "    ones = np.ones_like(T_K)",
    "    return np.column_stack([",
    "        ones, 1.0 / T_K, phi, phi ** 2, phi / T_K,   # 保持モデルの説明変数",
    "        1.0 / u, u,                                   # 幅モデルの説明変数",
    "    ])",
    "",
    "",
    "def d_optimal_augment_model(existing_real, n_add, factors, Vm, L_mm,",
    "                            alpha=1.0, grid_levels=5, ridge=1e-9):",
    "    \"\"\"",
    "    メカニズムモデル基準の D最適 augment（実値）。",
    "    既存点 existing_real（列 T,phi,F）に、モデルの説明変数で det(X'X) を最大化する",
    "    点を貪欲に n_add 個追加する（各ステップでレバレッジ最大の候補を採用）。",
    "    候補は符号化格子 [-alpha,alpha]^3（grid_levels 段）を実値へ変換したもの。",
    "    戻り値: 追加点の実値 DataFrame（列 T,phi,F と符号化 cT,cphi,cF）。",
    "    レバレッジは列の線形変換に不変なので、説明変数のスケール差（1/T_K 対 u 等）は無害。",
    "    \"\"\"",
    "    specs = _factor_specs(factors)",
    "    levels = np.linspace(-alpha, alpha, grid_levels)",
    "    cand_coded = np.array(list(itertools.product(levels, levels, levels)))",
    "    cand_real = np.column_stack([",
    "        coded_to_real(cand_coded[:, i], *specs[f], alpha)",
    "        for i, f in enumerate(FACTOR_NAMES)",
    "    ])",
    "",
    "    chosen = np.atleast_2d(np.asarray(existing_real, dtype=float)).copy()",
    "    Xc = mechanistic_model_matrix(cand_real[:, 0], cand_real[:, 1], cand_real[:, 2], Vm, L_mm)",
    "    added_real, added_coded = [], []",
    "    for _ in range(n_add):",
    "        X = mechanistic_model_matrix(chosen[:, 0], chosen[:, 1], chosen[:, 2], Vm, L_mm)",
    "        M = X.T @ X + ridge * np.eye(X.shape[1])",
    "        Minv = np.linalg.inv(M)",
    "        leverage = np.einsum(\"ij,jk,ik->i\", Xc, Minv, Xc)",
    "        best = int(np.argmax(leverage))",
    "        added_real.append(cand_real[best])",
    "        added_coded.append(cand_coded[best])",
    "        chosen = np.vstack([chosen, cand_real[best]])",
    "",
    "    out = pd.DataFrame(added_real, columns=FACTOR_NAMES)",
    "    for i, f in enumerate(FACTOR_NAMES):",
    "        out[f\"c{f}\"] = [c[i] for c in added_coded]",
    "    return out",
    "",
    "",
    "# ──────────────────────────────",
    "# (B) Rs境界標的の局所D最適（フィット済みモデルのヤコビアンを使う）",
    "# ──────────────────────────────",
    "RET_KEYS = [\"a\", \"b\", \"c\", \"d\", \"e\"]   # 保持パラメータ",
    "WID_KEYS = [\"wc0\", \"wc1\"]   # 幅パラメータ（W_h = wc0 + wc1·t_R）",
    "PEAK_NAMES = [\"IP1\", \"TP\", \"IP2\"]",
    "",
    "",
    "def _rs_param_jacobian(model_mod, peaks, T, phi, F, Vm, L_mm, rel_eps=1e-4):",
    "    \"\"\"",
    "    各候補点での Rs_min のパラメータ偏微分（ヤコビアン）を数値微分で返す。",
    "    戻り値: (候補数 × パラメータ数) 行列。",
    "    パラメータは3ピーク×(a,b,c,d,e,A,B,C)を平坦化。Rs が非線形なので係数値に依存する。",
    "    \"\"\"",
    "    import copy",
    "    base = np.atleast_1d(model_mod.separation(peaks, T, phi, F, Vm, L_mm)[\"Rs_min\"]).astype(float)",
    "    cols = []",
    "    for pk in PEAK_NAMES:",
    "        for key in RET_KEYS + WID_KEYS:",
    "            val = peaks[pk].get(key, 0.0)",
    "            step = rel_eps * (abs(val) if val != 0 else 1.0)",
    "            p2 = copy.deepcopy(peaks)",
    "            p2[pk][key] = val + step",
    "            rs2 = np.atleast_1d(model_mod.separation(p2, T, phi, F, Vm, L_mm)[\"Rs_min\"]).astype(float)",
    "            cols.append((rs2 - base) / step)",
    "    return np.column_stack(cols)   # (ncand, nparams)",
    "",
    "",
    "def d_optimal_augment_rs(existing_real, n_add, factors, model_mod, peaks, Vm, L_mm,",
    "                         Rs_target=2.0, band=0.5, alpha=1.0, grid_levels=5, ridge=1e-9):",
    "    \"\"\"",
    "    Rs境界標的の局所D最適。フィット済み peaks の Rs ヤコビアンで det(JᵀWJ) を貪欲最大化。",
    "    境界 Rs≈Rs_target 近傍を重視するため、候補を w=exp(-((Rs-target)/band)²) で重み付ける。",
    "    → デザインスペース境界の予測精度を直接上げる点を選ぶ。peaks（Day1フィット結果）が必要。",
    "    \"\"\"",
    "    specs = _factor_specs(factors)",
    "    levels = np.linspace(-alpha, alpha, grid_levels)",
    "    cand_coded = np.array(list(itertools.product(levels, levels, levels)))",
    "    cand_real = np.column_stack([",
    "        coded_to_real(cand_coded[:, i], *specs[f], alpha)",
    "        for i, f in enumerate(FACTOR_NAMES)",
    "    ])",
    "    cT, cP, cF = cand_real[:, 0], cand_real[:, 1], cand_real[:, 2]",
    "",
    "    # 候補のヤコビアンと境界近傍の重み",
    "    Jc = _rs_param_jacobian(model_mod, peaks, cT, cP, cF, Vm, L_mm)",
    "    Rs_c = np.atleast_1d(model_mod.separation(peaks, cT, cP, cF, Vm, L_mm)[\"Rs_min\"])",
    "    w_c = np.exp(-((Rs_c - Rs_target) / band) ** 2)",
    "    Jw = Jc * w_c[:, None]",
    "",
    "    # 既存点の情報（同じく境界重みつき）で M を初期化",
    "    ex = np.atleast_2d(np.asarray(existing_real, dtype=float))",
    "    Je = _rs_param_jacobian(model_mod, peaks, ex[:, 0], ex[:, 1], ex[:, 2], Vm, L_mm)",
    "    Rs_e = np.atleast_1d(model_mod.separation(peaks, ex[:, 0], ex[:, 1], ex[:, 2], Vm, L_mm)[\"Rs_min\"])",
    "    we = np.exp(-((Rs_e - Rs_target) / band) ** 2)",
    "    Jew = Je * we[:, None]",
    "    M = Jew.T @ Jew + ridge * np.eye(Jw.shape[1])",
    "",
    "    added_real, added_coded = [], []",
    "    for _ in range(n_add):",
    "        Minv = np.linalg.inv(M)",
    "        leverage = np.einsum(\"ij,jk,ik->i\", Jw, Minv, Jw)   # 重み込みレバレッジ",
    "        best = int(np.argmax(leverage))",
    "        added_real.append(cand_real[best])",
    "        added_coded.append(cand_coded[best])",
    "        M = M + np.outer(Jw[best], Jw[best])                # 採用点で情報を更新",
    "    out = pd.DataFrame(added_real, columns=FACTOR_NAMES)",
    "    for i, f in enumerate(FACTOR_NAMES):",
    "        out[f\"c{f}\"] = [c[i] for c in added_coded]",
    "    return out",
    "",
    "",
    "def augment_design(factors, existing_df, n_add, alpha=1.0, day=1, method=\"model\",",
    "                   Vm=0.24, L_mm=100.0, model_mod=None, peaks=None,",
    "                   Rs_target=2.0, band=0.5):",
    "    \"\"\"",
    "    D最適 augment を実値つき DataFrame で返す（Day2 用、橋渡し中心点は別途）。",
    "    method=\"model\"   : (A) メカニズムモデル基準（係数精度・係数値に非依存）。Vm,L_mm が必要。",
    "    method=\"rs_local\": (B) Rs境界標的の局所D最適。model_mod と peaks（Day1フィット結果）が必要。",
    "    method=\"poly\"    : 符号化空間の2次多項式基準（従来）。",
    "    \"\"\"",
    "    if method == \"rs_local\":",
    "        if model_mod is None or peaks is None:",
    "            raise ValueError(\"method='rs_local' には model_mod と peaks（フィット結果）が必要です。\")",
    "        existing_real = existing_df[FACTOR_NAMES].to_numpy()",
    "        df = d_optimal_augment_rs(existing_real, n_add, factors, model_mod, peaks,",
    "                                  Vm, L_mm, Rs_target=Rs_target, band=band, alpha=alpha)",
    "        df.insert(0, \"type\", \"d_optimal_rs\")",
    "        df.insert(0, \"day\", day)",
    "        return df",
    "",
    "    if method == \"model\":",
    "        existing_real = existing_df[FACTOR_NAMES].to_numpy()",
    "        df = d_optimal_augment_model(existing_real, n_add, factors, Vm, L_mm, alpha=alpha)",
    "        df.insert(0, \"type\", \"d_optimal\")",
    "        df.insert(0, \"day\", day)",
    "        return df",
    "",
    "    existing_coded = existing_df[[f\"c{f}\" for f in FACTOR_NAMES]].to_numpy()",
    "    add_coded = d_optimal_augment(existing_coded, n_add, alpha=alpha)",
    "    df = pd.DataFrame(add_coded, columns=[f\"c{f}\" for f in FACTOR_NAMES])",
    "    df.insert(0, \"type\", \"d_optimal\")",
    "    specs = _factor_specs(factors)",
    "    for f in FACTOR_NAMES:",
    "        low, center, high = specs[f]",
    "        df[f] = coded_to_real(df[f\"c{f}\"], low, center, high, alpha)",
    "    df.insert(0, \"day\", day)",
    "    return df",
    "",
    "",
    "# ──────────────────────────────",
    "# 計画表の組み立て（テンプレート出力）",
    "# ──────────────────────────────",
    "def build_runs_template(factors, n_center=6, alpha=1.0,",
    "                        n_bridge=3, n_augment=0, method=\"model\",",
    "                        Vm=0.24, L_mm=100.0, kind=\"ccd\"):",
    "    \"\"\"Day1 計画（＋任意で Day2 橋渡し中心点・D最適）を1枚に結合し、応答列を空欄で付ける。",
    "    kind=\"ccd\"（既定）/ \"bbd\"。D最適の候補格子は範囲内に留めるため BBD では alpha=1.0 を使う。\"\"\"",
    "    aug_alpha = alpha if kind == \"ccd\" else 1.0",
    "    parts = [ccd_design(factors, n_center=n_center, alpha=alpha, day=0, kind=kind)]",
    "    if n_bridge > 0:",
    "        parts.append(bridge_center(factors, n_bridge=n_bridge, day=1))",
    "    if n_augment > 0:",
    "        parts.append(augment_design(factors, parts[0], n_augment, alpha=aug_alpha,",
    "                                     day=1, method=method, Vm=Vm, L_mm=L_mm))",
    "    df = pd.concat(parts, ignore_index=True)",
    "    df.insert(0, \"run\", np.arange(1, len(df) + 1))",
    "    for col in RESPONSE_COLS:",
    "        df[col] = np.nan          # 実測で埋める空欄",
    "    return df",
    "",

  "scripts/03_fit.py": [
    "\"\"\"",
    "03_fit.py — 実測データからモデルパラメータを推定",
    "",
    "依存: numpy / pandas / statsmodels。",
    "",
    "フィットの考え方（どちらもパラメータについて線形 → 普通の重回帰でOK）:",
    "",
    "  ◆ 保持（1ピークごと）",
    "    実測 t_R から保持係数へ:  k = t_R*F/Vm − 1   （t_0 = Vm/F より）",
    "    応答 y = ln k を次の回帰式に当てる（OLS）:",
    "      ln k = a + b·(1/T_K) + c·φ + d·φ² + e·(φ/T_K) + δ·day",
    "      → 説明変数は [1, 1/T_K, φ, φ², φ/T_K, day]、係数が a,b,c,d,e,δ",
    "",
    "  ◆ 幅（1ピークごと）",
    "    実測 W_h から段数へ:  N = 5.54·(t_R/W_h)²、 段高 H = L/N",
    "    線速度 u = L·F/Vm。次の van Deemter を当てる（OLS）:",
    "      H = A + B·(1/u) + C·u",
    "      → 説明変数は [1, 1/u, u]、係数が A,B,C",
    "",
    "出力は 01_model.py が使うパラメータ dict（peak ごとに a..e, delta, A,B,C）。",
    "\"\"\"",
    "",
    "import numpy as np",
    "import pandas as pd",
    "import statsmodels.api as sm",
    "",
    "KELVIN = 273.15                  # 01_model と同じ定数（貼付独立のため再掲）",
    "EIGHT_LN2 = 8.0 * np.log(2.0)",
    "",
    "PEAKS = [\"IP1\", \"TP\", \"IP2\"]",
    "",
    "",
    "# ──────────────────────────────",
    "# 実測 → 中間量",
    "# ──────────────────────────────",
    "def k_from_tR(tR, F, Vm):",
    "    \"\"\"保持係数 k = t_R/t_0 − 1 = t_R*F/Vm − 1。\"\"\"",
    "    return tR * F / Vm - 1.0",
    "",
    "",
    "def N_from_width(tR, Wh):",
    "    \"\"\"半値幅 → 理論段数 N = 5.54·(t_R/W_h)²。\"\"\"",
    "    return EIGHT_LN2 * (tR / Wh) ** 2",
    "",
    "",
    "def linear_velocity(F, Vm, L_mm):",
    "    \"\"\"線速度 u = L·F/Vm [mm/min]。\"\"\"",
    "    return L_mm * F / Vm",
    "",
    "",
    "# ──────────────────────────────",
    "# 保持フィット",
    "# ──────────────────────────────",
    "def fit_retention(df, peak, Vm, include_d=True, include_e=True, include_day=True):",
    "    \"\"\"1ピークの保持パラメータを OLS で推定。(params_dict, statsmodels結果) を返す。\"\"\"",
    "    tR = df[f\"tR_{peak}\"].to_numpy(dtype=float)",
    "    T = df[\"T\"].to_numpy(dtype=float)",
    "    phi = df[\"phi\"].to_numpy(dtype=float)",
    "    F = df[\"F\"].to_numpy(dtype=float)",
    "    day = df[\"day\"].to_numpy(dtype=float)",
    "",
    "    T_K = T + KELVIN",
    "    y = np.log(k_from_tR(tR, F, Vm))",
    "",
    "    cols = {\"a\": np.ones_like(T_K), \"b\": 1.0 / T_K, \"c\": phi}",
    "    if include_d:",
    "        cols[\"d\"] = phi ** 2",
    "    if include_e:",
    "        cols[\"e\"] = phi / T_K",
    "    if include_day:",
    "        cols[\"delta\"] = day",
    "    X = np.column_stack(list(cols.values()))",
    "    res = sm.OLS(y, X).fit()",
    "",
    "    fitted = dict(zip(cols.keys(), res.params))",
    "    params = {key: fitted.get(key, 0.0) for key in [\"a\", \"b\", \"c\", \"d\", \"e\", \"delta\"]}",
    "    return params, res",
    "",
    "",
    "# ──────────────────────────────",
    "# 幅フィット",
    "# ──────────────────────────────",
    "def fit_width(df, peak, Vm, L_mm):",
    "    \"\"\"1ピークの幅パラメータ (wc0, wc1) を OLS で推定。W_h = wc0 + wc1·t_R。",
    "    理論段数 N はほぼ一定→ W_h は t_R にほぼ比例（AICc 後退法でも t_R が最良説明変数と支持）。",
    "    Vm, L_mm は署名互換のため受け取るが本モデルでは未使用。\"\"\"",
    "    tR = df[f\"tR_{peak}\"].to_numpy(dtype=float)",
    "    Wh = df[f\"Wh_{peak}\"].to_numpy(dtype=float)",
    "    X = np.column_stack([np.ones_like(tR), tR])",
    "    res = sm.OLS(Wh, X).fit()",
    "    wc0, wc1 = res.params",
    "    return {\"wc0\": float(wc0), \"wc1\": float(wc1)}, res",
    "",
    "",
    "# ──────────────────────────────",
    "# 調整済み R² ／ Q²（予測 R²・LOO/PRESS ベース）",
    "# ──────────────────────────────",
    "def adj_r2(res):",
    "    \"\"\"自由度調整済み R²。パラメータ数に対する当てはまりの水増しを補正。",
    "    statsmodels の rsquared_adj をそのまま返す（サンプル/パラメータ不足なら nan → None）。\"\"\"",
    "    v = float(res.rsquared_adj)",
    "    return None if not np.isfinite(v) else v",
    "",
    "",
    "def q2_loo(res):",
    "    \"\"\"Q²（予測 R²）= 1 − PRESS/SS_total。OLS なら LOO 残差は e_i/(1−h_ii) で",
    "    再フィット不要に求まる（h_ii=ハット行列の対角=レバレッジ）。",
    "    Q² が R² に近いほど過学習が小さく予測力が高い。h_ii≈1 の点があれば計算不能→None。\"\"\"",
    "    y = np.asarray(res.model.endog, dtype=float)",
    "    resid = np.asarray(res.resid, dtype=float)",
    "    infl = res.get_influence()",
    "    h = np.asarray(infl.hat_matrix_diag, dtype=float)",
    "    if np.any(h > 1.0 - 1e-8):",
    "        return None",
    "    press = float(np.sum((resid / (1.0 - h)) ** 2))",
    "    sst = float(np.sum((y - y.mean()) ** 2))",
    "    if sst \u003c= 0:",
    "        return None",
    "    return 1.0 - press / sst",
    "",
    "",
    "# ──────────────────────────────",
    "# lack-of-fit 検定（純誤差 vs 当てはまり不足）",
    "# ──────────────────────────────",
    "def lack_of_fit(cond_df, res):",
    "    \"\"\"",
    "    同一条件の繰り返し（レプリケート）から純誤差を測り、モデルの「当てはまり不足",
    "    (lack of fit)」を F 検定する。cond_df は fit に使った行（列 T,phi,F）、res は",
    "    その OLS 結果（res.model.endog=応答, res.resid=残差）。",
    "",
    "    分散分解:  SS残差(SSE) = 純誤差(SSPE) + 当てはまり不足(SSLOF)",
    "      SSPE = Σ_group Σ_i (y_i − ȳ_group)²   （同一条件グループ内の変動）, df_PE = Σ(n_g−1)",
    "      SSLOF = SSE − SSPE,  df_LOF = df_E − df_PE",
    "      F = (SSLOF/df_LOF) / (SSPE/df_PE),  p = P(F > 観測値)",
    "",
    "    解釈: p が小さい(\u003c0.05)ほど「モデルでは説明しきれない系統的なズレがある」＝要注意。",
    "          p が大きければモデルは棄却されない（当てはまり不足の証拠なし）。",
    "    レプリケートが無い / 自由度が足りなければ検定不能 → None。",
    "    \"\"\"",
    "    import collections",
    "    from scipy import stats as _stats",
    "    y = np.asarray(res.model.endog, dtype=float)",
    "    sse = float(np.sum(np.asarray(res.resid, dtype=float) ** 2))",
    "    df_e = float(res.df_resid)",
    "    keys = list(zip(np.round(cond_df[\"T\"].to_numpy(float), 6),",
    "                    np.round(cond_df[\"phi\"].to_numpy(float), 6),",
    "                    np.round(cond_df[\"F\"].to_numpy(float), 6)))",
    "    groups = collections.defaultdict(list)",
    "    for i, k in enumerate(keys):",
    "        groups[k].append(i)",
    "    ss_pe, df_pe = 0.0, 0.0",
    "    for idx in groups.values():",
    "        if len(idx) > 1:",
    "            yy = y[idx]",
    "            ss_pe += float(np.sum((yy - yy.mean()) ** 2))",
    "            df_pe += len(idx) - 1",
    "    df_lof = df_e - df_pe",
    "    if df_pe \u003c 1 or df_lof \u003c 1:",
    "        return None",
    "    ss_lof = max(sse - ss_pe, 0.0)",
    "    ms_pe = ss_pe / df_pe",
    "    ms_lof = ss_lof / df_lof",
    "    F = ms_lof / ms_pe if ms_pe > 0 else float(\"inf\")",
    "    p = float(_stats.f.sf(F, df_lof, df_pe))",
    "    return {\"F\": float(F), \"p\": p, \"df_lof\": int(df_lof), \"df_pe\": int(df_pe)}",
    "",
    "",
    "# ──────────────────────────────",
    "# 3ピークまとめてフィット",
    "# ──────────────────────────────",
    "def _rmse(a, b):",
    "    return float(np.sqrt(np.mean((np.asarray(a) - np.asarray(b)) ** 2)))",
    "",
    "",
    "def fit_all(df, Vm, L_mm, include_d=True, include_e=True, include_day=True,",
    "            peak_names=None):",
    "    \"\"\"",
    "    指定ピーク（既定は IP1/TP/IP2）の保持＋幅をフィットし、peaks dict と診断を返す。",
    "    夾雑ピーク数は peak_names で任意に指定できる。",
    "    各ピークは欠損（NaN）行をそのピークだけ除外してフィットする（部分欠損に頑健）。",
    "    戻り値: (peaks_dict, diagnostics_dict)",
    "      peaks_dict[name] = {a,b,c,d,e,delta,wc0,wc1}",
    "      diagnostics[name] = {'R2_retention','R2_width','RMSE_tR_min','RMSE_Wh_min','n'}",
    "",
    "    注: 実験範囲が狭く保持の説明変数は多重共線。個別係数は一意に決まりにくいが、",
    "    予測（t_R・W_h・Rs）は安定する。品質は係数でなく予測スケールの RMSE で見るのが妥当。",
    "    \"\"\"",
    "    names = PEAKS if peak_names is None else list(peak_names)",
    "    peaks = {}",
    "    diagnostics = {}",
    "    for name in names:",
    "        sub = df.dropna(subset=[f\"tR_{name}\", f\"Wh_{name}\"])  # 欠損行を除外",
    "        ret, ret_res = fit_retention(sub, name, Vm, include_d, include_e, include_day)",
    "        wid, wid_res = fit_width(sub, name, Vm, L_mm)   # 幅 = wc0 + wc1·t_R",
    "        peaks[name] = {**ret, **wid}",
    "",
    "        # 予測スケールでの当てはまり（本当に意味のある指標）",
    "        F = sub[\"F\"].to_numpy(dtype=float)",
    "        tR_meas = sub[f\"tR_{name}\"].to_numpy(dtype=float)",
    "        Wh_meas = sub[f\"Wh_{name}\"].to_numpy(dtype=float)",
    "        tR_hat = (Vm / F) * (1.0 + np.exp(ret_res.fittedvalues))   # ln k → k → t_R",
    "        Wh_hat = np.asarray(wid_res.fittedvalues)                  # W_h = wc0 + wc1·t_R",
    "",
    "        # 係数の共分散（誤差伝搬で Rs の信頼区間を出すのに使う）。",
    "        # OLS の cov_params = σ²(XᵀX)⁻¹。列の並びは下のキー順と一致する。",
    "        ret_keys = [\"a\", \"b\", \"c\"] + ([\"d\"] if include_d else []) \\",
    "            + ([\"e\"] if include_e else []) + ([\"delta\"] if include_day else [])",
    "        wid_keys = [\"wc0\", \"wc1\"]",
    "",
    "        diagnostics[name] = {",
    "            \"R2_retention\": ret_res.rsquared,",
    "            \"R2_width\": wid_res.rsquared,",
    "            \"RMSE_tR_min\": _rmse(tR_hat, tR_meas),",
    "            \"RMSE_Wh_min\": _rmse(Wh_hat, Wh_meas),",
    "            \"n\": len(sub),",
    "            \"ret_keys\": ret_keys,",
    "            \"ret_cov\": np.asarray(ret_res.cov_params()),",
    "            \"wid_keys\": wid_keys,",
    "            \"wid_cov\": np.asarray(wid_res.cov_params()),",
    "            \"LOF_retention\": lack_of_fit(sub, ret_res),   # 保持モデルの当てはまり不足",
    "            \"LOF_width\": lack_of_fit(sub, wid_res),        # 幅モデルの当てはまり不足",
    "            \"adjR2_retention\": adj_r2(ret_res),",
    "            \"adjR2_width\": adj_r2(wid_res),",
    "            \"Q2_retention\": q2_loo(ret_res),",
    "            \"Q2_width\": q2_loo(wid_res),",
    "            # 各係数の p 値（列順＝キー順）。保持は多重共線で個別係数は不安定＝参考程度。",
    "            \"ret_pvalues\": dict(zip(ret_keys, np.asarray(ret_res.pvalues, dtype=float))),",
    "            \"wid_pvalues\": dict(zip(wid_keys, np.asarray(wid_res.pvalues, dtype=float))),",
    "        }",
    "    return peaks, diagnostics",
    "",
    "",
    "# ──────────────────────────────",
    "# 合成データ（動作確認用）",
    "# ──────────────────────────────",
    "def simulate_measurements(model_mod, true_peaks, design_df, Vm, L_mm,",
    "                          noise_tR=0.01, noise_Wh=0.002, seed=0, peak_names=None):",
    "    \"\"\"既知パラメータ true_peaks から t_R・W_h を生成し、計測ノイズを足す（フィット検証用）。",
    "    peak_names で対象ピークを指定（既定は IP1/TP/IP2）。\"\"\"",
    "    rng = np.random.default_rng(seed)",
    "    df = design_df.copy()",
    "    T = df[\"T\"].to_numpy(dtype=float)",
    "    phi = df[\"phi\"].to_numpy(dtype=float)",
    "    F = df[\"F\"].to_numpy(dtype=float)",
    "    day = df[\"day\"].to_numpy(dtype=float)",
    "    names = PEAKS if peak_names is None else list(peak_names)",
    "    for name in names:",
    "        pred = model_mod.predict_peak(true_peaks[name], T, phi, F, Vm, L_mm, day=day)",
    "        df[f\"tR_{name}\"] = pred[\"tR\"] + rng.normal(0, noise_tR, len(df))",
    "        df[f\"Wh_{name}\"] = pred[\"Wh\"] + rng.normal(0, noise_Wh, len(df))",
    "    return df",
    "",
    "",
    "def _load_module(path, name):",
    "    \"\"\"数字始まりのファイル（01_model.py 等）を import する補助。\"\"\"",
    "    import importlib.util",
    "    spec = importlib.util.spec_from_file_location(name, path)",
    "    mod = importlib.util.module_from_spec(spec)",
    "    spec.loader.exec_module(mod)",
    "    return mod",
    "",
    "",
    "if __name__ == \"__main__\":",
    "    import os",
    "    here = os.path.dirname(__file__)",
    "    model_mod = _load_module(os.path.join(here, \"01_model.py\"), \"model01\")",
    "    design_mod = _load_module(os.path.join(here, \"02_design.py\"), \"design02\")",
    "",
    "    Vm, L = 0.24, 100.0",
    "    factors = {",
    "        \"T\":   {\"low\": 40, \"center\": 50, \"high\": 60},",
    "        \"phi\": {\"low\": 0.38, \"center\": 0.45, \"high\": 0.52},",
    "        \"F\":   {\"low\": 0.4, \"center\": 0.6, \"high\": 0.8},",
    "    }",
    "    # Day1 CCD + Day2(橋渡し3 + D最適8)。日間差の復元も見たいので2日分。",
    "    design = design_mod.build_runs_template(factors, n_center=6, alpha=1.0,",
    "                                            n_bridge=3, n_augment=8)",
    "",
    "    # 既知の「真の」パラメータ（交互作用 e と日間差 delta を意図的に入れる）",
    "    true_peaks = model_mod.example_peaks()",
    "    for name in PEAKS:",
    "        true_peaks[name][\"e\"] = 80.0          # 交互作用（クロスオーバー源）",
    "        true_peaks[name][\"delta\"] = 0.03      # Day2 のオフセット",
    "",
    "    sim = simulate_measurements(model_mod, true_peaks, design, Vm, L, seed=1)",
    "    peaks_hat, diag = fit_all(sim, Vm, L)",
    "",
    "    print(\"=== 予測の当てはまり（意味のある指標）===\")",
    "    for name in PEAKS:",
    "        d = diag[name]",
    "        print(f\"[{name}]  R²(保持)={d['R2_retention']:.4f}  R²(幅)={d['R2_width']:.4f}  \"",
    "              f\"RMSE(t_R)={d['RMSE_tR_min']*60:.2f}秒  RMSE(W_h)={d['RMSE_Wh_min']*60:.2f}秒\")",
    "",
    "    # 真値で再現した Rs と、推定モデルで再現した Rs を全格子で比較",
    "    print(\"\\n=== Rs の予測一致（真モデル vs 推定モデル）===\")",
    "    rng_T = np.linspace(40, 60, 5)",
    "    rng_phi = np.linspace(0.38, 0.52, 5)",
    "    TT, PP = np.meshgrid(rng_T, rng_phi)",
    "    true_rs = model_mod.separation(true_peaks, TT, PP, 0.6, Vm, L)[\"Rs_min\"]",
    "    hat_rs = model_mod.separation(peaks_hat, TT, PP, 0.6, Vm, L)[\"Rs_min\"]",
    "    print(f\"  Rs_min RMSE（格子全体, F=0.6固定）= {_rmse(true_rs, hat_rs):.4f}\")",
    "    print(f\"  真の Rs_min 範囲 = {true_rs.min():.2f} 〜 {true_rs.max():.2f}\")",
