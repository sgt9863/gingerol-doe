<body>
<div id="boot">
  <h1>HPLC デザインスペース最適化</h1>
  <div class="bar"><i></i></div>
  <p>ブラウザ内で Python を準備しています。<br>
     初回だけ数十秒〜数分かかります（2 回目以降はキャッシュから高速に起動）。</p>

<script type="module">
import {{ mount }} from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.js";

const files = {"app.py": "\"\"\"\napp.py — HPLC デザインスペース最適化の Streamlit Web アプリ（薄い入口）\n\n起動: streamlit run app.py\n\n実験〜可視化の正規フロー（タブで順に進む）:\n  ① 計画(CCD)      … Day1 の中心複合計画を生成し、データ入力用 Excel 雛形をDL\n  ② Day1 フィット   … 記入済み Day1 データを読み込み、保持3・幅3モデルをフィット\n  ③ D最適 augment  … メカニズムモデル基準で Day2 の追加点を生成、Excel 雛形をDL\n  ④ 最終解析        … Day1+Day2 全データでフィット → デザインスペース → 推奨条件 → DL\n  （デモ … 合成データで①〜④を一気に体験）\n\n注: 中核ロジック（01〜04）は numpy 系のみ。plotly/streamlit はこの入口と 05 専用。\n\"\"\"\n\nimport io\nimport os\nimport re\nimport importlib.util\n\nimport numpy as np\nimport pandas as pd\nimport streamlit as st\nimport yaml\n\n\n# ──────────────────────────────\n# scripts/ の数字始まりモジュールを読み込む\n# ──────────────────────────────\nHERE = os.path.dirname(os.path.abspath(__file__))\nSCRIPTS = os.path.join(HERE, \"scripts\")\n\n# kaleido（plotly の静止画レンダラ）の有無。stlite（ブラウザ内 Pyodide）には無いため、\n# 回転 GIF 機能はある環境でだけ表示する。中核の計算・3D表示はどちらでも同じ。\nHAS_KALEIDO = importlib.util.find_spec(\"kaleido\") is not None\n\n\ndef _load(path, name):\n    spec = importlib.util.spec_from_file_location(name, path)\n    mod = importlib.util.module_from_spec(spec)\n    spec.loader.exec_module(mod)\n    return mod\n\n\ndef _scripts_signature():\n    \"\"\"scripts/*.py の内容ハッシュ。中身が変わると load_modules のキャッシュキーも変わり、\n    再デプロイ後に古いモジュールが居座る（AttributeError 等）のを防ぐ。\"\"\"\n    import hashlib\n    h = hashlib.md5()\n    for fn in sorted(os.listdir(SCRIPTS)):\n        if fn.endswith(\".py\"):\n            with open(os.path.join(SCRIPTS, fn), \"rb\") as f:\n                h.update(f.read())\n    return h.hexdigest()\n\n\n@st.cache_resource\ndef load_modules(scripts_sig):\n    # scripts_sig はキャッシュキー専用（中身は使わない）。スクリプトが変わると再ロードされる。\n    # 注意: 引数名をアンダースコア始まりにすると Streamlit がハッシュ対象から除外し、\n    # キャッシュが無効化されなくなる（古いモジュールが居座る）。必ず非アンダースコア名にする。\n    model = _load(os.path.join(SCRIPTS, \"01_model.py\"), \"model01\")\n    design = _load(os.path.join(SCRIPTS, \"02_design.py\"), \"design02\")\n    fit = _load(os.path.join(SCRIPTS, \"03_fit.py\"), \"fit03\")\n    opt = _load(os.path.join(SCRIPTS, \"04_optimize.py\"), \"opt04\")\n    ds = _load(os.path.join(SCRIPTS, \"05_designspace.py\"), \"ds05\")\n    quad = _load(os.path.join(SCRIPTS, \"06_quadratic.py\"), \"quad06\")\n    return model, design, fit, opt, ds, quad\n\n\ndef load_config():\n    \"\"\"config.yaml があれば読む。無ければ config.example.yaml。\"\"\"\n    for fn in (\"config.yaml\", \"config.example.yaml\"):\n        p = os.path.join(HERE, fn)\n        if os.path.exists(p):\n            with open(p, encoding=\"utf-8\") as f:\n                return yaml.safe_load(f), fn\n    return None, None\n\n\ndef to_excel_bytes(df, sheet_name=\"runs\"):\n    \"\"\"DataFrame を xlsx のバイト列にする（ダウンロードボタン用）。\"\"\"\n    buf = io.BytesIO()\n    with pd.ExcelWriter(buf, engine=\"openpyxl\") as w:\n        df.to_excel(w, index=False, sheet_name=sheet_name)\n    return buf.getvalue()\n\n\ndef read_runs(uploaded, required_cols):\n    \"\"\"アップロードされた xlsx/csv を読み、必要列を検証して返す（不足なら None と不足列）。\"\"\"\n    df = (pd.read_csv(uploaded, keep_default_na=True, na_values=[\"\", \" \"])\n          if uploaded.name.endswith(\".csv\")\n          else pd.read_excel(uploaded, keep_default_na=True, na_values=[\"\", \" \"]))\n    missing = [c for c in required_cols if c not in df.columns]\n    return (None, missing) if missing else (df, [])\n\n\ndef peaks_from_columns(columns):\n    \"\"\"アップロード表の列名からピーク構成を判定する。\n    tR_X と Wh_X の両方が揃う X をピークとして採用し、目的 TP を先頭に並べる。\n    IP は末尾の数字順（IP1, IP2, …, IP10 …）にソート。\n    見つからなければ (None, None)。\"\"\"\n    trs = {c[3:] for c in columns if c.startswith(\"tR_\")}\n    whs = {c[3:] for c in columns if c.startswith(\"Wh_\")}\n    names = trs & whs\n    if TARGET not in names:\n        return None, None\n\n    def _key(n):\n        m = re.search(r\"(\\d+)$\", n)\n        return (0, int(m.group(1))) if m else (1, n)\n\n    interfering = sorted((n for n in names if n != TARGET), key=_key)\n    return interfering, [TARGET] + interfering\n\n\ndef factors_from_data(df, response_cols):\n    \"\"\"アップロードデータの T/φ/F 列の min–max を評価範囲（内挿範囲）にする。\n    応答が全て欠損の行（測定できなかった点）は「データが無い」ので範囲決定から除外する。\n    退化（min==max・全欠損など）で範囲が取れない因子があれば None を返す。\"\"\"\n    resp = df[[c for c in response_cols if c in df.columns]]\n    keep = resp.notna().any(axis=1) if resp.shape[1] else pd.Series(True, index=df.index)\n    sub = df[keep] if keep.any() else df\n    fr = {}\n    for k in (\"T\", \"phi\", \"F\"):\n        col = pd.to_numeric(sub[k], errors=\"coerce\")\n        lo, hi = float(np.nanmin(col)) if col.notna().any() else np.nan, \\\n            float(np.nanmax(col)) if col.notna().any() else np.nan\n        if not (np.isfinite(lo) and np.isfinite(hi)) or hi \u003c= lo:\n            return None\n        fr[k] = {\"low\": lo, \"center\": (lo + hi) / 2.0, \"high\": hi}\n    return fr\n\n\ndef read_runs_auto(uploaded):\n    \"\"\"②解析用: ファイルを読み、基本列（T/φ/F/day）を検証し、ピーク構成を列名から判定する。\n    返り値は (df, interfering, all_peaks, error)。成功時 error=None、失敗時は df=None・error に理由。\"\"\"\n    df = (pd.read_csv(uploaded, keep_default_na=True, na_values=[\"\", \" \"])\n          if uploaded.name.endswith(\".csv\")\n          else pd.read_excel(uploaded, keep_default_na=True, na_values=[\"\", \" \"]))\n    miss = [c for c in (\"T\", \"phi\", \"F\", \"day\") if c not in df.columns]\n    if miss:\n        return None, None, None, f\"基本列が不足: {miss}\"\n    interfering, all_peaks = peaks_from_columns(df.columns)\n    if all_peaks is None:\n        return None, None, None, \"目的ピークの列（tR_TP と Wh_TP）が見つかりません\"\n    if not interfering:\n        return None, None, None, \"夾雑ピークの列（tR_IP*/Wh_IP* など）が見つかりません\"\n    return df, interfering, all_peaks, None\n\n\n# ──────────────────────────────\n# 画面共通：設定・スタイル\n# ──────────────────────────────\nst.set_page_config(page_title=\"HPLC デザインスペース最適化\", layout=\"wide\")\n\nst.markdown(\"\"\"\n\u003cstyle>\n  :root { --accent:#0d9488; --accent2:#0891b2; --line:rgba(128,128,128,.22); }\n  .block-container { padding-top: 1.1rem; max-width: 1120px; }\n\n  /* ── ヘッダー（帯ではなく、グラデ見出し＋細いルール） ── */\n  .app-header { margin:.1rem 0 1.15rem; }\n  .app-header h1 { margin:0; font-size:1.55rem; font-weight:650; letter-spacing:-.015em;\n    background:linear-gradient(92deg,var(--accent),var(--accent2));\n    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }\n  .app-header p { margin:.3rem 0 0; font-size:.85rem; font-weight:400; opacity:.68; }\n  .app-header .rule { height:2px; margin-top:.75rem; border-radius:2px;\n    background:linear-gradient(90deg,var(--accent),var(--accent2) 38%,transparent 92%); }\n\n  /* ── 設定内の小見出しラベル（大文字・トラッキング） ── */\n  .sec-label { font-size:.7rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase;\n    color:var(--accent); margin:.15rem 0 .45rem; }\n\n  /* ── タブ：下線式のアクティブ表示 ── */\n  .stTabs [data-baseweb=\"tab-list\"] { gap:1.5rem; border-bottom:1px solid var(--line); }\n  .stTabs [data-baseweb=\"tab\"] { padding:.5rem .15rem; font-weight:600; font-size:.95rem; }\n  .stTabs [aria-selected=\"true\"] { color:var(--accent); }\n  .stTabs [data-baseweb=\"tab-highlight\"] { background:var(--accent); height:2px; }\n\n  /* ── メトリクスを淡いカードに ── */\n  [data-testid=\"stMetric\"] { border:1px solid var(--line); border-radius:12px;\n    padding:.7rem 1rem; background:rgba(13,148,136,.035); }\n  [data-testid=\"stMetricValue\"] { color:var(--accent); font-weight:700; }\n\n  /* ── expander / popover は角丸・細枠 ── */\n  [data-testid=\"stExpander\"] { border-radius:12px; border:1px solid var(--line); }\n  [data-testid=\"stExpander\"] summary { font-weight:600; }\n\n  /* ── テーブルのヘッダ強調 ── */\n  [data-testid=\"stTable\"] thead th { background:rgba(13,148,136,.07); font-weight:700; }\n\n  /* ── ボタン角丸 ── */\n  .stButton button, .stDownloadButton button { border-radius:10px; font-weight:600; }\n\n  /* ── 見出しを引き締める ── */\n  h2, h3 { margin-top:.3rem; font-weight:650; letter-spacing:-.006em; }\n\u003c/style>\n\"\"\", unsafe_allow_html=True)\n\nst.markdown(\"\"\"\n\u003cdiv class=\"app-header\">\n  \u003ch1>HPLC デザインスペース最適化\u003c/h1>\n  \u003cp>実験計画（CCD / BBD） → メカニズム・二次回帰フィット → デザインスペース → ロバストな最適条件\u003c/p>\n  \u003cdiv class=\"rule\">\u003c/div>\n\u003c/div>\n\"\"\", unsafe_allow_html=True)\n\nmodel, design, fit, opt, ds, quad = load_modules(_scripts_signature())\ncfg, cfg_name = load_config()\nif cfg is None:\n    st.error(\"config.yaml / config.example.yaml が見つかりません。\")\n    st.stop()\n\n# ── 設定の構成 ──\n# 共通設定ボックスは廃止。各設定は「実際に必要になるタブ」で入力する:\n#   ① 計画  … 因子範囲・ピーク数・実験計画（まだデータが無いので手入力するしかない）\n#   ② 解析  … カラム(→V_m)・合格条件・解析モデル。因子範囲とピーク構成は\n#             アップロードデータから自動判定（データがある＝範囲もピークも読める）\n#   ③ D最適 … 追加点数。①の計画（範囲・ピーク）と②の V_m・合格条件を引き継ぐ\n# Streamlit は全タブを毎回描画し ①→②→③→デモ の順に実行するので、後段タブが参照する\n# グローバル（①の factors/peaks、②の Vm/criteria/model）は前段タブで確定済みになる。\nfc = cfg[\"factors\"]\nac = cfg[\"acceptance_criteria\"]\ncolu = cfg[\"column\"]\nTARGET = \"TP\"\nWATERS_ID = [1.0, 2.1, 3.0]            # Waters ACQUITY BEH でよくある内径 [mm]\nWATERS_LEN = [30, 50, 75, 100, 150]    # よくある長さ [mm]\n# 実験計画タイプ → (kind, alpha)。BBD は α 不使用。\nDESIGN_OPTIONS = {\n    \"Box-Behnken (BBD) — 角も軸点もなし／全点が範囲内\": (\"bbd\", 1.0),\n    \"面心 CCD (α=1.0) — 頂点＋軸点が範囲の面上\": (\"ccd\", 1.0),\n    \"回転可能 CCD (α≈1.682) — 予測精度が均一・軸点は範囲外\": (\"ccd\", (2 ** 3) ** 0.25),\n}\ngrid_n = 51                            # デザインスペース格子の解像度（固定）\n\n\ndef section_label(text):\n    \"\"\"設定内の小見出し（大文字・トラッキングのアクセントラベル）。\"\"\"\n    st.markdown(f\"\u003cdiv class='sec-label'>{text}\u003c/div>\", unsafe_allow_html=True)\n\n\ndef basic_factor_inputs():\n    \"\"\"因子範囲・ピーク構成の入力（共通設定の「分離対象」で呼ぶ）。グローバルに値を設定する。\"\"\"\n    global factors, INTERFERING, ALL_PEAKS, RESPONSE_COLS, REQUIRED_COLS\n    st.caption(\"因子範囲（T・φ・F の下限／上限）\")\n    sc = st.columns(3)\n    T_lo = sc[0].number_input(\"T 下限 [℃]\", value=float(fc[\"T\"][\"low\"]))\n    T_hi = sc[0].number_input(\"T 上限 [℃]\", value=float(fc[\"T\"][\"high\"]))\n    P_lo = sc[1].number_input(\"φ 下限\", value=float(fc[\"phi\"][\"low\"]), format=\"%.3f\")\n    P_hi = sc[1].number_input(\"φ 上限\", value=float(fc[\"phi\"][\"high\"]), format=\"%.3f\")\n    F_lo = sc[2].number_input(\"F 下限 [mL/min]\", value=float(fc[\"F\"][\"low\"]), format=\"%.2f\")\n    F_hi = sc[2].number_input(\"F 上限 [mL/min]\", value=float(fc[\"F\"][\"high\"]), format=\"%.2f\")\n    factors = {\n        \"T\":   {\"low\": T_lo, \"center\": (T_lo + T_hi) / 2, \"high\": T_hi},\n        \"phi\": {\"low\": P_lo, \"center\": (P_lo + P_hi) / 2, \"high\": P_hi},\n        \"F\":   {\"low\": F_lo, \"center\": (F_lo + F_hi) / 2, \"high\": F_hi},\n    }\n    n_ip = int(st.number_input(\"夾雑ピークの数（目的ピークの前後）\", 1, 8, 1, step=1,\n                               help=\"目的ピーク TP に対し、邪魔なピークを何本入れるか。既定1。\"))\n    INTERFERING = [f\"IP{i}\" for i in range(1, n_ip + 1)]\n    ALL_PEAKS = [TARGET] + INTERFERING\n    RESPONSE_COLS = [f\"tR_{p}\" for p in ALL_PEAKS] + [f\"Wh_{p}\" for p in ALL_PEAKS]\n    REQUIRED_COLS = [\"T\", \"phi\", \"F\", \"day\"] + RESPONSE_COLS\n    st.caption(f\"ピーク: {TARGET}（目的）＋ {', '.join(INTERFERING)}\")\n\n\ndef ccd_design_inputs():\n    \"\"\"実験計画タイプ（BBD / 面心CCD / 回転CCD）と中心点数の入力（①計画タブで呼ぶ）。\"\"\"\n    global n_center, alpha_ccd, design_kind\n    c = st.columns(2)\n    n_center = c[0].slider(\"中心点の数\", 3, 8, 6)\n    label = c[1].radio(\"実験計画のタイプ\", list(DESIGN_OPTIONS.keys()), index=1)\n    design_kind, alpha_ccd = DESIGN_OPTIONS[label]\n    if design_kind == \"bbd\":\n        c[1].caption(\"Box-Behnken: 各因子ペアの辺中点 12 点 ＋ 中心点\")\n    else:\n        c[1].caption(f\"CCD: 頂点8 ＋ 軸上点6 ＋ 中心点（α = {alpha_ccd:.4f}）\")\n\n\ndef column_inputs():\n    \"\"\"カラム寸法 → V_m の入力（共通設定の「カラム」で呼ぶ）。\"\"\"\n    global Vm, L_mm\n    cc = st.columns(3)\n    id_default = float(colu.get(\"id_mm\", 2.1))\n    len_default = int(colu.get(\"length_mm\", 100))\n    id_mm = cc[0].selectbox(\"内径 [mm]\", WATERS_ID,\n                            index=WATERS_ID.index(id_default) if id_default in WATERS_ID else 1)\n    L_mm = float(cc[1].selectbox(\"長さ [mm]\", WATERS_LEN,\n                                 index=WATERS_LEN.index(len_default) if len_default in WATERS_LEN else 3))\n    porosity = cc[2].number_input(\"空隙率\", value=float(colu.get(\"porosity\", 0.66)), format=\"%.2f\")\n    Vm_geo = porosity * np.pi * (id_mm / 2.0) ** 2 * L_mm / 1000.0\n    st.caption(f\"幾何推算 V_m = {Vm_geo:.3f} mL（{id_mm}×{int(L_mm)} mm, 空隙率{porosity}）\")\n    if st.checkbox(\"V_m を手入力で上書き（ウラシル実測値など）\"):\n        Vm = st.number_input(\"V_m [mL]\", value=round(Vm_geo, 3), format=\"%.3f\")\n    else:\n        Vm = Vm_geo\n\n\ndef criteria_inputs():\n    \"\"\"合格条件（Rs_min・t_R(TP) 上限）の入力（共通設定の「合格条件」で呼ぶ）。\"\"\"\n    global criteria\n    ac_cols = st.columns(2)\n    criteria = {\n        \"Rs_min\": ac_cols[0].number_input(\"Rs_min ≥\", value=float(ac[\"Rs_min\"]), format=\"%.1f\"),\n        \"tR_TP_max\": ac_cols[1].number_input(\"t_R(TP) ≤ [分]\", value=float(ac[\"tR_TP_max\"]), format=\"%.1f\"),\n        # 最遅ピークの上限はデータ取り段階の洗浄前制約であり、デザインスペースの合否には含めない\n        \"tR_last_max\": None,\n    }\n\n\ndef augment_inputs():\n    \"\"\"D最適の点数・橋渡し中心点の入力。\"\"\"\n    global n_augment, n_bridge\n    c = st.columns(2)\n    n_augment = c[0].slider(\"D最適 追加点の数\", 0, 16, 8)\n    n_bridge = c[1].slider(\"Day2 橋渡し中心点\", 0, 5, 3)\n\n\n# 解析モデルの選択肢 → (予測モジュール, フィットモジュール, タグ)\nMODEL_OPTIONS = {\n    \"メカニズム（推奨・少数データに強い）\": (\"mech\",),\n    \"二次回帰（フル2次の応答曲面）\": (\"quad\",),\n}\n\n\ndef model_inputs():\n    \"\"\"解析モデル（メカニズム / 二次回帰）の選択。active_model / active_fit を確定。\"\"\"\n    global active_model, active_fit, model_type\n    label = st.radio(\"解析モデル\", list(MODEL_OPTIONS.keys()), index=0, horizontal=True,\n                     help=\"メカニズム=クロマトの物理式（少数データ・外挿に強い）。\"\n                          \"二次回帰=(T,φ,F)のフル2次（点数が十分なら有効、少数だと過学習）。\")\n    model_type = MODEL_OPTIONS[label][0]\n    if model_type == \"quad\":\n        active_model, active_fit = quad, quad\n    else:\n        active_model, active_fit = model, fit\n    with st.popover(\"モデルの数式を表示\"):\n        if model_type == \"quad\":\n            st.markdown(\"**二次回帰（応答曲面）モデル** — t_R・W_h を各ピークごとに (T, φ, F) のフル2次で直接フィット\")\n            st.latex(r\"y = \\beta_0 + \\beta_1 T + \\beta_2 \\varphi + \\beta_3 F\"\n                     r\" + \\beta_4 T^2 + \\beta_5 \\varphi^2 + \\beta_6 F^2\"\n                     r\" + \\beta_7 T\\varphi + \\beta_8 TF + \\beta_9 \\varphi F\")\n            st.caption(\"y は t_R または W_h。分離度 Rs は予測した t_R・W_h から計算。\")\n        else:\n            st.markdown(\"**メカニズムモデル**（クロマトの物理式）\")\n            st.markdown(\"保持係数 k（ファントホッフ × LSS）:\")\n            st.latex(r\"\\ln k = a + \\frac{b}{T_K} + c\\,\\varphi + d\\,\\varphi^2\"\n                     r\" + e\\,\\frac{\\varphi}{T_K} + \\delta\\,\\mathrm{day}\")\n            st.markdown(\"保持時間:\")\n            st.latex(r\"t_R = \\frac{V_m}{F}\\,(1 + k)\")\n            st.markdown(\"ピーク幅（保持時間比例。N ほぼ一定 → W_h ∝ t_R）:\")\n            st.latex(r\"W_h = w_{c0} + w_{c1}\\,t_R,\\qquad W_b = \\tfrac{4}{\\sqrt{8\\ln 2}}\\,W_h\")\n        st.markdown(\"分離度（クロスオーバー対応・化合物同一性で固定）:\")\n        st.latex(r\"R_s = \\frac{2\\,|t_R^{\\mathrm{TP}} - t_R^{\\mathrm{IP}}|}{W_b^{\\mathrm{TP}} + W_b^{\\mathrm{IP}}},\"\n                 r\"\\qquad \\text{目標}\\ \\min_{\\mathrm{IP}} R_s \\ge 2.0\")\n        st.caption(\"T_K=T+273.15[K]、φ=ACN分率、u=L·F/V_m。記号の詳細は references/理論構築の流れ.md。\")\n\n\ndef run_fit_and_designspace(df, factors, all_peaks, interfering, Vm, L_mm, header_prefix=\"\"):\n    \"\"\"共通処理: フィット → 診断表示 → 最適化 → 推奨条件 → 3D → DL。\n    因子範囲・ピーク構成・V_m は呼び出し側が渡す（②はアップロードデータから自動判定、\n    デモはデモデータから）。解析モデル・合格条件はグローバル（②タブで確定）を参照する。\"\"\"\n    ALL_PEAKS = all_peaks            # 以降の本体は ALL_PEAKS / INTERFERING の名前で参照する\n    INTERFERING = interfering\n    peaks_hat, diag = active_fit.fit_all(df, Vm, L_mm, peak_names=ALL_PEAKS)\n\n    _mdl_name = \"二次回帰\" if model_type == \"quad\" else \"メカニズム\"\n    st.caption(f\"解析モデル: **{_mdl_name}**\")\n    if model_type == \"quad\":\n        min_n = min(diag[nm].get(\"n\", 0) for nm in ALL_PEAKS)\n        if min_n \u003c 15:\n            st.warning(f\"⚠ 二次回帰は1応答あたり10パラメータ。最小点数 n={min_n} では過学習しやすく\"\n                       \"外挿が不安定です（LOO検証で確認済み）。少数データではメカニズムを推奨します。\")\n\n    st.subheader(f\"{header_prefix}モデルフィット\")\n\n    def _lof_p(lof):\n        return \"—\" if not lof else round(lof[\"p\"], 3)\n\n    def _r2_triple(r2, adj, q2):\n        f = lambda v: \"—\" if v is None else f\"{v:.3f}\"\n        return f\"{r2:.3f} / {f(adj)} / {f(q2)}\"\n\n    rows = []\n    lof_flag = False\n    for nm in ALL_PEAKS:\n        d = diag[nm]\n        lr, lw = d.get(\"LOF_retention\"), d.get(\"LOF_width\")\n        if (lr and lr[\"p\"] \u003c 0.05) or (lw and lw[\"p\"] \u003c 0.05):\n            lof_flag = True\n        rows.append({\n            \"ピーク\": nm + (\"（目的）\" if nm == TARGET else \"\"),\n            \"n\": d.get(\"n\", \"\"),\n            \"保持 R²/adj/Q²\": _r2_triple(d[\"R2_retention\"], d.get(\"adjR2_retention\"),\n                                         d.get(\"Q2_retention\")),\n            \"RMSE(t_R)秒\": round(d[\"RMSE_tR_min\"] * 60, 2),\n            \"LOF p(保持)\": _lof_p(lr),\n            \"幅 R²/adj/Q²\": _r2_triple(d[\"R2_width\"], d.get(\"adjR2_width\"), d.get(\"Q2_width\")),\n            \"RMSE(W_h)秒\": round(d[\"RMSE_Wh_min\"] * 60, 2),\n            \"LOF p(幅)\": _lof_p(lw),\n        })\n    st.table(pd.DataFrame(rows))\n    st.caption(\"**R²/adj/Q²** = 当てはまり / 自由度調整済み R² / 予測 R²（Q²=LOO交差検証）。\"\n               \"n=使った点数（欠損除外）。RMSE=予測の平均的ズレ。\"\n               \"**Q² が R² に近いほど過学習が小さく予測力が高い**（Q²≪R² は過学習のサイン）。\"\n               \"**LOF p**=lack-of-fit 検定（中心点の純誤差と比較。p>0.05 で当てはまり不足の証拠なし）。「—」は算出不能。\")\n    if lof_flag:\n        st.warning(\"⚠ 一部で LOF p\u003c0.05（当てはまり不足の兆候）。ただし中心点の純誤差が極めて小さいと\"\n                   \"検定が過敏になり、実用上は無視できる系統ズレでも有意になり得ます。\"\n                   \"RMSE の実寸（秒）や Q² が許容範囲かも併せて判断してください。\")\n\n    with st.expander(\"係数の p 値（各項が有意か・p\u003c0.05 で有意）\"):\n        def _pv_table(key):\n            rows = []\n            for nm in ALL_PEAKS:\n                r = {\"ピーク\": nm + (\"（目的）\" if nm == TARGET else \"\")}\n                r.update({k: (\"—\" if not np.isfinite(v) else round(v, 3))\n                          for k, v in diag[nm].get(key, {}).items()})\n                rows.append(r)\n            return pd.DataFrame(rows)\n        st.markdown(\"**保持モデル 係数 p 値**\")\n        st.table(_pv_table(\"ret_pvalues\"))\n        st.markdown(\"**幅モデル 係数 p 値**\")\n        st.table(_pv_table(\"wid_pvalues\"))\n        st.caption(\"p\u003c0.05 でその項が統計的に有意。ただし**保持モデルは実験範囲が狭く多重共線**のため、\"\n                   \"個別係数の p 値・符号は不安定になりやすく深読み非推奨（予測精度＝RMSE/Q² で評価するのが妥当）。\"\n                   \"二次回帰では交差項の有意性の目安になる。\")\n\n    st.subheader(f\"{header_prefix}デザインスペースと推奨条件\")\n\n    # ── 計算範囲（内挿 / 外挿）と最適化基準を 3D の手前で選ぶ ──\n    oc1, oc2 = st.columns(2)\n    range_mode = oc1.radio(\n        \"計算範囲\", [\"検証範囲内（内挿）\", \"外挿あり（範囲外も予測）\"],\n        key=header_prefix + \"rangemode\",\n        help=\"外挿は因子範囲の外まで雲・グラフを広げます（検証外の予測）。推奨条件は安全のため検証済み範囲内からのみ選びます。\")\n    if range_mode.startswith(\"外挿\"):\n        extrapolate = oc1.slider(\"外挿の広さ（範囲幅に対する割合）\", 0.0, 0.5, 0.1, step=0.05,\n                                 key=header_prefix + \"ext\")\n        restrict_range = False           # 外挿域も推奨候補に含める\n        oc1.caption(\"⚠ 外挿域から推奨点を選びます（検証外の予測のため、採用時は追加検証を推奨）。\")\n    else:\n        extrapolate = 0.0\n        restrict_range = True\n\n    MODE_LABELS = {\n        \"最も頑健（不合格領域から最も遠い）\": \"robust\",\n        \"変動範囲全域が合格で t_R(TP) 最速\": \"fastest_tR\",\n        \"変動範囲全域が合格で ACN 消費量が最小\": \"min_acn\",\n    }\n    mode_label = oc2.radio(\"最適化の基準\", list(MODE_LABELS.keys()),\n                           key=header_prefix + \"optmode\")\n    opt_mode = MODE_LABELS[mode_label]\n    delta = None\n    if opt_mode in (\"fastest_tR\", \"min_acn\"):\n        oc2.caption(\"各因子が運用中にブレうる半幅（±）を設定。その箱の全域が合格な点だけを候補にします。\")\n        dc = oc2.columns(3)\n        delta = {\n            \"T\": float(dc[0].number_input(\"±T [℃]\", value=1.0, min_value=0.0, step=0.5,\n                                          key=header_prefix + \"dT\")),\n            \"phi\": float(dc[1].number_input(\"±φ [分率]\", value=0.01, min_value=0.0, step=0.005,\n                                            format=\"%.3f\", key=header_prefix + \"dphi\")),\n            \"F\": float(dc[2].number_input(\"±F [mL/min]\", value=0.02, min_value=0.0, step=0.01,\n                                          format=\"%.2f\", key=header_prefix + \"dF\")),\n        }\n\n    grid, rec = opt.optimize(active_model, peaks_hat, factors, Vm, L_mm, criteria, n=grid_n,\n                             extrapolate=extrapolate, target=TARGET, interfering=INTERFERING,\n                             mode=opt_mode, delta=delta, restrict_range=restrict_range)\n    n_pass, n_total = int(grid[\"pass_mask\"].sum()), grid[\"pass_mask\"].size\n    c1, c2 = st.columns(2)\n    c1.metric(\"合格領域の広さ\", f\"{n_pass} / {n_total} 点\", f\"{100*n_pass/n_total:.1f}%\")\n    if rec is None:\n        if opt_mode == \"robust\":\n            c2.error(\"合格領域なし。因子範囲か合格条件を見直してください。\")\n        else:\n            c2.error(\"変動範囲の箱が全域合格となる点がありません。±の幅を小さくするか合格条件を見直してください。\")\n        return\n    s = active_model.separation(peaks_hat, rec[\"T\"], rec[\"phi\"], rec[\"F\"], Vm, L_mm,\n                                target=TARGET, interfering=INTERFERING)\n    last = float(max(s[nm][\"tR\"] for nm in ALL_PEAKS))\n    # 推奨点での Rs の推定精度（フィット係数の共分散から誤差伝搬・モンテカルロ）\n    rsci = opt.rs_confidence(active_model, peaks_hat, diag, rec[\"T\"], rec[\"phi\"], rec[\"F\"],\n                             Vm, L_mm, target=TARGET, interfering=INTERFERING, n_samples=600)\n    # 基準ごとの補足（目的関数の達成値）\n    if opt_mode == \"robust\":\n        obj_line = f\"- 余裕（正規化距離）= {rec['margin']:.3f}\\n\"\n    elif opt_mode == \"fastest_tR\":\n        obj_line = f\"- 変動範囲全域が合格、t_R(TP) 最速 = {rec['objective']:.2f} 分\\n\"\n    else:\n        obj_line = f\"- 変動範囲全域が合格、ACN 消費量最小 = {rec['objective']:.3f} mL\\n\"\n    c2.success(\n        f\"**推奨条件（{mode_label}）**\\n\\n\"\n        f\"- T = {rec['T']:.1f} ℃\\n- φ = {rec['phi']:.3f}（ACN 分率）\\n\"\n        f\"- F = {rec['F']:.2f} mL/min\\n\"\n        f\"{obj_line}\\n\"\n        f\"→ Rs_min={float(s['Rs_min']):.2f} \"\n        f\"（95%CI {rsci['lo']:.2f}–{rsci['hi']:.2f}, ±{rsci['sd']:.2f}） \"\n        f\"/ t_R(TP)={float(s[TARGET]['tR']):.2f}分 / 最遅={last:.2f}分\"\n    )\n    if rsci[\"lo\"] \u003c float(criteria[\"Rs_min\"]):\n        c2.caption(\"⚠ Rs の95%信頼区間の下限が合格基準を下回ります（フィットの不確かさを考えると\"\n                   \"ギリギリ）。余裕のある条件か、データ追加（③D最適）での精度向上を検討してください。\")\n\n    st.subheader(f\"{header_prefix}3D デザインスペース\")\n    cloud_style = \"volume\"\n    cc2, cc3 = st.columns(2)\n    side_map = {\"自動\": \"auto\", \"手前\": \"low\", \"奥\": \"high\"}\n    side_lr = side_map[cc2.radio(\"T壁・φ壁（手前/奥）\", [\"自動\", \"手前\", \"奥\"],\n                                 key=header_prefix + \"wall_lr\")]\n    floor_map = {\"自動\": \"auto\", \"床\": \"low\", \"天井\": \"high\"}\n    side_fc = floor_map[cc3.radio(\"F壁（床/天井）\", [\"自動\", \"床\", \"天井\"],\n                                  key=header_prefix + \"wall_fc\")]\n    wall_side = {\"T\": side_lr, \"phi\": side_lr, \"F\": side_fc}\n    rc1, rc2 = st.columns(2)\n    surface_count = rc1.slider(\"雲の密度（層の数・大=濃く滑らか）\", 5, 40, 30, step=1,\n                               key=header_prefix + \"scount\")\n    rot_speed = rc2.select_slider(\"自動回転の速さ\", options=[\"遅い\", \"標準\", \"速い\"],\n                                  value=\"標準\", key=header_prefix + \"rot\")\n    rot_dur = {\"遅い\": 140, \"標準\": 80, \"速い\": 40}[rot_speed]\n    # 変動範囲を設定する基準（t_R最速 / ACN最小）のときは推奨点に ±δ の箱を重ねる\n    robust_box = None\n    if delta is not None and rec is not None:\n        robust_box = {\"center\": (rec[\"T\"], rec[\"phi\"], rec[\"F\"]), \"delta\": delta}\n    fig = ds.plot_designspace_3d(grid, rec, model_mod=active_model, peaks=peaks_hat,\n                                 factors=factors, Vm=Vm, L_mm=L_mm,\n                                 cloud_style=cloud_style, wall_side=wall_side,\n                                 surface_count=surface_count, rotate_duration_ms=rot_dur,\n                                 robust_box=robust_box)\n    st.plotly_chart(fig, use_container_width=True)\n    _box_note = (\"、破線の箱＝設定した変動範囲（この箱全域が合格になる推奨点）\" if robust_box else \"\")\n    st.caption(\"雲＝合格領域（Viridis: 紫=ギリギリ→黄=余裕大）、壁の線＝デザインスペース内のRs等高線5本\"\n               f\"（太黒線が Rs=2.0 の合格境界）、黒ドット＝推奨条件{_box_note}。左下の「▶ 自動回転」で回転。\")\n\n    rec_df = pd.DataFrame([{\n        \"T_degC\": rec[\"T\"], \"phi_ACN\": rec[\"phi\"], \"F_mL_min\": rec[\"F\"],\n        \"criterion\": mode_label,\n        \"margin_normalized\": rec.get(\"margin\", \"\"),\n        \"objective\": rec.get(\"objective\", \"\"),\n        \"Rs_min\": float(s[\"Rs_min\"]),\n        \"Rs_min_CI_lo\": rsci[\"lo\"], \"Rs_min_CI_hi\": rsci[\"hi\"], \"Rs_min_sd\": rsci[\"sd\"],\n        \"tR_TP_min\": float(s[TARGET][\"tR\"]), \"tR_last_min\": last,\n    }])\n    dc1, dc2 = st.columns(2)\n    dc1.download_button(\"推奨条件 CSV をDL\", rec_df.to_csv(index=False).encode(\"utf-8-sig\"),\n                        file_name=\"recommended_condition.csv\", mime=\"text/csv\",\n                        key=header_prefix + \"reccsv\")\n    dc2.download_button(\"3D グラフ HTML をDL\",\n                        fig.to_html(include_plotlyjs=\"cdn\", full_html=True).encode(\"utf-8\"),\n                        file_name=\"designspace_3d.html\", mime=\"text/html\",\n                        key=header_prefix + \"html\")\n\n    # 回転 GIF（kaleido＋Chrome が必要・生成に時間がかかる）\n    # kaleido が無い環境（stlite＝ブラウザ内 Pyodide）ではこの節ごと出さない。\n    if HAS_KALEIDO:\n        with st.expander(\"回転アニメーションを GIF で書き出す\"):\n            gif_frames = st.slider(\"フレーム数（多いほど滑らか・遅い）\", 12, 48, 24, step=4,\n                                   key=header_prefix + \"gifn\")\n            if st.button(\"GIF を生成\", key=header_prefix + \"gifbtn\"):\n                with st.spinner(\"GIF 生成中…（フレーム数×数秒）\"):\n                    try:\n                        gif = ds.rotation_gif_bytes(fig, n_frames=gif_frames,\n                                                    duration_ms=rot_dur)\n                        st.image(gif, caption=\"回転プレビュー\")\n                        st.download_button(\"回転 GIF をDL\", gif,\n                                           file_name=\"designspace_rotation.gif\",\n                                           mime=\"image/gif\", key=header_prefix + \"gifdl\")\n                    except Exception as e:\n                        st.error(f\"GIF 生成に失敗しました（kaleido/Chrome が必要）: {e}\")\n\n\n# ──────────────────────────────\n# タブ構成（各タブが自分の設定を持つ）\n# ──────────────────────────────\ntab1, tab2, tab3, tab_demo = st.tabs(\n    [\"① 計画\", \"② 解析\", \"③ D最適（任意）\", \"デモ\"])\n\n# ── ① 計画（データが無い段階＝範囲・ピーク・計画は手入力）──\nwith tab1:\n    s1, s2 = st.columns([1.15, 1])\n    with s1:\n        section_label(\"分離対象\")\n        basic_factor_inputs()\n    with s2:\n        section_label(\"実験計画\")\n        ccd_design_inputs()\n    st.divider()\n    _plan_desc = (\"Box-Behnken 計画（辺中点12＋中心点）\" if design_kind == \"bbd\"\n                  else \"中心複合計画（頂点8＋軸上6＋中心点）\")\n    st.caption(f\"{_plan_desc}。雛形をDLし、{len(ALL_PEAKS)} ピーク（{', '.join(ALL_PEAKS)}）の \"\n               \"t_R・W_h を記入 → ② で読み込みます。\")\n    ccd = design.ccd_design(factors, n_center=n_center, alpha=alpha_ccd, day=0, kind=design_kind).copy()\n    ccd.insert(0, \"run\", np.arange(1, len(ccd) + 1))\n    for col in RESPONSE_COLS:\n        ccd[col] = np.nan\n    st.dataframe(ccd[[\"run\", \"day\", \"type\", \"T\", \"phi\", \"F\"]], use_container_width=True)\n    st.download_button(f\"Day1 入力用 Excel 雛形をDL（{len(ccd)}本）\", to_excel_bytes(ccd),\n                       file_name=\"runs_day1_template.xlsx\",\n                       mime=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\")\n    st.plotly_chart(ds.plot_design_points_3d(ccd, factors=factors), use_container_width=True)\n    if design_kind == \"bbd\":\n        st.caption(\"水色=BBD点（辺中点）、緑=中心点、灰箱=指定範囲。全点が範囲内。\")\n    else:\n        st.caption(\"青=頂点、赤=軸上点、緑=中心点、灰箱=指定範囲。\"\n                   \"α=1.682 なら頂点が箱の角・軸上点は箱の外。\")\n\n# ── ② 解析（データがある段階＝範囲もピークもファイルから読む）──\nwith tab2:\n    s1, s2 = st.columns(2)\n    with s1:\n        section_label(\"カラム（→ V_m）\")\n        column_inputs()\n    with s2:\n        section_label(\"合格条件\")\n        criteria_inputs()\n    section_label(\"解析モデル\")\n    model_inputs()\n    st.caption(\"記入済みデータ（xlsx/csv、複数可）を読み込み → フィット → デザインスペース → 推奨条件。\"\n               \"**因子範囲とピーク構成はデータから自動判定**します（範囲＝T/φ/F 列の min–max、\"\n               \"ピーク＝tR_*/Wh_* 列）。**CCD だけで完結**します（③ D最適は任意）。\")\n    ups = st.file_uploader(\"記入済みデータ（1つでも複数でも可）\", type=[\"xlsx\", \"csv\"],\n                           accept_multiple_files=True, key=\"upall\")\n    if ups:\n        parsed, bad = [], []\n        for u in ups:\n            d, itf, allp, err = read_runs_auto(u)\n            (parsed.append((u.name, d, tuple(allp))) if d is not None\n             else bad.append((u.name, err)))\n        for name, err in bad:\n            st.error(f\"{name}: {err}\")\n        peak_sets = {p[2] for p in parsed}\n        if len(peak_sets) > 1:\n            st.error(\"複数ファイルでピーク構成（tR_*/Wh_* 列）が一致しません: \"\n                     + \" / \".join(\"{\" + \", \".join(ps) + \"}\" for ps in peak_sets))\n        elif parsed:\n            all_peaks = list(parsed[0][2])\n            interfering = [p for p in all_peaks if p != TARGET]\n            response_cols = [f\"tR_{p}\" for p in all_peaks] + [f\"Wh_{p}\" for p in all_peaks]\n            df_all = pd.concat([p[1] for p in parsed], ignore_index=True)\n            factors_data = factors_from_data(df_all, response_cols)\n            if factors_data is None:\n                st.error(\"T/φ/F のいずれかで範囲が取れません（全欠損、または最小＝最大）。\"\n                         \"測定値の入った行が各因子で2水準以上あるか確認してください。\")\n            else:\n                counts = df_all[\"day\"].value_counts().sort_index()\n                _rng = \"、\".join(\n                    f\"{k} {factors_data[k]['low']:g}–{factors_data[k]['high']:g}\"\n                    for k in (\"T\", \"phi\", \"F\"))\n                st.caption(\n                    f\"全 {len(df_all)} 行（day 別: \"\n                    + \", \".join(f\"day{int(k)}={v}\" for k, v in counts.items()) + \"）\"\n                    + f\"／自動判定 ピーク: {TARGET}（目的）＋ {', '.join(interfering)}\"\n                    + f\"／評価範囲（データ min–max）: {_rng}\")\n                st.dataframe(df_all.head(15), use_container_width=True)\n                run_fit_and_designspace(df_all, factors_data, all_peaks, interfering,\n                                        Vm, L_mm, header_prefix=\"\")\n\n# ── ③ D最適 augment（任意）──\nwith tab3:\n    section_label(\"D最適の設定\")\n    augment_inputs()\n    st.caption(\"**任意**。② の結果に、境界の予測精度を上げたいときだけ Day2 の追加点を生成します。\"\n               \"別日実施のため冒頭に橋渡し中心点（日間差測定用）を入れます。\")\n    basis = st.radio(\n        \"D最適の目的（基準）\",\n        [\"(A) 係数精度（モデル基準・データ不要）\",\n         \"(B) Rs境界の精度（局所D最適・Day1データ要）\"],\n        help=\"(A) はモデル係数全体を精密化（線形なので係数値に非依存・頑健）。\"\n             \"(B) は Rs=2 の境界近傍に点を集めてデザインスペース境界を直接精密化（Day1の係数推定を使う）。\")\n    use_rs = basis.startswith(\"(B)\")\n\n    peaks_for_aug = None\n    if use_rs:\n        st.caption(\"(B) は非線形な Rs の係数感度（ヤコビアン）を使うため、Day1 のフィット結果が必要です。\"\n                   \"記入済み Day1 データを読み込んでください。\")\n        up3 = st.file_uploader(\"記入済み Day1 データ（(B)用）\", type=[\"xlsx\", \"csv\"], key=\"up3\")\n        if up3 is not None:\n            df3, miss3 = read_runs(up3, REQUIRED_COLS)\n            if miss3:\n                st.error(f\"必要な列が足りません: {miss3}\")\n            else:\n                peaks_for_aug, _ = fit.fit_all(df3, Vm, L_mm, peak_names=ALL_PEAKS)\n                st.success(\"Day1 をフィットしました。Rs境界標的で追加点を生成します。\")\n    else:\n        st.caption(\"補足：保持モデルは係数について線形なので、(A)の追加点はフィット係数の値に依存しません\"\n                   \"（モデルの形が決まれば最適点が決まる）。データ不要で計画できます。\")\n\n    ccd_for_aug = design.ccd_design(factors, n_center=n_center, alpha=alpha_ccd, day=0, kind=design_kind)\n    aug_alpha = alpha_ccd if design_kind == \"ccd\" else 1.0   # BBD は候補格子を範囲内に\n    parts = []\n    if n_bridge > 0:\n        parts.append(design.bridge_center(factors, n_bridge=n_bridge, day=1))\n    if n_augment > 0:\n        if use_rs and peaks_for_aug is None:\n            st.info(\"(B) は Day1 データの読み込み後に追加点を表示します。\")\n        elif use_rs:\n            parts.append(design.augment_design(\n                factors, ccd_for_aug, n_augment, alpha=aug_alpha, day=1, method=\"rs_local\",\n                Vm=Vm, L_mm=L_mm, model_mod=model, peaks=peaks_for_aug,\n                Rs_target=criteria[\"Rs_min\"]))\n        else:\n            parts.append(design.augment_design(factors, ccd_for_aug, n_augment, alpha=aug_alpha,\n                                                day=1, method=\"model\", Vm=Vm, L_mm=L_mm))\n    if parts:\n        day2 = pd.concat(parts, ignore_index=True)\n        day2.insert(0, \"run\", np.arange(len(ccd_for_aug) + 1, len(ccd_for_aug) + 1 + len(day2)))\n        for col in RESPONSE_COLS:\n            day2[col] = np.nan\n        st.dataframe(day2[[\"run\", \"day\", \"type\", \"T\", \"phi\", \"F\"]], use_container_width=True)\n        st.caption(f\"Day2 = {len(day2)} 本（D最適 {n_augment} ＋ 橋渡し中心点 {n_bridge}）。\")\n        st.download_button(\"Day2 入力用 Excel 雛形をDL\", to_excel_bytes(day2),\n                           file_name=\"runs_day2_template.xlsx\",\n                           mime=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\")\n        both = pd.concat([ccd_for_aug.assign(type=ccd_for_aug[\"type\"]), day2], ignore_index=True)\n        st.plotly_chart(ds.plot_design_points_3d(both, factors=factors,\n                                                 title=\"Day1(CCD) ＋ Day2(D最適) の配置\"),\n                        use_container_width=True)\n        st.caption(\"Day1 の CCD 点に、Day2 の D最適追加点（橙）・橋渡し中心点（紫）を重ねた全体配置。\")\n    else:\n        st.warning(\"追加点・橋渡し中心点がどちらも 0 です。点数を増やしてください。\")\n\n# ── デモ ──\nwith tab_demo:\n    st.caption(\"実測データ（Day1 CCD 20本・TP+IP1+IP2）で ② 解析の流れをそのまま体験。\"\n               \"ピーク構成・因子範囲は②と同じくデータから自動判定、V_m はこのデータのカラムに固定します。\")\n    # ボタンは押した瞬間だけ True なので、状態を session_state に保持する。\n    if st.button(\"デモを実行\"):\n        st.session_state[\"demo_ran\"] = True\n    if st.session_state.get(\"demo_ran\"):\n        df_demo = pd.read_csv(os.path.join(HERE, \"data\", \"demo_runs.csv\"),\n                              keep_default_na=True, na_values=[\"\", \" \"])\n        # ②と同じロジックで、ピーク構成・因子範囲をデータから読む\n        interfering_demo, all_peaks_demo = peaks_from_columns(df_demo.columns)\n        response_cols_demo = ([f\"tR_{p}\" for p in all_peaks_demo]\n                              + [f\"Wh_{p}\" for p in all_peaks_demo])\n        factors_demo = factors_from_data(df_demo, response_cols_demo)\n        L_mm_demo = 100.0\n        Vm_demo = 0.66 * np.pi * (2.1 / 2.0) ** 2 * L_mm_demo / 1000.0   # 2.1×100mm, 空隙率0.66\n        _rng = \"、\".join(f\"{k} {factors_demo[k]['low']:g}–{factors_demo[k]['high']:g}\"\n                        for k in (\"T\", \"phi\", \"F\"))\n        st.caption(f\"自動判定 ピーク: {TARGET}（目的）＋ {', '.join(interfering_demo)}\"\n                   f\"／評価範囲（データ min–max）: {_rng}\")\n        st.dataframe(df_demo, use_container_width=True)\n        run_fit_and_designspace(df_demo, factors_demo, all_peaks_demo, interfering_demo,\n                                Vm_demo, L_mm_demo, header_prefix=\"デモ \")\n", "scripts/01_model.py": "\"\"\"\n01_model.py — HPLC 数理モデル（保持・幅・分離度）\n\nこのモジュールは「物理化学のメカニズムに基づく」中核ロジック。\n依存は numpy のみ（yaml も pandas も使わない）。\n→ 通常環境の import / Python in Excel のセル貼付 / Streamlit から呼ぶ、の3経路すべてで使える。\n\n記号の意味（全関数共通）:\n  T    : カラム温度 [℃]\n  phi  : 移動相の ACN 体積分率（0〜1、例 0.45 = 45% ACN）\n  F    : 流速 [mL/min]\n  Vm   : カラム死容量 [mL]（カラム内の移動相の体積）\n  L_mm : カラム長 [mm]\n  k    : 保持係数（ピークがどれだけ長く保持されるかの無次元量）\n  t_R  : 保持時間 [min]（ピークが出てくる時刻）\n  t_0  : ボイド時間 [min]（保持されない物質が出る時刻、t_0 = Vm/F）\n  N    : 理論段数（カラム効率。大きいほどピークが鋭い）\n  W_h  : 半値幅 [min]（ピーク高さ半分での幅）\n  W_b  : ベースライン幅 [min]（= 4σ。分離度 Rs の式で使う）\n  day  : 実験日（ブロック因子。0=Day1, 1=Day2 …）\n\n1ピークのパラメータは dict で持つ:\n  retention（保持）: a, b, c, d, e, delta\n    ln k = a + b/T_K + c*phi + d*phi^2 + e*phi/T_K + delta*day   （T_K = T+273.15 [K]）\n      a     : 切片\n      b     : 温度項の係数（ファントホッフ。b>0 なら低温ほど高保持）[K]\n      c     : 溶媒1次項の係数（LSS/Snyder。c\u003c0 なら ACN 増で低保持）\n      d     : 溶媒2次項の係数（曲がりの補正。不要なら 0）\n      e     : 温度×溶媒の交互作用項（溶媒傾き S が温度で変わる効果。\n              ピークごとに違うとクロスオーバーが起きる。不要なら 0）\n      delta : 日間差（ブロック項。別日のオフセット）\n  width（幅・保持時間比例モデル）: wc0, wc1\n    W_h = wc0 + wc1 · t_R      （W_h=半値幅 [min], t_R=保持時間 [min]）\n      wc0 : 切片\n      wc1 : t_R への傾き\n    根拠: W_h = √(8ln2)·t_R/√N で、理論段数 N は条件でほぼ一定（実データ CV 5〜13%）なので\n    W_h は t_R にほぼ比例する。AICc 後退法でも「W_h の最良の説明変数は t_R」と支持された\n    （van Deemter の u 項・φ・T 項は F 範囲が狭く効果を検出できず削除される）。\n    ベースライン幅は W_b = (4/√(8ln2))·W_h ≈ 1.699·W_h（ガウス近似で W_h と一定比）。\n\nすべての関数は scalar でも numpy 配列でも動く（グリッド評価のためベクトル化対応）。\n\"\"\"\n\nimport numpy as np\n\nKELVIN = 273.15          # ℃ → K の変換オフセット\nEIGHT_LN2 = 8.0 * np.log(2.0)   # = 5.545…（半値幅 ↔ 段数の換算定数）\nWB_OVER_WH = 4.0 / np.sqrt(EIGHT_LN2)   # W_b = 4t_R/√N, W_h=√(8ln2)t_R/√N → W_b ≈ 1.699·W_h\n\n\n# ──────────────────────────────\n# 保持（retention）\n# ──────────────────────────────\ndef retention_factor(T, phi, a, b, c, d=0.0, e=0.0, day=0, delta=0.0):\n    \"\"\"保持係数 k を返す。 ln k = a + b/T_K + c*phi + d*phi^2 + e*phi/T_K + delta*day\"\"\"\n    T_K = np.asarray(T, dtype=float) + KELVIN\n    phi_arr = np.asarray(phi, dtype=float)\n    ln_k = (a + b / T_K + c * phi_arr + d * phi_arr ** 2\n            + e * phi_arr / T_K + delta * day)\n    return np.exp(ln_k)\n\n\ndef void_time(Vm, F):\n    \"\"\"ボイド時間 t_0 = Vm / F [min]。\"\"\"\n    return Vm / F\n\n\ndef retention_time(T, phi, F, Vm, a, b, c, d=0.0, e=0.0, day=0, delta=0.0):\n    \"\"\"保持時間 t_R = (Vm/F)*(1+k) [min]。\"\"\"\n    k = retention_factor(T, phi, a, b, c, d, e, day, delta)\n    return (Vm / F) * (1.0 + k)\n\n\n# ──────────────────────────────\n# 幅・効率（band broadening）\n# ──────────────────────────────\ndef linear_velocity(F, Vm, L_mm):\n    \"\"\"線速度 u = L/t_0 = L*F/Vm [mm/min]。\"\"\"\n    return L_mm * F / Vm\n\n\ndef plate_count(T, phi, F, Vm, L_mm, A, B, C, D=0.0, E=0.0, G=0.0):\n    \"\"\"理論段数 N。拡張 van Deemter H = A + B/u + C*u + D*phi + E/T_K + G*phi^2、N = L/H。\n    D, E, G は既定 0（与えなければ従来の u のみ van Deemter と一致）。\"\"\"\n    u = linear_velocity(F, Vm, L_mm)\n    T_K = np.asarray(T, dtype=float) + KELVIN\n    phi_arr = np.asarray(phi, dtype=float)\n    H = A + B / u + C * u + D * phi_arr + E / T_K + G * phi_arr ** 2\n    return L_mm / H\n\n\ndef width_half_height(t_R, N):\n    \"\"\"半値幅 W_h = sqrt(8 ln2) * t_R / sqrt(N)。逆に N = 5.54*(t_R/W_h)^2。\"\"\"\n    return np.sqrt(EIGHT_LN2) * t_R / np.sqrt(N)\n\n\ndef width_baseline(t_R, N):\n    \"\"\"ベースライン幅 W_b = 4*t_R/sqrt(N)（= 4σ）。Rs の式で使う。\"\"\"\n    return 4.0 * t_R / np.sqrt(N)\n\n\ndef plate_count_from_width(t_R, W_h):\n    \"\"\"実測の半値幅 W_h から理論段数 N を逆算: N = 8ln2*(t_R/W_h)^2 = 5.54*(t_R/W_h)^2。\n    03_fit で「実測幅 → N → van Deemter フィット」に使う（width_half_height の逆関数）。\"\"\"\n    return EIGHT_LN2 * (t_R / W_h) ** 2\n\n\n# ──────────────────────────────\n# 1ピックの予測をまとめる\n# ──────────────────────────────\ndef predict_peak(peak, T, phi, F, Vm, L_mm, day=0):\n    \"\"\"1ピークの t_R, N, W_h, W_b を dict で返す。peak は上記パラメータの dict。\n    幅は保持時間比例モデル W_h = wc0 + wc1·t_R（N はほぼ一定という近似）。\"\"\"\n    tR = retention_time(\n        T, phi, F, Vm,\n        peak[\"a\"], peak[\"b\"], peak[\"c\"],\n        peak.get(\"d\", 0.0), peak.get(\"e\", 0.0), day, peak.get(\"delta\", 0.0),\n    )\n    Wh = np.maximum(peak[\"wc0\"] + peak[\"wc1\"] * tR, 1e-6)   # 外挿で負→微小正にクリップ\n    Wb = WB_OVER_WH * Wh\n    N = EIGHT_LN2 * (tR / Wh) ** 2                          # 参考（表示用）\n    return {\"tR\": tR, \"N\": N, \"Wh\": Wh, \"Wb\": Wb}\n\n\n# ──────────────────────────────\n# 分離度（resolution）— 化合物の同一性で定義（クロスオーバー対応）\n# ──────────────────────────────\ndef resolution(tR_a, Wb_a, tR_b, Wb_b):\n    \"\"\"Rs = 2*|t_R(a) - t_R(b)| / (Wb_a + Wb_b)。絶対値なので溶出順が入れ替わっても正しい。\"\"\"\n    return 2.0 * np.abs(tR_a - tR_b) / (Wb_a + Wb_b)\n\n\ndef separation(peaks, T, phi, F, Vm, L_mm, day=0, target=\"TP\", interfering=None):\n    \"\"\"\n    目的ピーク（target）と任意個の夾雑ピーク（interfering）の予測と Rs を返す。\n    各 Rs は化合物の同一性で固定（target と各 IP の間。絶対値でクロスオーバー対応）。\n    最適化目標は Rs_min = 全 IP に対する Rs の最小値。\n    interfering=None なら peaks のうち target 以外を全部使う。\n    戻り値: {target: 予測, 各IP名: 予測, 'Rs_each': {IP名:Rs}, 'Rs_min': ...,\n             （後方互換）該当すれば 'Rs1','Rs2' も付く}\n    \"\"\"\n    if interfering is None:\n        interfering = [k for k in peaks.keys() if k != target]\n    tp = predict_peak(peaks[target], T, phi, F, Vm, L_mm, day)\n    out = {target: tp}\n    rs_each = {}\n    rs_vals = []\n    for ip in interfering:\n        p = predict_peak(peaks[ip], T, phi, F, Vm, L_mm, day)\n        out[ip] = p\n        rs = resolution(tp[\"tR\"], tp[\"Wb\"], p[\"tR\"], p[\"Wb\"])\n        rs_each[ip] = rs\n        rs_vals.append(rs)\n    rs_min = rs_vals[0]\n    for r in rs_vals[1:]:\n        rs_min = np.minimum(rs_min, r)\n    out[\"Rs_each\"] = rs_each\n    out[\"Rs_min\"] = rs_min\n    if \"IP1\" in rs_each:\n        out[\"Rs1\"] = rs_each[\"IP1\"]\n    if \"IP2\" in rs_each:\n        out[\"Rs2\"] = rs_each[\"IP2\"]\n    return out\n\n\n# ──────────────────────────────\n# Rs 信頼区間用の係数サンプリング（04_optimize.rs_confidence から呼ばれる）\n# ──────────────────────────────\ndef sample_peaks(peaks, diagnostics, rng, target, interfering):\n    \"\"\"フィット係数の共分散から、保持・幅の係数を1セット乱数で引いた peaks dict を作る。\n    保持と幅は別フィット（ほぼ独立）なのでそれぞれの cov から個別にサンプルする。\n    多重共線で cov が縮退していても、Rs は安定な係数結合で決まるため正しくばらつきが伝わる。\"\"\"\n    out = {}\n    for nm in [target] + list(interfering):\n        p = dict(peaks[nm])\n        d = diagnostics[nm]\n        for keys, cov in ((\"ret_keys\", \"ret_cov\"), (\"wid_keys\", \"wid_cov\")):\n            klist = d.get(keys)\n            C = d.get(cov)\n            if not klist or C is None:\n                continue\n            mean = np.array([peaks[nm][k] for k in klist], dtype=float)\n            draw = rng.multivariate_normal(mean, np.atleast_2d(C))\n            for k, v in zip(klist, draw):\n                p[k] = float(v)\n        out[nm] = p\n    return out\n\n\n# ──────────────────────────────\n# 例示用パラメータ（実フィット前の動作確認・デモ用のダミー）\n# ──────────────────────────────\ndef example_peaks():\n    \"\"\"\n    動作確認・合成データ生成用の暫定パラメータ。\n    実際は 03_fit.py が実測データから推定した値で置き換える。\n    中水準（T=50, phi=0.45, F=0.6, Vm=0.24, L=100）で3ピークが ~7分付近・IP1\u003cTP\u003cIP2 になるよう設定。\n    \"\"\"\n    vd = {\"wc0\": 0.012, \"wc1\": 0.018}   # 幅 = wc0 + wc1·t_R（実データ回帰に近い例値）\n    return {\n        \"IP1\": {\"a\": -1.39, \"b\": 1800.0, \"c\": -3.2, \"d\": 0.0, \"e\": 0.0, \"delta\": 0.0, **vd},\n        \"TP\":  {\"a\": -0.49, \"b\": 1500.0, \"c\": -3.0, \"d\": 0.0, \"e\": 0.0, \"delta\": 0.0, **vd},\n        \"IP2\": {\"a\":  0.10, \"b\": 1300.0, \"c\": -2.8, \"d\": 0.0, \"e\": 0.0, \"delta\": 0.0, **vd},\n    }\n\n\nif __name__ == \"__main__\":\n    # 直接実行で中水準のサニティチェック: python scripts/01_model.py\n    peaks = example_peaks()\n    Vm, L = 0.24, 100.0\n    T, phi, F = 50.0, 0.45, 0.6\n    res = separation(peaks, T, phi, F, Vm, L)\n    print(f\"条件: T={T}℃, phi={phi}, F={F} mL/min, Vm={Vm} mL, L={L} mm\")\n    print(f\"t_0 = {void_time(Vm, F):.3f} min\")\n    for name in (\"IP1\", \"TP\", \"IP2\"):\n        p = res[name]\n        print(f\"  {name}: t_R={p['tR']:.3f} min, N={p['N']:.0f}, \"\n              f\"W_h={p['Wh']:.4f} min, W_b={p['Wb']:.4f} min\")\n    print(f\"Rs1(TP-IP1) = {res['Rs1']:.3f}\")\n    print(f\"Rs2(TP-IP2) = {res['Rs2']:.3f}\")\n    print(f\"Rs_min      = {res['Rs_min']:.3f}\")\n", "scripts/02_design.py": "\"\"\"\n02_design.py — 実験計画の生成（CCD ＋ 日のブロッキング ＋ D最適 augment）\n\n依存は numpy / pandas のみ（01_model には依存しない。DoE の幾何だけ扱う）。\n\n設計（references/decisions.md 指摘5）:\n  Day1: CCD = 頂点 2³=8 + 軸上点 6 + 中心点 6 = 20 本\n  Day2: D最適 augment + 中心点3本（Day1↔Day2 の日間差を橋渡し）\n  別日のため day をブロック列として持つ（0=Day1, 1=Day2 …）\n\n座標系:\n  coded（符号化）… 各因子を -alpha〜+alpha に正規化した値。中心=0。\n    factorial（頂点）: 各因子 ±1\n    axial（軸上点）  : 1因子だけ ±alpha、他は 0\n    center（中心点）  : すべて 0\n  real（実値）   … 実際の T[℃] / phi[ACN分率] / F[mL/min]。\n\nalpha（軸上点の距離）:\n  既定 1.0 = 面心複合計画（CCF）。軸上点も頂点も low/high に乗るので、\n  温度上限・ACN沸点などの「超えてはいけない範囲」を守れる（今回の制約向き）。\n  回転可能性を優先するなら alpha=(2^3)^(1/4)=1.682。この場合、頂点(±1)が\n  low/high に乗り、軸上点(±alpha)はその外側へ伸びる（範囲を超えるので注意）。\n\nreal への変換: real = center + coded * half_range,  half_range=(high-low)/2\n  → 頂点 factorial(±1) は center±half_range = low/high にちょうど乗る（標準的な規約）。\n  → 軸上点 axial(±alpha) は alpha=1 なら low/high、alpha>1 なら範囲の外側。\n\"\"\"\n\nimport itertools\n\nimport numpy as np\nimport pandas as pd\n\nFACTOR_NAMES = [\"T\", \"phi\", \"F\"]\n# 実測で埋める応答列（テンプレートに空欄で用意する）\nRESPONSE_COLS = [\"tR_IP1\", \"tR_TP\", \"tR_IP2\", \"Wh_IP1\", \"Wh_TP\", \"Wh_IP2\"]\n\n\n# ──────────────────────────────\n# 符号化 ↔ 実値\n# ──────────────────────────────\ndef coded_to_real(coded, low, center, high, alpha=None):\n    \"\"\"符号化値 coded を実値に変換。 real = center + coded*half_range。\n    頂点 ±1 が low/high に乗る標準規約（軸点 ±alpha は alpha>1 なら範囲外へ伸びる）。\n    alpha は受け取るが変換には使わない（呼び出し側の互換のため残す）。\"\"\"\n    half_range = (high - low) / 2.0\n    return center + np.asarray(coded, dtype=float) * half_range\n\n\ndef _factor_specs(factors):\n    \"\"\"config の factors dict から (low, center, high) を取り出す。\"\"\"\n    return {f: (factors[f][\"low\"], factors[f][\"center\"], factors[f][\"high\"])\n            for f in FACTOR_NAMES}\n\n\n# ──────────────────────────────\n# CCD（Day1）\n# ──────────────────────────────\ndef ccd_coded(n_center=6, alpha=1.0):\n    \"\"\"CCD の符号化計画を返す（type 列付き）。頂点8 + 軸上6 + 中心n。\"\"\"\n    rows = []\n    # 頂点（factorial）: ±1 の全組み合わせ 2³=8\n    for combo in itertools.product([-1.0, 1.0], repeat=3):\n        rows.append((\"factorial\", *combo))\n    # 軸上点（axial）: 1因子だけ ±alpha\n    for i in range(3):\n        for sign in (-alpha, alpha):\n            pt = [0.0, 0.0, 0.0]\n            pt[i] = sign\n            rows.append((\"axial\", *pt))\n    # 中心点（center）\n    for _ in range(n_center):\n        rows.append((\"center\", 0.0, 0.0, 0.0))\n    cols = [\"type\"] + [f\"c{f}\" for f in FACTOR_NAMES]\n    return pd.DataFrame(rows, columns=cols)\n\n\ndef bbd_coded(n_center=6):\n    \"\"\"Box-Behnken 設計（3因子）の符号化計画を返す（type 列付き）。\n    各因子ペアの辺中点 2²×3=12 + 中心点 n。頂点(角)も軸上点(範囲外)も使わない。\n    → 全点が範囲内に収まり、角条件が物理的に無理な系（高温×高ACN など）に向く。\"\"\"\n    rows = []\n    for i, j in [(0, 1), (0, 2), (1, 2)]:        # 因子ペア（残り1因子は0）\n        for a in (-1.0, 1.0):\n            for b in (-1.0, 1.0):\n                pt = [0.0, 0.0, 0.0]\n                pt[i], pt[j] = a, b\n                rows.append((\"bbd\", *pt))\n    for _ in range(n_center):\n        rows.append((\"center\", 0.0, 0.0, 0.0))\n    cols = [\"type\"] + [f\"c{f}\" for f in FACTOR_NAMES]\n    return pd.DataFrame(rows, columns=cols)\n\n\ndef design_coded(kind=\"ccd\", n_center=6, alpha=1.0):\n    \"\"\"計画タイプを選んで符号化計画を返す。kind=\"bbd\" なら Box-Behnken、それ以外は CCD。\"\"\"\n    if kind == \"bbd\":\n        return bbd_coded(n_center=n_center)\n    return ccd_coded(n_center=n_center, alpha=alpha)\n\n\ndef ccd_design(factors, n_center=6, alpha=1.0, day=0, kind=\"ccd\"):\n    \"\"\"実験計画を実値つきの DataFrame で返す（Day1 用）。\n    kind=\"ccd\"（既定）で中心複合計画、kind=\"bbd\" で Box-Behnken。\"\"\"\n    coded = design_coded(kind=kind, n_center=n_center, alpha=alpha)\n    specs = _factor_specs(factors)\n    df = coded.copy()\n    for f in FACTOR_NAMES:\n        low, center, high = specs[f]\n        df[f] = coded_to_real(coded[f\"c{f}\"], low, center, high, alpha)\n    df.insert(0, \"day\", day)\n    return df\n\n\ndef bridge_center(factors, n_bridge=3, day=1):\n    \"\"\"Day2 冒頭の橋渡し中心点（日間差の測定用）。\"\"\"\n    coded = pd.DataFrame(\n        [(\"center\", 0.0, 0.0, 0.0)] * n_bridge,\n        columns=[\"type\"] + [f\"c{f}\" for f in FACTOR_NAMES],\n    )\n    specs = _factor_specs(factors)\n    df = coded.copy()\n    for f in FACTOR_NAMES:\n        low, center, high = specs[f]\n        df[f] = coded_to_real(coded[f\"c{f}\"], low, center, high, alpha=1.0)\n    df.insert(0, \"day\", day)\n    df[\"type\"] = \"bridge_center\"\n    return df\n\n\n# ──────────────────────────────\n# D最適 augment（Day2）\n# ──────────────────────────────\ndef second_order_model_matrix(coded_array):\n    \"\"\"符号化点 (n×3) → 2次応答曲面モデルの計画行列 X。\n    列: [1, x1, x2, x3, x1², x2², x3², x1x2, x1x3, x2x3]（10列）。\"\"\"\n    x = np.atleast_2d(np.asarray(coded_array, dtype=float))\n    x1, x2, x3 = x[:, 0], x[:, 1], x[:, 2]\n    ones = np.ones_like(x1)\n    return np.column_stack([\n        ones, x1, x2, x3,\n        x1 ** 2, x2 ** 2, x3 ** 2,\n        x1 * x2, x1 * x3, x2 * x3,\n    ])\n\n\ndef d_optimal_augment(existing_coded, n_add, alpha=1.0, grid_levels=5, ridge=1e-6):\n    \"\"\"\n    既存計画 existing_coded（n×3 の符号化点）に、D最適基準で n_add 点を貪欲追加する。\n    候補は [-alpha, alpha]^3 の格子（grid_levels 段）。\n    各ステップで予測分散（レバレッジ x'·(X'X)^-1·x）最大の候補を選ぶ\n    ＝ det(X'X) を最も増やす点（行列式補題による貪欲 Fedorov）。\n    戻り値: 追加点の符号化座標 (n_add×3)。\n    \"\"\"\n    levels = np.linspace(-alpha, alpha, grid_levels)\n    candidates = np.array(list(itertools.product(levels, levels, levels)))\n\n    chosen = np.atleast_2d(np.asarray(existing_coded, dtype=float)).copy()\n    added = []\n    for _ in range(n_add):\n        X = second_order_model_matrix(chosen)\n        M = X.T @ X + ridge * np.eye(X.shape[1])   # ridge で初期の特異性を回避\n        Minv = np.linalg.inv(M)\n        Xc = second_order_model_matrix(candidates)\n        # 各候補のレバレッジ = diag(Xc · Minv · Xc^T)\n        leverage = np.einsum(\"ij,jk,ik->i\", Xc, Minv, Xc)\n        best = int(np.argmax(leverage))\n        pick = candidates[best]\n        added.append(pick)\n        chosen = np.vstack([chosen, pick])\n    return np.array(added)\n\n\nKELVIN = 273.15   # ℃ → K（01_model と同じ。モデル基準 D最適で 1/T_K を作るため）\n\n\ndef mechanistic_model_matrix(T, phi, F, Vm, L_mm):\n    \"\"\"\n    メカニズムモデルの説明変数で計画行列 X を作る（実値ベース）。\n    保持: ln k = a + b/T_K + c·φ + d·φ² + e·φ/T_K  → 列 [1, 1/T_K, φ, φ², φ/T_K]\n    幅  : H = A + B/u + C·u（u=L·F/Vm）            → 列 [1/u, u]（切片は保持側と共有）\n    合わせて [1, 1/T_K, φ, φ², φ/T_K, 1/u, u] の7列。\n    ※ これらは係数について線形なので、X は係数の値に依存しない（フィット前でも作れる）。\n    \"\"\"\n    T = np.asarray(T, dtype=float)\n    phi = np.asarray(phi, dtype=float)\n    F = np.asarray(F, dtype=float)\n    T_K = T + KELVIN\n    u = L_mm * F / Vm\n    ones = np.ones_like(T_K)\n    return np.column_stack([\n        ones, 1.0 / T_K, phi, phi ** 2, phi / T_K,   # 保持モデルの説明変数\n        1.0 / u, u,                                   # 幅モデルの説明変数\n    ])\n\n\ndef d_optimal_augment_model(existing_real, n_add, factors, Vm, L_mm,\n                            alpha=1.0, grid_levels=5, ridge=1e-9):\n    \"\"\"\n    メカニズムモデル基準の D最適 augment（実値）。\n    既存点 existing_real（列 T,phi,F）に、モデルの説明変数で det(X'X) を最大化する\n    点を貪欲に n_add 個追加する（各ステップでレバレッジ最大の候補を採用）。\n    候補は符号化格子 [-alpha,alpha]^3（grid_levels 段）を実値へ変換したもの。\n    戻り値: 追加点の実値 DataFrame（列 T,phi,F と符号化 cT,cphi,cF）。\n    レバレッジは列の線形変換に不変なので、説明変数のスケール差（1/T_K 対 u 等）は無害。\n    \"\"\"\n    specs = _factor_specs(factors)\n    levels = np.linspace(-alpha, alpha, grid_levels)\n    cand_coded = np.array(list(itertools.product(levels, levels, levels)))\n    cand_real = np.column_stack([\n        coded_to_real(cand_coded[:, i], *specs[f], alpha)\n        for i, f in enumerate(FACTOR_NAMES)\n    ])\n\n    chosen = np.atleast_2d(np.asarray(existing_real, dtype=float)).copy()\n    Xc = mechanistic_model_matrix(cand_real[:, 0], cand_real[:, 1], cand_real[:, 2], Vm, L_mm)\n    added_real, added_coded = [], []\n    for _ in range(n_add):\n        X = mechanistic_model_matrix(chosen[:, 0], chosen[:, 1], chosen[:, 2], Vm, L_mm)\n        M = X.T @ X + ridge * np.eye(X.shape[1])\n        Minv = np.linalg.inv(M)\n        leverage = np.einsum(\"ij,jk,ik->i\", Xc, Minv, Xc)\n        best = int(np.argmax(leverage))\n        added_real.append(cand_real[best])\n        added_coded.append(cand_coded[best])\n        chosen = np.vstack([chosen, cand_real[best]])\n\n    out = pd.DataFrame(added_real, columns=FACTOR_NAMES)\n    for i, f in enumerate(FACTOR_NAMES):\n        out[f\"c{f}\"] = [c[i] for c in added_coded]\n    return out\n\n\n# ──────────────────────────────\n# (B) Rs境界標的の局所D最適（フィット済みモデルのヤコビアンを使う）\n# ──────────────────────────────\nRET_KEYS = [\"a\", \"b\", \"c\", \"d\", \"e\"]   # 保持パラメータ\nWID_KEYS = [\"wc0\", \"wc1\"]   # 幅パラメータ（W_h = wc0 + wc1·t_R）\nPEAK_NAMES = [\"IP1\", \"TP\", \"IP2\"]\n\n\ndef _rs_param_jacobian(model_mod, peaks, T, phi, F, Vm, L_mm, rel_eps=1e-4):\n    \"\"\"\n    各候補点での Rs_min のパラメータ偏微分（ヤコビアン）を数値微分で返す。\n    戻り値: (候補数 × パラメータ数) 行列。\n    パラメータは3ピーク×(a,b,c,d,e,A,B,C)を平坦化。Rs が非線形なので係数値に依存する。\n    \"\"\"\n    import copy\n    base = np.atleast_1d(model_mod.separation(peaks, T, phi, F, Vm, L_mm)[\"Rs_min\"]).astype(float)\n    cols = []\n    for pk in PEAK_NAMES:\n        for key in RET_KEYS + WID_KEYS:\n            val = peaks[pk].get(key, 0.0)\n            step = rel_eps * (abs(val) if val != 0 else 1.0)\n            p2 = copy.deepcopy(peaks)\n            p2[pk][key] = val + step\n            rs2 = np.atleast_1d(model_mod.separation(p2, T, phi, F, Vm, L_mm)[\"Rs_min\"]).astype(float)\n            cols.append((rs2 - base) / step)\n    return np.column_stack(cols)   # (ncand, nparams)\n\n\ndef d_optimal_augment_rs(existing_real, n_add, factors, model_mod, peaks, Vm, L_mm,\n                         Rs_target=2.0, band=0.5, alpha=1.0, grid_levels=5, ridge=1e-9):\n    \"\"\"\n    Rs境界標的の局所D最適。フィット済み peaks の Rs ヤコビアンで det(JᵀWJ) を貪欲最大化。\n    境界 Rs≈Rs_target 近傍を重視するため、候補を w=exp(-((Rs-target)/band)²) で重み付ける。\n    → デザインスペース境界の予測精度を直接上げる点を選ぶ。peaks（Day1フィット結果）が必要。\n    \"\"\"\n    specs = _factor_specs(factors)\n    levels = np.linspace(-alpha, alpha, grid_levels)\n    cand_coded = np.array(list(itertools.product(levels, levels, levels)))\n    cand_real = np.column_stack([\n        coded_to_real(cand_coded[:, i], *specs[f], alpha)\n        for i, f in enumerate(FACTOR_NAMES)\n    ])\n    cT, cP, cF = cand_real[:, 0], cand_real[:, 1], cand_real[:, 2]\n\n    # 候補のヤコビアンと境界近傍の重み\n    Jc = _rs_param_jacobian(model_mod, peaks, cT, cP, cF, Vm, L_mm)\n    Rs_c = np.atleast_1d(model_mod.separation(peaks, cT, cP, cF, Vm, L_mm)[\"Rs_min\"])\n    w_c = np.exp(-((Rs_c - Rs_target) / band) ** 2)\n    Jw = Jc * w_c[:, None]\n\n    # 既存点の情報（同じく境界重みつき）で M を初期化\n    ex = np.atleast_2d(np.asarray(existing_real, dtype=float))\n    Je = _rs_param_jacobian(model_mod, peaks, ex[:, 0], ex[:, 1], ex[:, 2], Vm, L_mm)\n    Rs_e = np.atleast_1d(model_mod.separation(peaks, ex[:, 0], ex[:, 1], ex[:, 2], Vm, L_mm)[\"Rs_min\"])\n    we = np.exp(-((Rs_e - Rs_target) / band) ** 2)\n    Jew = Je * we[:, None]\n    M = Jew.T @ Jew + ridge * np.eye(Jw.shape[1])\n\n    added_real, added_coded = [], []\n    for _ in range(n_add):\n        Minv = np.linalg.inv(M)\n        leverage = np.einsum(\"ij,jk,ik->i\", Jw, Minv, Jw)   # 重み込みレバレッジ\n        best = int(np.argmax(leverage))\n        added_real.append(cand_real[best])\n        added_coded.append(cand_coded[best])\n        M = M + np.outer(Jw[best], Jw[best])                # 採用点で情報を更新\n    out = pd.DataFrame(added_real, columns=FACTOR_NAMES)\n    for i, f in enumerate(FACTOR_NAMES):\n        out[f\"c{f}\"] = [c[i] for c in added_coded]\n    return out\n\n\ndef augment_design(factors, existing_df, n_add, alpha=1.0, day=1, method=\"model\",\n                   Vm=0.24, L_mm=100.0, model_mod=None, peaks=None,\n                   Rs_target=2.0, band=0.5):\n    \"\"\"\n    D最適 augment を実値つき DataFrame で返す（Day2 用、橋渡し中心点は別途）。\n    method=\"model\"   : (A) メカニズムモデル基準（係数精度・係数値に非依存）。Vm,L_mm が必要。\n    method=\"rs_local\": (B) Rs境界標的の局所D最適。model_mod と peaks（Day1フィット結果）が必要。\n    method=\"poly\"    : 符号化空間の2次多項式基準（従来）。\n    \"\"\"\n    if method == \"rs_local\":\n        if model_mod is None or peaks is None:\n            raise ValueError(\"method='rs_local' には model_mod と peaks（フィット結果）が必要です。\")\n        existing_real = existing_df[FACTOR_NAMES].to_numpy()\n        df = d_optimal_augment_rs(existing_real, n_add, factors, model_mod, peaks,\n                                  Vm, L_mm, Rs_target=Rs_target, band=band, alpha=alpha)\n        df.insert(0, \"type\", \"d_optimal_rs\")\n        df.insert(0, \"day\", day)\n        return df\n\n    if method == \"model\":\n        existing_real = existing_df[FACTOR_NAMES].to_numpy()\n        df = d_optimal_augment_model(existing_real, n_add, factors, Vm, L_mm, alpha=alpha)\n        df.insert(0, \"type\", \"d_optimal\")\n        df.insert(0, \"day\", day)\n        return df\n\n    existing_coded = existing_df[[f\"c{f}\" for f in FACTOR_NAMES]].to_numpy()\n    add_coded = d_optimal_augment(existing_coded, n_add, alpha=alpha)\n    df = pd.DataFrame(add_coded, columns=[f\"c{f}\" for f in FACTOR_NAMES])\n    df.insert(0, \"type\", \"d_optimal\")\n    specs = _factor_specs(factors)\n    for f in FACTOR_NAMES:\n        low, center, high = specs[f]\n        df[f] = coded_to_real(df[f\"c{f}\"], low, center, high, alpha)\n    df.insert(0, \"day\", day)\n    return df\n\n\n# ──────────────────────────────\n# 計画表の組み立て（テンプレート出力）\n# ──────────────────────────────\ndef build_runs_template(factors, n_center=6, alpha=1.0,\n                        n_bridge=3, n_augment=0, method=\"model\",\n                        Vm=0.24, L_mm=100.0, kind=\"ccd\"):\n    \"\"\"Day1 計画（＋任意で Day2 橋渡し中心点・D最適）を1枚に結合し、応答列を空欄で付ける。\n    kind=\"ccd\"（既定）/ \"bbd\"。D最適の候補格子は範囲内に留めるため BBD では alpha=1.0 を使う。\"\"\"\n    aug_alpha = alpha if kind == \"ccd\" else 1.0\n    parts = [ccd_design(factors, n_center=n_center, alpha=alpha, day=0, kind=kind)]\n    if n_bridge > 0:\n        parts.append(bridge_center(factors, n_bridge=n_bridge, day=1))\n    if n_augment > 0:\n        parts.append(augment_design(factors, parts[0], n_augment, alpha=aug_alpha,\n                                     day=1, method=method, Vm=Vm, L_mm=L_mm))\n    df = pd.concat(parts, ignore_index=True)\n    df.insert(0, \"run\", np.arange(1, len(df) + 1))\n    for col in RESPONSE_COLS:\n        df[col] = np.nan          # 実測で埋める空欄\n    return df\n\n\nif __name__ == \"__main__\":\n    # config.example.yaml と同じ因子設定で動作確認（yaml は読まずベタ書き＝Excel貼付可）\n    factors = {\n        \"T\":   {\"low\": 40, \"center\": 50, \"high\": 60},\n        \"phi\": {\"low\": 0.38, \"center\": 0.45, \"high\": 0.52},\n        \"F\":   {\"low\": 0.4, \"center\": 0.6, \"high\": 0.8},\n    }\n    plan = build_runs_template(factors, n_center=6, alpha=1.0,\n                               n_bridge=3, n_augment=8)\n    print(\"各ブロック・種別の本数:\")\n    print(plan.groupby([\"day\", \"type\"]).size())\n    print(f\"\\n合計 {len(plan)} 本\")\n    print(\"\\n先頭の数行:\")\n    cols = [\"run\", \"day\", \"type\", \"T\", \"phi\", \"F\"]\n    print(plan[cols].head(12).to_string(index=False))\n\n    out = \"data/runs_template.csv\"\n    plan.to_csv(out, index=False)\n    print(f\"\\nテンプレートを書き出しました: {out}（応答列 {RESPONSE_COLS} は空欄）\")\n", "scripts/03_fit.py": "\"\"\"\n03_fit.py — 実測データからモデルパラメータを推定\n\n依存: numpy / pandas / statsmodels。\n\nフィットの考え方（どちらもパラメータについて線形 → 普通の重回帰でOK）:\n\n  ◆ 保持（1ピークごと）\n    実測 t_R から保持係数へ:  k = t_R*F/Vm − 1   （t_0 = Vm/F より）\n    応答 y = ln k を次の回帰式に当てる（OLS）:\n      ln k = a + b·(1/T_K) + c·φ + d·φ² + e·(φ/T_K) + δ·day\n      → 説明変数は [1, 1/T_K, φ, φ², φ/T_K, day]、係数が a,b,c,d,e,δ\n\n  ◆ 幅（1ピークごと）\n    実測 W_h から段数へ:  N = 5.54·(t_R/W_h)²、 段高 H = L/N\n    線速度 u = L·F/Vm。次の van Deemter を当てる（OLS）:\n      H = A + B·(1/u) + C·u\n      → 説明変数は [1, 1/u, u]、係数が A,B,C\n\n出力は 01_model.py が使うパラメータ dict（peak ごとに a..e, delta, A,B,C）。\n\"\"\"\n\nimport numpy as np\nimport pandas as pd\nimport statsmodels.api as sm\n\nKELVIN = 273.15                  # 01_model と同じ定数（貼付独立のため再掲）\nEIGHT_LN2 = 8.0 * np.log(2.0)\n\nPEAKS = [\"IP1\", \"TP\", \"IP2\"]\n\n\n# ──────────────────────────────\n# 実測 → 中間量\n# ──────────────────────────────\ndef k_from_tR(tR, F, Vm):\n    \"\"\"保持係数 k = t_R/t_0 − 1 = t_R*F/Vm − 1。\"\"\"\n    return tR * F / Vm - 1.0\n\n\ndef N_from_width(tR, Wh):\n    \"\"\"半値幅 → 理論段数 N = 5.54·(t_R/W_h)²。\"\"\"\n    return EIGHT_LN2 * (tR / Wh) ** 2\n\n\ndef linear_velocity(F, Vm, L_mm):\n    \"\"\"線速度 u = L·F/Vm [mm/min]。\"\"\"\n    return L_mm * F / Vm\n\n\n# ──────────────────────────────\n# 保持フィット\n# ──────────────────────────────\ndef fit_retention(df, peak, Vm, include_d=True, include_e=True, include_day=True):\n    \"\"\"1ピークの保持パラメータを OLS で推定。(params_dict, statsmodels結果) を返す。\"\"\"\n    tR = df[f\"tR_{peak}\"].to_numpy(dtype=float)\n    T = df[\"T\"].to_numpy(dtype=float)\n    phi = df[\"phi\"].to_numpy(dtype=float)\n    F = df[\"F\"].to_numpy(dtype=float)\n    day = df[\"day\"].to_numpy(dtype=float)\n\n    T_K = T + KELVIN\n    y = np.log(k_from_tR(tR, F, Vm))\n\n    cols = {\"a\": np.ones_like(T_K), \"b\": 1.0 / T_K, \"c\": phi}\n    if include_d:\n        cols[\"d\"] = phi ** 2\n    if include_e:\n        cols[\"e\"] = phi / T_K\n    if include_day:\n        cols[\"delta\"] = day\n    X = np.column_stack(list(cols.values()))\n    res = sm.OLS(y, X).fit()\n\n    fitted = dict(zip(cols.keys(), res.params))\n    params = {key: fitted.get(key, 0.0) for key in [\"a\", \"b\", \"c\", \"d\", \"e\", \"delta\"]}\n    return params, res\n\n\n# ──────────────────────────────\n# 幅フィット\n# ──────────────────────────────\ndef fit_width(df, peak, Vm, L_mm):\n    \"\"\"1ピークの幅パラメータ (wc0, wc1) を OLS で推定。W_h = wc0 + wc1·t_R。\n    理論段数 N はほぼ一定→ W_h は t_R にほぼ比例（AICc 後退法でも t_R が最良説明変数と支持）。\n    Vm, L_mm は署名互換のため受け取るが本モデルでは未使用。\"\"\"\n    tR = df[f\"tR_{peak}\"].to_numpy(dtype=float)\n    Wh = df[f\"Wh_{peak}\"].to_numpy(dtype=float)\n    X = np.column_stack([np.ones_like(tR), tR])\n    res = sm.OLS(Wh, X).fit()\n    wc0, wc1 = res.params\n    return {\"wc0\": float(wc0), \"wc1\": float(wc1)}, res\n\n\n# ──────────────────────────────\n# 調整済み R² ／ Q²（予測 R²・LOO/PRESS ベース）\n# ──────────────────────────────\ndef adj_r2(res):\n    \"\"\"自由度調整済み R²。パラメータ数に対する当てはまりの水増しを補正。\n    statsmodels の rsquared_adj をそのまま返す（サンプル/パラメータ不足なら nan → None）。\"\"\"\n    v = float(res.rsquared_adj)\n    return None if not np.isfinite(v) else v\n\n\ndef q2_loo(res):\n    \"\"\"Q²（予測 R²）= 1 − PRESS/SS_total。OLS なら LOO 残差は e_i/(1−h_ii) で\n    再フィット不要に求まる（h_ii=ハット行列の対角=レバレッジ）。\n    Q² が R² に近いほど過学習が小さく予測力が高い。h_ii≈1 の点があれば計算不能→None。\"\"\"\n    y = np.asarray(res.model.endog, dtype=float)\n    resid = np.asarray(res.resid, dtype=float)\n    infl = res.get_influence()\n    h = np.asarray(infl.hat_matrix_diag, dtype=float)\n    if np.any(h > 1.0 - 1e-8):\n        return None\n    press = float(np.sum((resid / (1.0 - h)) ** 2))\n    sst = float(np.sum((y - y.mean()) ** 2))\n    if sst \u003c= 0:\n        return None\n    return 1.0 - press / sst\n\n\n# ──────────────────────────────\n# lack-of-fit 検定（純誤差 vs 当てはまり不足）\n# ──────────────────────────────\ndef lack_of_fit(cond_df, res):\n    \"\"\"\n    同一条件の繰り返し（レプリケート）から純誤差を測り、モデルの「当てはまり不足\n    (lack of fit)」を F 検定する。cond_df は fit に使った行（列 T,phi,F）、res は\n    その OLS 結果（res.model.endog=応答, res.resid=残差）。\n\n    分散分解:  SS残差(SSE) = 純誤差(SSPE) + 当てはまり不足(SSLOF)\n      SSPE = Σ_group Σ_i (y_i − ȳ_group)²   （同一条件グループ内の変動）, df_PE = Σ(n_g−1)\n      SSLOF = SSE − SSPE,  df_LOF = df_E − df_PE\n      F = (SSLOF/df_LOF) / (SSPE/df_PE),  p = P(F > 観測値)\n\n    解釈: p が小さい(\u003c0.05)ほど「モデルでは説明しきれない系統的なズレがある」＝要注意。\n          p が大きければモデルは棄却されない（当てはまり不足の証拠なし）。\n    レプリケートが無い / 自由度が足りなければ検定不能 → None。\n    \"\"\"\n    import collections\n    from scipy import stats as _stats\n    y = np.asarray(res.model.endog, dtype=float)\n    sse = float(np.sum(np.asarray(res.resid, dtype=float) ** 2))\n    df_e = float(res.df_resid)\n    keys = list(zip(np.round(cond_df[\"T\"].to_numpy(float), 6),\n                    np.round(cond_df[\"phi\"].to_numpy(float), 6),\n                    np.round(cond_df[\"F\"].to_numpy(float), 6)))\n    groups = collections.defaultdict(list)\n    for i, k in enumerate(keys):\n        groups[k].append(i)\n    ss_pe, df_pe = 0.0, 0.0\n    for idx in groups.values():\n        if len(idx) > 1:\n            yy = y[idx]\n            ss_pe += float(np.sum((yy - yy.mean()) ** 2))\n            df_pe += len(idx) - 1\n    df_lof = df_e - df_pe\n    if df_pe \u003c 1 or df_lof \u003c 1:\n        return None\n    ss_lof = max(sse - ss_pe, 0.0)\n    ms_pe = ss_pe / df_pe\n    ms_lof = ss_lof / df_lof\n    F = ms_lof / ms_pe if ms_pe > 0 else float(\"inf\")\n    p = float(_stats.f.sf(F, df_lof, df_pe))\n    return {\"F\": float(F), \"p\": p, \"df_lof\": int(df_lof), \"df_pe\": int(df_pe)}\n\n\n# ──────────────────────────────\n# 3ピークまとめてフィット\n# ──────────────────────────────\ndef _rmse(a, b):\n    return float(np.sqrt(np.mean((np.asarray(a) - np.asarray(b)) ** 2)))\n\n\ndef fit_all(df, Vm, L_mm, include_d=True, include_e=True, include_day=True,\n            peak_names=None):\n    \"\"\"\n    指定ピーク（既定は IP1/TP/IP2）の保持＋幅をフィットし、peaks dict と診断を返す。\n    夾雑ピーク数は peak_names で任意に指定できる。\n    各ピークは欠損（NaN）行をそのピークだけ除外してフィットする（部分欠損に頑健）。\n    戻り値: (peaks_dict, diagnostics_dict)\n      peaks_dict[name] = {a,b,c,d,e,delta,wc0,wc1}\n      diagnostics[name] = {'R2_retention','R2_width','RMSE_tR_min','RMSE_Wh_min','n'}\n\n    注: 実験範囲が狭く保持の説明変数は多重共線。個別係数は一意に決まりにくいが、\n    予測（t_R・W_h・Rs）は安定する。品質は係数でなく予測スケールの RMSE で見るのが妥当。\n    \"\"\"\n    names = PEAKS if peak_names is None else list(peak_names)\n    peaks = {}\n    diagnostics = {}\n    for name in names:\n        sub = df.dropna(subset=[f\"tR_{name}\", f\"Wh_{name}\"])  # 欠損行を除外\n        ret, ret_res = fit_retention(sub, name, Vm, include_d, include_e, include_day)\n        wid, wid_res = fit_width(sub, name, Vm, L_mm)   # 幅 = wc0 + wc1·t_R\n        peaks[name] = {**ret, **wid}\n\n        # 予測スケールでの当てはまり（本当に意味のある指標）\n        F = sub[\"F\"].to_numpy(dtype=float)\n        tR_meas = sub[f\"tR_{name}\"].to_numpy(dtype=float)\n        Wh_meas = sub[f\"Wh_{name}\"].to_numpy(dtype=float)\n        tR_hat = (Vm / F) * (1.0 + np.exp(ret_res.fittedvalues))   # ln k → k → t_R\n        Wh_hat = np.asarray(wid_res.fittedvalues)                  # W_h = wc0 + wc1·t_R\n\n        # 係数の共分散（誤差伝搬で Rs の信頼区間を出すのに使う）。\n        # OLS の cov_params = σ²(XᵀX)⁻¹。列の並びは下のキー順と一致する。\n        ret_keys = [\"a\", \"b\", \"c\"] + ([\"d\"] if include_d else []) \\\n            + ([\"e\"] if include_e else []) + ([\"delta\"] if include_day else [])\n        wid_keys = [\"wc0\", \"wc1\"]\n\n        diagnostics[name] = {\n            \"R2_retention\": ret_res.rsquared,\n            \"R2_width\": wid_res.rsquared,\n            \"RMSE_tR_min\": _rmse(tR_hat, tR_meas),\n            \"RMSE_Wh_min\": _rmse(Wh_hat, Wh_meas),\n            \"n\": len(sub),\n            \"ret_keys\": ret_keys,\n            \"ret_cov\": np.asarray(ret_res.cov_params()),\n            \"wid_keys\": wid_keys,\n            \"wid_cov\": np.asarray(wid_res.cov_params()),\n            \"LOF_retention\": lack_of_fit(sub, ret_res),   # 保持モデルの当てはまり不足\n            \"LOF_width\": lack_of_fit(sub, wid_res),        # 幅モデルの当てはまり不足\n            \"adjR2_retention\": adj_r2(ret_res),\n            \"adjR2_width\": adj_r2(wid_res),\n            \"Q2_retention\": q2_loo(ret_res),\n            \"Q2_width\": q2_loo(wid_res),\n            # 各係数の p 値（列順＝キー順）。保持は多重共線で個別係数は不安定＝参考程度。\n            \"ret_pvalues\": dict(zip(ret_keys, np.asarray(ret_res.pvalues, dtype=float))),\n            \"wid_pvalues\": dict(zip(wid_keys, np.asarray(wid_res.pvalues, dtype=float))),\n        }\n    return peaks, diagnostics\n\n\n# ──────────────────────────────\n# 合成データ（動作確認用）\n# ──────────────────────────────\ndef simulate_measurements(model_mod, true_peaks, design_df, Vm, L_mm,\n                          noise_tR=0.01, noise_Wh=0.002, seed=0, peak_names=None):\n    \"\"\"既知パラメータ true_peaks から t_R・W_h を生成し、計測ノイズを足す（フィット検証用）。\n    peak_names で対象ピークを指定（既定は IP1/TP/IP2）。\"\"\"\n    rng = np.random.default_rng(seed)\n    df = design_df.copy()\n    T = df[\"T\"].to_numpy(dtype=float)\n    phi = df[\"phi\"].to_numpy(dtype=float)\n    F = df[\"F\"].to_numpy(dtype=float)\n    day = df[\"day\"].to_numpy(dtype=float)\n    names = PEAKS if peak_names is None else list(peak_names)\n    for name in names:\n        pred = model_mod.predict_peak(true_peaks[name], T, phi, F, Vm, L_mm, day=day)\n        df[f\"tR_{name}\"] = pred[\"tR\"] + rng.normal(0, noise_tR, len(df))\n        df[f\"Wh_{name}\"] = pred[\"Wh\"] + rng.normal(0, noise_Wh, len(df))\n    return df\n\n\ndef _load_module(path, name):\n    \"\"\"数字始まりのファイル（01_model.py 等）を import する補助。\"\"\"\n    import importlib.util\n    spec = importlib.util.spec_from_file_location(name, path)\n    mod = importlib.util.module_from_spec(spec)\n    spec.loader.exec_module(mod)\n    return mod\n\n\nif __name__ == \"__main__\":\n    import os\n    here = os.path.dirname(__file__)\n    model_mod = _load_module(os.path.join(here, \"01_model.py\"), \"model01\")\n    design_mod = _load_module(os.path.join(here, \"02_design.py\"), \"design02\")\n\n    Vm, L = 0.24, 100.0\n    factors = {\n        \"T\":   {\"low\": 40, \"center\": 50, \"high\": 60},\n        \"phi\": {\"low\": 0.38, \"center\": 0.45, \"high\": 0.52},\n        \"F\":   {\"low\": 0.4, \"center\": 0.6, \"high\": 0.8},\n    }\n    # Day1 CCD + Day2(橋渡し3 + D最適8)。日間差の復元も見たいので2日分。\n    design = design_mod.build_runs_template(factors, n_center=6, alpha=1.0,\n                                            n_bridge=3, n_augment=8)\n\n    # 既知の「真の」パラメータ（交互作用 e と日間差 delta を意図的に入れる）\n    true_peaks = model_mod.example_peaks()\n    for name in PEAKS:\n        true_peaks[name][\"e\"] = 80.0          # 交互作用（クロスオーバー源）\n        true_peaks[name][\"delta\"] = 0.03      # Day2 のオフセット\n\n    sim = simulate_measurements(model_mod, true_peaks, design, Vm, L, seed=1)\n    peaks_hat, diag = fit_all(sim, Vm, L)\n\n    print(\"=== 予測の当てはまり（意味のある指標）===\")\n    for name in PEAKS:\n        d = diag[name]\n        print(f\"[{name}]  R²(保持)={d['R2_retention']:.4f}  R²(幅)={d['R2_width']:.4f}  \"\n              f\"RMSE(t_R)={d['RMSE_tR_min']*60:.2f}秒  RMSE(W_h)={d['RMSE_Wh_min']*60:.2f}秒\")\n\n    # 真値で再現した Rs と、推定モデルで再現した Rs を全格子で比較\n    print(\"\\n=== Rs の予測一致（真モデル vs 推定モデル）===\")\n    rng_T = np.linspace(40, 60, 5)\n    rng_phi = np.linspace(0.38, 0.52, 5)\n    TT, PP = np.meshgrid(rng_T, rng_phi)\n    true_rs = model_mod.separation(true_peaks, TT, PP, 0.6, Vm, L)[\"Rs_min\"]\n    hat_rs = model_mod.separation(peaks_hat, TT, PP, 0.6, Vm, L)[\"Rs_min\"]\n    print(f\"  Rs_min RMSE（格子全体, F=0.6固定）= {_rmse(true_rs, hat_rs):.4f}\")\n    print(f\"  真の Rs_min 範囲 = {true_rs.min():.2f} 〜 {true_rs.max():.2f}\")\n", "scripts/04_optimize.py": "\"\"\"\n04_optimize.py — デザインスペース判定 ＋ 最大余裕点（推奨条件）\n\n依存は numpy のみ（01_model を呼ぶ。Python in Excel にも貼れる構成）。\n\nやること（references/decisions.md 指摘2・指摘4）:\n  1. T-φ-F 空間を格子で評価し、各点が合格条件を満たすか判定する\n       合格条件（config.acceptance_criteria）:\n         (a) Rs_min = min{Rs1, Rs2} ≥ Rs_min_th        （分離できているか）\n         (b) t_R(TP) ≤ tR_TP_max                       （目的ピークが時間内に出るか）\n         (c) max(t_R 全3本) ≤ tR_last_max              （最遅ピークが洗浄前に出るか）\n       → 3つ全部 True の点の集合が「デザインスペース（合格領域）」。\n  2. その合格領域の中で「境界から最も遠い点」＝最大余裕点を推奨条件として返す（ICH Q8）。\n       境界からの距離 = 各因子を正規化した空間での、最寄りの不合格点までの距離。\n       これが最大の点ほど、条件がブレても合格に留まりやすい（最もロバスト）。\n\n「余裕（margin）」の測り方:\n  各因子を範囲幅で 0〜1 に正規化してから距離を測る（単位の違いを吸収）。\n  例: T は 40〜60℃ を 0〜1、φ は 0.38〜0.52 を 0〜1 に。\n  合格点 p の余裕 = min( 全ての不合格点との正規化距離 )。\n  ＝「どの方向にブレたら最初に不合格になるか、その一番近い崖までの距離」。\n  この余裕が最大の合格点を選ぶ。\n\"\"\"\n\nimport numpy as np\n\n\n# ──────────────────────────────\n# 格子の生成\n# ──────────────────────────────\ndef expand_factors(factors, extrapolate=0.0):\n    \"\"\"各因子の範囲を上下に extrapolate 割合だけ広げた factors を返す（外挿評価用）。\n    F は流速なので下限が正に留まるよう 0.05 でクランプする。\"\"\"\n    out = {}\n    for f, spec in factors.items():\n        lo, hi = spec[\"low\"], spec[\"high\"]\n        span = hi - lo\n        new_lo, new_hi = lo - extrapolate * span, hi + extrapolate * span\n        if f == \"F\":\n            new_lo = max(new_lo, 0.05)\n        out[f] = {**spec, \"low\": new_lo, \"high\": new_hi}\n    return out\n\n\ndef make_grid(factors, n=21):\n    \"\"\"\n    factors（T/phi/F の low,high を持つ dict）から (n×n×n) の評価格子を作る。\n    戻り値: (TT, PP, FF) いずれも 1次元に潰した同じ長さの配列 ＋ 各軸の値。\n    \"\"\"\n    T_ax = np.linspace(factors[\"T\"][\"low\"], factors[\"T\"][\"high\"], n)\n    P_ax = np.linspace(factors[\"phi\"][\"low\"], factors[\"phi\"][\"high\"], n)\n    F_ax = np.linspace(factors[\"F\"][\"low\"], factors[\"F\"][\"high\"], n)\n    TT, PP, FF = np.meshgrid(T_ax, P_ax, F_ax, indexing=\"ij\")\n    return TT.ravel(), PP.ravel(), FF.ravel(), (T_ax, P_ax, F_ax)\n\n\ndef _in_range_mask(T, phi, F, factors):\n    \"\"\"各点が元の因子範囲（検証済み領域）内かどうかの bool 配列。\"\"\"\n    return (\n        (T >= factors[\"T\"][\"low\"] - 1e-9) & (T \u003c= factors[\"T\"][\"high\"] + 1e-9)\n        & (phi >= factors[\"phi\"][\"low\"] - 1e-9) & (phi \u003c= factors[\"phi\"][\"high\"] + 1e-9)\n        & (F >= factors[\"F\"][\"low\"] - 1e-9) & (F \u003c= factors[\"F\"][\"high\"] + 1e-9)\n    )\n\n\n# ──────────────────────────────\n# 合格判定\n# ──────────────────────────────\ndef evaluate_grid(model_mod, peaks, factors, Vm, L_mm, criteria, n=21, day=0,\n                  extrapolate=0.0, target=\"TP\", interfering=None):\n    \"\"\"\n    格子の全点で目的＋夾雑ピークを予測し、合格条件を判定する（夾雑ピーク数は任意）。\n    extrapolate>0 のとき、評価格子だけ因子範囲の外まで広げる（外挿。検証外の予測）。\n    戻り値 dict:\n      T, phi, F        : 各点の実条件（1次元配列）\n      Rs_min           : 各点の 全夾雑ピークに対する Rs の最小\n      tR_TP, tR_last   : 目的ピーク保持時間 / 最遅ピーク保持時間（全ピークの max）\n      pass_mask        : 合格条件を満たすか（bool 配列）＝デザインスペース\n      in_range         : 元の因子範囲（検証済み）内か。推奨条件はここからのみ選ぶ\n      axes             : (T_ax, P_ax, F_ax)\n    \"\"\"\n    if interfering is None:\n        interfering = [k for k in peaks.keys() if k != target]\n    eval_factors = expand_factors(factors, extrapolate) if extrapolate > 0 else factors\n    T, phi, F, axes = make_grid(eval_factors, n=n)\n    in_range = _in_range_mask(T, phi, F, factors)\n    sep = model_mod.separation(peaks, T, phi, F, Vm, L_mm, day=day,\n                               target=target, interfering=interfering)\n\n    tR_TP = sep[target][\"tR\"]\n    # クロスオーバー対応: 最遅ピークは全ピークの max（溶出順が入れ替わるため）\n    tR_last = np.maximum.reduce([sep[nm][\"tR\"] for nm in [target] + list(interfering)])\n\n    # 合格条件: Rs_min と t_R(TP)。\n    # tR_last_max は「データ取り段階の洗浄前制約」であってデザインスペースの合否ではないため、\n    # criteria に与えられた場合のみ任意で適用する（既定は不使用）。\n    pass_mask = (sep[\"Rs_min\"] >= criteria[\"Rs_min\"]) & (tR_TP \u003c= criteria[\"tR_TP_max\"])\n    if criteria.get(\"tR_last_max\") is not None:\n        pass_mask = pass_mask & (tR_last \u003c= criteria[\"tR_last_max\"])\n    return {\n        \"T\": T, \"phi\": phi, \"F\": F,\n        \"Rs_min\": sep[\"Rs_min\"],\n        \"tR_TP\": tR_TP, \"tR_last\": tR_last,\n        \"pass_mask\": pass_mask,\n        \"in_range\": in_range,\n        \"axes\": axes,\n    }\n\n\n# ──────────────────────────────\n# 最大余裕点\n# ──────────────────────────────\ndef _normalize(T, phi, F, factors):\n    \"\"\"各因子を範囲幅で 0〜1 に正規化（距離計算で単位差を吸収）。\"\"\"\n    def norm(x, f):\n        lo, hi = factors[f][\"low\"], factors[f][\"high\"]\n        return (np.asarray(x, dtype=float) - lo) / (hi - lo)\n    return np.column_stack([norm(T, \"T\"), norm(phi, \"phi\"), norm(F, \"F\")])\n\n\ndef _edge_distance(pass_pts):\n    \"\"\"各点から因子範囲の壁（正規化 0 と 1 の面）までの最短距離。\n    各軸で min(x, 1-x)、その軸間の最小が最寄りの壁。範囲の端ほど 0 に近い。\"\"\"\n    return np.minimum(pass_pts, 1.0 - pass_pts).min(axis=1)\n\n\ndef _grid_bounds(grid_result):\n    \"\"\"評価格子の外周（外挿込みの実際の探索範囲）を factors 形式で返す。\"\"\"\n    T_ax, P_ax, F_ax = grid_result[\"axes\"]\n    return {\"T\": {\"low\": float(T_ax[0]), \"high\": float(T_ax[-1])},\n            \"phi\": {\"low\": float(P_ax[0]), \"high\": float(P_ax[-1])},\n            \"F\": {\"low\": float(F_ax[0]), \"high\": float(F_ax[-1])}}\n\n\ndef max_margin_point(grid_result, factors, restrict_range=True):\n    \"\"\"\n    合格領域の中で「最寄りの崖まで最も遠い」点を返す（最大余裕点）。\n    崖 = 合格条件を破る不合格点 ＋ 探索範囲の壁（端。外挿を避けるため崖扱い）。\n    restrict_range=True … 推奨は検証済みの元範囲内（in_range）からのみ選ぶ。\n    restrict_range=False … 外挿格子を含む全域から選ぶ（壁は外挿込みの格子外周）。\n    戻り値 dict: T, phi, F（推奨条件）, margin（正規化空間での余裕）, index。\n    合格点が無ければ None。\n    \"\"\"\n    mask = grid_result[\"pass_mask\"]\n    in_range = grid_result.get(\"in_range\")\n    if restrict_range and in_range is not None:\n        cand_mask = mask & in_range\n        norm_factors = factors          # 元範囲で正規化（壁＝元範囲の端）\n    else:\n        cand_mask = mask\n        norm_factors = _grid_bounds(grid_result)  # 外挿込み格子外周を壁にする\n    if not cand_mask.any():\n        return None\n\n    coords = _normalize(grid_result[\"T\"], grid_result[\"phi\"], grid_result[\"F\"], norm_factors)\n    pass_pts = coords[cand_mask]        # 推奨候補は元範囲内の合格点のみ\n    fail_pts = coords[~mask]            # 崖は不合格点（外挿域も含む）\n\n    # (1) 因子範囲の壁までの距離（端も崖として扱う）\n    edge_margin = _edge_distance(pass_pts)\n\n    # (2) 最寄りの不合格点までの距離。\n    #     KDTree（最近傍探索）で O(N log N) に。細かい格子でも高速。\n    if len(fail_pts) == 0:\n        fail_margin = np.full(len(pass_pts), np.inf)\n    else:\n        try:\n            from scipy.spatial import cKDTree\n            fail_margin, _ = cKDTree(fail_pts).query(pass_pts, k=1)\n        except ImportError:\n            # scipy が無い環境（Excel貼付など）はチャンク全ペアで代替\n            fail_margin = np.empty(len(pass_pts))\n            chunk = 2000\n            for s in range(0, len(pass_pts), chunk):\n                blk = pass_pts[s:s + chunk]\n                d = np.linalg.norm(blk[:, None, :] - fail_pts[None, :, :], axis=2)\n                fail_margin[s:s + chunk] = d.min(axis=1)\n\n    # 余裕 = 2種類の崖までの距離の小さい方（最初にぶつかる崖まで）\n    margins = np.minimum(edge_margin, fail_margin)\n    best_local = int(np.argmax(margins))\n    margin = float(margins[best_local])\n\n    # 候補部分集合の index を全体 index に戻す\n    global_idx = np.flatnonzero(cand_mask)[best_local]\n    return {\n        \"T\": float(grid_result[\"T\"][global_idx]),\n        \"phi\": float(grid_result[\"phi\"][global_idx]),\n        \"F\": float(grid_result[\"F\"][global_idx]),\n        \"margin\": margin,\n        \"index\": int(global_idx),\n    }\n\n\n# ──────────────────────────────\n# 変動範囲（ロバスト箱）を満たす点の中での最適化\n# ──────────────────────────────\ndef _reshape_to_grid(arr, axes):\n    \"\"\"1次元（meshgrid indexing=\"ij\" 由来）を (nT, nφ, nF) の3次元に戻す。\"\"\"\
